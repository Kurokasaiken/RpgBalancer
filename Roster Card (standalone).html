document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

inecap=\"round\"><\u002Fpath><path d=\"M7.2 5.3C8.05 5.05 8.98 4.9 10 4.9C14 4.9 17 8 18 10C17.55 10.9 16.9 11.85 16.05 12.7M13.3 13.9C12.3 14.5 11.2 14.9 10 14.9C6 14.9 3 11.8 2 10C2.55 8.9 3.4 7.75 4.55 6.85\" stroke=\"#9a8246\" stroke-width=\"1.4\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M8.4 8.5C8.05 8.9 7.85 9.42 7.85 10C7.85 11.18 8.82 12.15 10 12.15C10.58 12.15 11.1 11.95 11.5 11.6\" stroke=\"#9a8246\" stroke-width=\"1.4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ornate divider -->\n      <div style=\"{{ dividerStyle }}\"><\u002Fdiv>\n\n      <!-- cards -->\n      <div style=\"display:flex;flex-direction:column;gap:12px;\">\n        <sc-for list=\"{{ cards }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <div style=\"{{ c.wrapStyle }}\" onmouseenter=\"{{ c.onEnter }}\" onmouseleave=\"{{ c.onLeave }}\">\n\n            <!-- hover rail -->\n            <div style=\"{{ c.railStyle }}\"><\u002Fdiv>\n\n            <!-- card body -->\n            <div style=\"position:relative;overflow:hidden;border-radius:14px;padding:16px 20px;display:grid;grid-template-columns:196px 1fr 56px;gap:22px;align-items:center;background:linear-gradient(160deg, rgba(216,177,62,0.05) 0%, rgba(20,12,7,0.2) 45%, rgba(6,4,3,0.3) 100%);box-shadow:inset 0 1px 0 rgba(216,177,62,0.12), inset 0 2px 12px rgba(0,0,0,0.4), inset 0 -1px 0 rgba(0,0,0,0.4);cursor:grab;\">\n\n              <!-- card nebula -->\n              <div style=\"{{ c.nebulaStyle }}\"><\u002Fdiv>\n\n              <!-- active corner diamond -->\n              <sc-if value=\"{{ c.active }}\" hint-placeholder-val=\"{{ true }}\">\n                <svg width=\"9\" height=\"9\" viewBox=\"0 0 10 10\" style=\"position:absolute;top:11px;right:12px;filter:drop-shadow(0 0 3px rgba(240,207,106,0.6));\"><path d=\"M5 0.6L9.4 5L5 9.4L0.6 5Z\" fill=\"{{ c.diamondFill }}\"><\u002Fpath><\u002Fsvg>\n              <\u002Fsc-if>\n\n              <!-- identity -->\n              <div style=\"position:relative;\">\n                <div style=\"font-family:'Cinzel',serif;font-weight:700;font-size:20px;line-height:1.1;color:#ede0c4;text-shadow:0 1px 0 rgba(0,0,0,0.7), 0 -1px 0 rgba(240,207,106,0.16);\">{{ c.name }}<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:8px;margin-top:8px;\">\n                  <span style=\"{{ c.dotStyle }}\"><\u002Fspan>\n                  <span style=\"font-family:system-ui,sans-serif;font-size:10px;letter-spacing:0.24em;text-transform:uppercase;color:#9a8246;\">{{ c.role }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <!-- bars -->\n              <div style=\"position:relative;\">\n                <!-- HP -->\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;\">\n                  <span style=\"font-family:system-ui,sans-serif;font-size:10px;letter-spacing:0.2em;color:#9a8246;\">HP<\u002Fspan>\n                  <span style=\"font-family:system-ui,sans-serif;font-size:10px;letter-spacing:0.08em;color:#9a8246;\">{{ c.hpText }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"position:relative;height:8px;border-radius:5px;overflow:hidden;background:rgba(6,4,3,0.8);box-shadow:inset 0 1px 3px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(216,177,62,0.06);\">\n                  <div style=\"{{ c.hpFill }}\">\n                    <div style=\"position:absolute;top:0;left:0;right:0;height:2px;background:rgba(255,255,255,0.2);border-radius:5px 5px 0 0;\"><\u002Fdiv>\n                    <div style=\"{{ c.hpShimmer }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <!-- Stamina -->\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px;\">\n                  <span style=\"font-family:system-ui,sans-serif;font-size:10px;letter-spacing:0.2em;color:#9a8246;\">STAMINA<\u002Fspan>\n                  <span style=\"font-family:system-ui,sans-serif;font-size:10px;letter-spacing:0.08em;color:#9a8246;\">{{ c.staText }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"position:relative;height:8px;border-radius:5px;overflow:hidden;background:rgba(6,4,3,0.8);box-shadow:inset 0 1px 3px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(216,177,62,0.06);\">\n                  <div style=\"{{ c.staFill }}\">\n                    <div style=\"position:absolute;top:0;left:0;right:0;height:2px;background:rgba(255,255,255,0.2);border-radius:5px 5px 0 0;\"><\u002Fdiv>\n                    <div style=\"{{ c.staShimmer }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <!-- portrait -->\n              <div style=\"{{ c.portraitStyle }}\">\n                <span style=\"{{ c.initialStyle }}\">{{ c.initial }}<\u002Fspan>\n              <\u002Fdiv>\n\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 940, &quot;height&quot;: 560 },\n  &quot;accentColor&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#d8b13e&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#d8b13e&quot;, &quot;#c0453e&quot;, &quot;#8a5cd0&quot;, &quot;#5aa86a&quot;], &quot;section&quot;: &quot;Theme&quot; },\n  &quot;ambience&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 100, &quot;min&quot;: 0, &quot;max&quot;: 160, &quot;step&quot;: 10, &quot;unit&quot;: &quot;%&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Atmosphere&quot; },\n  &quot;livingBars&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Atmosphere&quot; },\n  &quot;ornateFrame&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Frame&quot; },\n  &quot;hoverLift&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 2, &quot;min&quot;: 0, &quot;max&quot;: 8, &quot;step&quot;: 1, &quot;unit&quot;: &quot;px&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Interaction&quot; }\n}\">\nclass Component extends DCLogic {\n  state = { hovered: -1 };\n\n  renderVals() {\n    const accent = this.props.accentColor ?? '#d8b13e';\n    const amb = (this.props.ambience ?? 100) / 100;\n    const living = this.props.livingBars ?? true;\n    const ornate = this.props.ornateFrame ?? true;\n    const lift = this.props.hoverLift ?? 2;\n\n    const hexToRgb = (h) => { h = String(h).replace('#', ''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };\n    const rgba = (h, a) => { const [r, g, b] = hexToRgb(h); return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; };\n    const lighten = (h, amt) => { const [r, g, b] = hexToRgb(h); const L = (v) => Math.round(v + (255 - v) * amt); const hx = (v) => v.toString(16).padStart(2, '0'); return '#' + hx(L(r)) + hx(L(g)) + hx(L(b)); };\n    const accentBright = lighten(accent, 0.38);\n\n    const RAW = [\n      { name: 'Giggiolillo', role: 'Eroe attivo', status: 'active', hp: 195, hpMax: 195, stamina: 100, initial: 'G', active: true },\n      { name: 'Salvatrice',  role: 'Disponibile', status: 'ok',     hp: 142, hpMax: 180, stamina: 64,  initial: 'S', active: false },\n      { name: 'Baldassarre', role: 'Ferito',      status: 'hurt',   hp: 38,  hpMax: 160, stamina: 28,  initial: 'B', active: false },\n    ];\n\n    const hovered = this.state.hovered;\n\n    const dotColor = (s) => s === 'hurt' ? '#d98a4a' : s === 'dead' ? '#c0392b' : '#7bc96f';\n    const dotGlow  = (s) => s === 'hurt' ? 'rgba(217,138,74,0.7)' : s === 'dead' ? 'rgba(192,57,49,0.7)' : 'rgba(123,201,111,0.7)';\n\n    const cards = RAW.map((c, i) => {\n      const hpPct = Math.round((c.hp / c.hpMax) * 100);\n      const low = hpPct < 30;\n      const isH = hovered === i;\n\n      // wrapper: hover transform + active/hover ring\n      let ring = 'none';\n      if (c.active) ring = '0 0 0 1px ' + rgba(accent, 0.3);\n      if (isH) ring = '0 0 0 1px ' + rgba(accent, 0.28) + ', 0 10px 34px ' + rgba(accent, 0.08);\n\n      const wrapStyle = {\n        position: 'relative',\n        borderRadius: '14px',\n        transform: isH ? 'translateY(-' + lift + 'px)' : 'translateY(0)',\n        boxShadow: ring,\n        transition: 'transform 300ms ease, box-shadow 300ms ease',\n        willChange: 'transform',\n      };\n\n      const railStyle = {\n        position: 'absolute',\n        left: '-2px',\n        top: '20%',\n        height: '60%',\n        width: isH ? '2px' : '0px',\n        background: 'linear-gradient(180deg, transparent, ' + accentBright + ', transparent)',\n        boxShadow: isH ? '0 0 8px ' + rgba(accentBright, 0.55) : 'none',\n        borderRadius: '2px',\n        transition: 'width 300ms ease, box-shadow 300ms ease',\n        zIndex: 2,\n      };\n\n      const nebulaStyle = {\n        position: 'absolute',\n        inset: '0',\n        pointerEvents: 'none',\n        background: 'radial-gradient(ellipse 180px 120px at 78% 30%, ' + rgba(accent, (c.active ? 0.14 : 0.06) * amb) + ', transparent 70%)',\n        mixBlendMode: 'screen',\n        opacity: c.active ? 1 : 0.7,\n      };\n\n      const portraitStyle = {\n        width: '56px', height: '56px', borderRadius: '50%',\n        display: 'flex', alignItems: 'center', justifyContent: 'center',\n        background: 'radial-gradient(circle at 38% 32%, #2a1810, #0a0503)',\n        boxShadow: 'inset 0 1px 4px rgba(0,0,0,0.5), 0 0 12px ' + rgba(accent, 0.22 * (0.6 + amb * 0.4)),\n        border: '1.5px solid ' + accent,\n      };\n      const initialStyle = {\n        fontFamily: \"'Cinzel', serif\", fontWeight: 700, fontSize: '24px',\n        color: accentBright, textShadow: '0 1px 2px rgba(0,0,0,0.6)',\n      };\n\n      const dotStyle = {\n        width: '7px', height: '7px', borderRadius: '50%',\n        background: dotColor(c.status),\n        boxShadow: '0 0 7px ' + dotGlow(c.status),\n        display: 'inline-block',\n        animation: c.active ? 'dot-pulse 2.4s ease-in-out infinite' : 'none',\n        willChange: 'transform, opacity',\n      };\n\n      const hpFill = {\n        position: 'absolute', top: 0, left: 0, height: '100%',\n        width: hpPct + '%', borderRadius: '5px',\n        background: low ? 'linear-gradient(90deg, #9e5a4a, #d98a4a)' : 'linear-gradient(90deg, #4a9e5a, #7bc96f)',\n        boxShadow: (low ? '0 0 10px rgba(217,138,74,' + (isH ? '0.5' : '0.4') + ')' : '0 0 10px rgba(123,201,111,' + (isH ? '0.5' : '0.35') + ')'),\n        overflow: 'hidden',\n        transition: 'box-shadow 300ms ease',\n      };\n\n      const staPct = c.stamina;\n      const staFill = {\n        position: 'absolute', top: 0, left: 0, height: '100%',\n        width: staPct + '%', borderRadius: '5px',\n        background: 'linear-gradient(90deg, #b8862a, #e0b23e)',\n        boxShadow: '0 0 10px rgba(224,178,62,' + (isH ? '0.42' : '0.3') + ')',\n        overflow: 'hidden',\n        transition: 'box-shadow 300ms ease',\n      };\n\n      const shimmer = (delay) => (living ? {\n        position: 'absolute', top: 0, left: 0,\n        width: '30%', height: '100%',\n        background: 'linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent)',\n        animation: 'bar-shimmer 5s ease-in-out infinite',\n        animationDelay: delay + 's',\n        willChange: 'transform',\n      } : { display: 'none' });\n\n      return {\n        name: c.name,\n        role: c.role,\n        initial: c.initial,\n        active: c.active,\n        diamondFill: accentBright,\n        hpText: c.hp + '/' + c.hpMax,\n        staText: c.stamina + '%',\n        wrapStyle, railStyle, nebulaStyle, dotStyle, portraitStyle, initialStyle,\n        hpFill, staFill,\n        hpShimmer: shimmer(i * 1.7),\n        staShimmer: shimmer(i * 1.7 + 0.8),\n        onEnter: () => this.setState({ hovered: i }),\n        onLeave: () => this.setState({ hovered: -1 }),\n      };\n    });\n\n    const fireflies = [\n      { left: '14%', size: 4, dur: 13, delay: 0 },\n      { left: '38%', size: 3, dur: 16, delay: 3.5 },\n      { left: '58%', size: 4, dur: 14, delay: 6 },\n      { left: '76%', size: 3, dur: 17, delay: 1.8 },\n      { left: '90%', size: 3, dur: 15, delay: 8.5 },\n    ].map((f) => ({\n      style: {\n        position: 'absolute',\n        left: f.left,\n        bottom: '-10px',\n        width: f.size + 'px',\n        height: f.size + 'px',\n        borderRadius: '50%',\n        background: lighten(accent, 0.6),\n        filter: 'blur(0.5px)',\n        boxShadow: '0 0 6px ' + rgba(lighten(accent, 0.6), 0.75),\n        opacity: 0,\n        animation: 'firefly ' + f.dur + 's ease-in-out infinite',\n        animationDelay: f.delay + 's',\n        willChange: 'transform, opacity',\n      },\n    }));\n\n    const atmoStyle = { position: 'absolute', inset: '0', borderRadius: '20px', overflow: 'hidden', pointerEvents: 'none', opacity: Math.min(1, amb) };\n    const titleStyle = { fontFamily: \"'Cinzel', serif\", fontWeight: 600, fontSize: '15px', letterSpacing: '0.34em', color: accent };\n    const dividerStyle = { display: ornate ? 'block' : 'none', height: '1px', margin: '0 2px 20px', background: 'linear-gradient(90deg, transparent, ' + rgba(accent, 0.32) + ' 20%, ' + rgba(accent, 0.32) + ' 80%, transparent)' };\n    const cornerStroke = accent;\n    const cornerWrap = { display: ornate ? 'block' : 'none' };\n\n    return { cards, fireflies, atmoStyle, titleStyle, dividerStyle, cornerStroke, cornerWrap };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
