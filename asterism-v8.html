<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Asterism V8 — Tiro Contrapposto · Wanderlust</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
<style>
  /* =====================================================================
     ASTERISM V8 — DNA PRISMATIC WANDERLUST
     Solar Triumph · Rude Bellezza · ombre teal/smeraldo (mai grigie)
     Motore fisico/matematico identico alla V7 (verbatim).
     ===================================================================== */
  :root{
    --obsidian:#06090d;
    --slate-deep:#0a1216;
    --teal-shadow:rgba(20,90,80,.35);
    --emerald:#10b981;
    --gold:#c9a227;
    --gold-bright:#fce890;
    --bronze-d:#602c08;
    --ivory:#f0efe4;
    --azure:#3fa9f5;
    --magenta:#ff3df0;
    --indigo:#5a3bff;
  }
  html,body{margin:0;background:var(--obsidian);color:#e9e4cd;font-family:'Space Grotesk',system-ui,sans-serif;min-height:100%;}
  body{
    display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 16px 60px;
    background:
      radial-gradient(1100px 700px at 50% 6%, rgba(16,185,129,.07), transparent 60%),
      radial-gradient(700px 500px at 12% 80%, rgba(63,169,245,.05), transparent 70%),
      radial-gradient(900px 550px at 88% 90%, rgba(201,162,39,.06), transparent 70%),
      var(--obsidian);
  }

  header{text-align:center;}
  header .kicker{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:#8fb5a8;margin:0 0 2px;}
  header h1{font-family:'Cinzel',serif;letter-spacing:.3em;font-weight:900;font-size:clamp(16px,2.6vw,22px);color:#f6ebc4;margin:0;text-transform:uppercase;
    text-shadow:0 0 30px rgba(252,232,144,.22), 0 0 70px rgba(16,185,129,.12);}
  header .sub{margin:4px 0 0;color:#5f8579;font-size:10px;letter-spacing:.26em;text-transform:uppercase;}

  /* ============ MEDAL STAGE ============ */
  .stage{
    position:relative;width:min(700px,94vw);aspect-ratio:1/1;flex:none;
    filter:drop-shadow(0 30px 70px rgba(3,20,18,.9)) drop-shadow(0 0 55px rgba(201,162,39,.12));
  }
  /* violent asymmetric verdict quake */
  .stage.climax{animation:quake .44s cubic-bezier(.36,.07,.19,.97) both;}
  @keyframes quake{
    0%  {transform:translate(0,0)        rotate(0)}
    5%  {transform:translate(-26px,17px) rotate(-1.4deg)}
    11% {transform:translate(21px,-15px) rotate(1.1deg)}
    18% {transform:translate(-19px,-13px)rotate(-.95deg)}
    27% {transform:translate(16px,14px)  rotate(.78deg)}
    38% {transform:translate(-12px,9px)  rotate(-.52deg)}
    51% {transform:translate(8px,-6px)   rotate(.32deg)}
    65% {transform:translate(-5px,4px)   rotate(-.17deg)}
    81% {transform:translate(3px,-2px)   rotate(.07deg)}
    100%{transform:translate(0,0)        rotate(0)}
  }

  .medal-frame{position:absolute;inset:0;z-index:6;pointer-events:none;}
  .medal-frame .sheen{transform-origin:500px 500px;animation:sheenspin 18s linear infinite;}
  @keyframes sheenspin{to{transform:rotate(360deg)}}
  /* studs ignite one by one during the overture */
  .medal-frame .stud{opacity:0;transition:opacity .5s ease, filter .5s ease;}
  .medal-frame .stud.lit{opacity:1;filter:url(#medalGlow);}

  .arena{
    position:absolute;inset:5.2%;border-radius:50%;overflow:hidden;isolation:isolate;
    background:
      radial-gradient(120% 95% at 50% 8%, #0c1a1c 0%, #071013 45%, #04080b 100%);
    box-shadow:inset 0 0 100px rgba(3,24,22,.9), inset 0 0 30px rgba(16,185,129,.07), inset 0 -40px 80px rgba(63,169,245,.04);
    transition:filter 1.4s ease;
  }
  .stage.overture .arena{filter:brightness(.35) saturate(.7);}
  .arena .grain{position:absolute;inset:-2%;z-index:1;pointer-events:none;opacity:.45;mix-blend-mode:overlay;}
  .arena canvas{position:relative;z-index:2;display:block;width:100%;height:100%;background:transparent;}
  .arena .fxcv{position:absolute;inset:0;z-index:5;width:100%;height:100%;pointer-events:none;}

  /* teal volumetric fog — two slow counter-rotating banks, screen blend */
  .arena .fog{position:absolute;inset:-12%;z-index:3;pointer-events:none;mix-blend-mode:screen;opacity:.6;}
  .arena .fog.a{background:radial-gradient(40% 30% at 22% 72%, rgba(16,120,105,.16), transparent 70%),
                          radial-gradient(34% 26% at 80% 30%, rgba(20,140,120,.10), transparent 70%);
    animation:fogdrift 26s ease-in-out infinite alternate;}
  .arena .fog.b{background:radial-gradient(36% 28% at 76% 76%, rgba(63,169,245,.08), transparent 70%),
                          radial-gradient(30% 24% at 24% 26%, rgba(16,185,129,.09), transparent 70%);
    animation:fogdrift 34s ease-in-out infinite alternate-reverse;}
  @keyframes fogdrift{
    from{transform:translate(-2.5%,-1.5%) rotate(-1.2deg) scale(1);}
    to  {transform:translate(2.5%,2%)    rotate(1.4deg)  scale(1.06);}
  }

  .arena .vignette{position:absolute;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(closest-side at 50% 50%, transparent 56%, rgba(2,14,13,.66) 100%);}
  .arena .heartbeat{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;
    background:radial-gradient(closest-side at 50% 50%, transparent 62%, rgba(255,60,90,.22) 100%);}

  .arena .breath-veil{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:rgba(2,10,10,.58);
    transition:opacity .35s ease;}
  .stage.breath .breath-veil{opacity:1;}

  /* perceived slow-motion: deep focus, edges desaturate (physics untouched) */
  .arena .slowmo-veil{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .4s ease;
    background:radial-gradient(closest-side at 50% 50%, transparent 40%, rgba(4,16,16,.5) 100%);
    backdrop-filter:saturate(.85);}
  .stage.slowmo .slowmo-veil{opacity:1;}

  .climax-veil{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;
    background:radial-gradient(closest-side at 50% 50%, rgba(255,236,170,.95), rgba(252,232,144,.4) 35%, transparent 72%);
    mix-blend-mode:screen;}
  .stage.climax .climax-veil{animation:flash 1s ease-out forwards;}
  @keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}

  /* god rays — victory only */
  .arena .rays{position:absolute;inset:-25%;z-index:4;pointer-events:none;opacity:0;mix-blend-mode:screen;
    background:conic-gradient(from 0deg at 50% 50%,
      transparent 0deg, rgba(252,232,144,.16) 7deg, transparent 16deg,
      transparent 52deg, rgba(255,255,255,.10) 60deg, transparent 70deg,
      transparent 118deg, rgba(252,232,144,.13) 126deg, transparent 136deg,
      transparent 184deg, rgba(63,169,245,.07) 191deg, transparent 200deg,
      transparent 244deg, rgba(252,232,144,.15) 252deg, transparent 262deg,
      transparent 306deg, rgba(255,255,255,.09) 314deg, transparent 324deg);
    animation:raysspin 24s linear infinite;transition:opacity 1.2s ease;}
  @keyframes raysspin{to{transform:rotate(360deg)}}
  .stage.success-tone .rays{opacity:1;}

  /* fail tone: arena cools toward the abyss (teal, mai grigio) */
  .stage.fail-tone .arena{filter:saturate(.6) brightness(.8) hue-rotate(-8deg);transition:filter 1.2s ease .3s;}

  /* ============ VERDICT SEAL CARD ============ */
  .verdict{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);
    opacity:0;pointer-events:none;text-align:center;
    padding:40px 58px 34px;border-radius:18px;
    background:
      linear-gradient(165deg, rgba(16,26,26,.94), rgba(7,14,14,.9)),
      radial-gradient(closest-side, rgba(6,12,12,.95), rgba(6,12,12,.6));
    border:1px solid rgba(201,162,39,.5);
    box-shadow:0 24px 60px rgba(2,12,11,.85), inset 0 1px 0 rgba(252,232,144,.25), 0 0 60px rgba(201,162,39,.12);}
  .verdict::before{content:'';position:absolute;inset:6px;border-radius:13px;border:1px solid rgba(201,162,39,.22);pointer-events:none;}
  .stage.climax .verdict{animation:sealdrop .9s cubic-bezier(.2,.85,.25,1.1) .1s forwards;}
  @keyframes sealdrop{
    0%{opacity:0;transform:translate(-50%,-64%) scale(1.25);filter:blur(12px);}
    55%{opacity:1;transform:translate(-50%,-49%) scale(.97);filter:blur(0);}
    75%{transform:translate(-50%,-50.6%) scale(1.02);}
    100%{opacity:1;transform:translate(-50%,-50%) scale(1);}
  }
  .verdict .wax{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:30px;
    font-family:'Cinzel',serif;font-weight:900;position:relative;}
  .verdict.success .wax{color:#3a2403;
    background:radial-gradient(circle at 36% 30%, #ffe9a8, #c9a227 55%, #8a5a18 100%);
    box-shadow:0 4px 18px rgba(201,162,39,.55), inset 0 -3px 8px rgba(96,44,8,.6), inset 0 2px 4px rgba(255,255,255,.6);}
  .verdict.fail .wax{color:#caa9c2;
    background:radial-gradient(circle at 36% 30%, #2a2238, #120d1d 55%, #060309 100%);
    box-shadow:0 4px 18px rgba(90,59,255,.3), inset 0 -3px 8px rgba(0,0,0,.8), inset 0 2px 3px rgba(150,120,200,.25);}
  .verdict.fail .wax::after{content:'';position:absolute;inset:-3px;border-radius:50%;
    border:1px solid rgba(255,61,240,.35);clip-path:polygon(0 0,100% 0,100% 38%,55% 52%,100% 66%,100% 100%,0 100%);}
  .verdict .v-main{font-family:'Cinzel',serif;font-weight:900;letter-spacing:.15em;text-transform:uppercase;
    font-size:clamp(28px,5vw,50px);line-height:1;}
  .verdict.success .v-main{color:#ffeebc;text-shadow:0 0 26px rgba(252,232,144,.7),0 0 70px rgba(201,162,39,.45);}
  .verdict.fail .v-main{color:#ffb4c8;text-shadow:0 0 26px rgba(255,70,120,.5),0 0 70px rgba(90,30,80,.5);}
  .verdict .v-sub{margin-top:10px;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;
    font-size:clamp(14px,2vw,19px);color:#d9cba0;}
  .verdict.fail .v-sub{color:#cbaac4;}
  .verdict .v-nums{margin-top:9px;font-family:'Cinzel',serif;font-weight:700;
    letter-spacing:.3em;text-transform:uppercase;font-size:10px;color:#9c8d63;}

  .caption{min-height:26px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(15px,2.2vw,19px);
    color:#c4ba93;text-align:center;opacity:.92;transition:opacity .4s ease;letter-spacing:.04em;}
  .caption.swap{opacity:0;}

  /* ============ FATE BAR — Bilancia del Fato ============ */
  .fate{width:min(580px,90vw);display:flex;flex-direction:column;gap:8px;align-items:center;}
  .fate-bar{position:relative;width:100%;height:20px;border-radius:999px;overflow:visible;
    border:1px solid rgba(201,162,39,.45);
    background:linear-gradient(180deg,#0a1316,#0e1c20);
    box-shadow:inset 0 3px 8px rgba(2,12,12,.85), 0 0 28px rgba(16,185,129,.10), 0 1px 0 rgba(252,232,144,.12);}
  .fate-bar::before{content:'★';position:absolute;left:-26px;top:50%;transform:translateY(-50%);
    color:var(--gold-bright);font-size:13px;text-shadow:0 0 10px rgba(252,232,144,.8);}
  .fate-bar::after{content:'●';position:absolute;right:-24px;top:50%;transform:translateY(-50%);
    color:#3c2a56;font-size:13px;text-shadow:0 0 8px rgba(90,59,255,.7);}
  .fate-bar .track{position:absolute;inset:2px;border-radius:999px;overflow:hidden;
    background:linear-gradient(180deg,#0d0a18 0%,#161028 100%);}
  .fate-bar .track::after{content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(252,232,144,.10) calc(10% - 1px) 10%);}
  .fate-bar .gold{position:absolute;top:0;bottom:0;left:0;width:50%;
    background:linear-gradient(180deg,#ffeebc 0%,#e3b961 40%,#8a5a18 100%);
    box-shadow:0 0 20px rgba(252,232,144,.5);transition:width .5s ease;overflow:hidden;}
  .fate-bar .gold::before{content:'';position:absolute;inset:0;
    background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%);
    transform:translateX(-100%);animation:goldshimmer 3.2s ease-in-out infinite;}
  @keyframes goldshimmer{0%,55%{transform:translateX(-100%)}85%,100%{transform:translateX(100%)}}
  .fate-bar .gold::after{content:'';position:absolute;top:0;bottom:0;right:0;width:2px;background:#fff8e0;
    box-shadow:0 0 12px #fce890;}
  .fate-bar .marker{position:absolute;top:50%;left:0;width:16px;height:16px;margin-left:-8px;z-index:2;
    transform:translateY(-50%) rotate(45deg) scale(0);
    background:linear-gradient(135deg,#ffffff,#fce890 55%,#8a5a18);
    box-shadow:0 0 16px rgba(255,240,180,.95), 0 0 34px rgba(252,232,144,.55);
    border:1px solid rgba(96,44,8,.85);
    transition:left .9s cubic-bezier(.2,.9,.25,1.15);}
  .fate-bar .marker.show{animation:markerdrop .55s cubic-bezier(.3,1.6,.4,1) forwards;}
  @keyframes markerdrop{
    0%{transform:translateY(-280%) rotate(45deg) scale(.4);opacity:0;}
    60%{opacity:1;}
    100%{transform:translateY(-50%) rotate(45deg) scale(1);opacity:1;}
  }
  .fate-legend{display:flex;gap:18px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#5f8579;
    font-family:'Cinzel',serif;}
  .fate-legend b{color:#e3b961;font-weight:700;}
  .fate-legend .roll-out{color:#9d8fe8;}

  /* ============ CONTROLS ============ */
  .controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:2px;}
  .btn{
    appearance:none;border:1px solid rgba(16,185,129,.4);background:rgba(16,185,129,.06);color:#9fd8c5;
    padding:10px 20px;border-radius:999px;font:600 10px/1 'Cinzel',serif;letter-spacing:.28em;text-transform:uppercase;
    cursor:pointer;transition:all .18s ease;
  }
  .btn:hover{background:rgba(16,185,129,.15);box-shadow:0 0 18px rgba(16,185,129,.2);}
  .btn.cta{
    position:relative;overflow:hidden;
    border:1px solid rgba(252,232,144,.7);color:#231402;font-weight:700;padding:14px 32px;font-size:11px;
    background:linear-gradient(180deg,#ffeebc 0%,#e3b961 45%,#a06a1e 100%);
    box-shadow:0 5px 20px rgba(201,162,39,.4), inset 0 1px 0 rgba(255,255,255,.75), inset 0 -2px 5px rgba(96,44,8,.45);
    text-shadow:0 1px 0 rgba(255,255,255,.4);
  }
  .btn.cta::after{content:'';position:absolute;inset:0;
    background:linear-gradient(105deg, transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%);
    transform:translateX(-120%);transition:transform .5s ease;}
  .btn.cta:hover::after{transform:translateX(120%);}
  .btn.cta:hover{filter:brightness(1.07);}
  .btn.cta.pulse{animation:ctapulse 1.6s ease-in-out infinite;}
  @keyframes ctapulse{
    0%,100%{box-shadow:0 5px 20px rgba(201,162,39,.4), inset 0 1px 0 rgba(255,255,255,.75);}
    50%{box-shadow:0 5px 34px rgba(252,232,144,.8), 0 0 46px rgba(201,162,39,.4), inset 0 1px 0 rgba(255,255,255,.75);}
  }
  .toggle{display:inline-flex;align-items:center;gap:9px;padding:9px 14px;border-radius:999px;
    border:1px solid rgba(16,185,129,.25);background:rgba(8,16,16,.7);color:#7fae9d;
    font:600 9px/1 'Cinzel',serif;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;}
  .toggle input{accent-color:var(--gold);}
</style>
</head>
<body>
  <header>
    <p class="kicker">La montagna oppone resistenza…</p>
    <h1>Tiro Contrapposto</h1>
    <p class="sub">Prova di Forza · Scalare la Vetta</p>
  </header>

  <div class="stage overture" id="stage">
    <!-- Medal frame: SlottedMedal "gold ceremonial" skin, enriched -->
    <svg class="medal-frame" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <radialGradient id="medalRim" cx="40%" cy="28%" r="78%">
          <stop offset="0%" stop-color="#ffd75e"/>
          <stop offset="38%" stop-color="#fce890"/>
          <stop offset="62%" stop-color="#c9a227"/>
          <stop offset="84%" stop-color="#8a5a18"/>
          <stop offset="100%" stop-color="#602c08"/>
        </radialGradient>
        <linearGradient id="medalShine" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
          <stop offset="50%" stop-color="rgba(255,255,255,0.08)"/>
          <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
        </linearGradient>
        <radialGradient id="studG" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#fffbe8"/>
          <stop offset="55%" stop-color="#fce890"/>
          <stop offset="100%" stop-color="#8a5a18"/>
        </radialGradient>
        <filter id="medalGlow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
          <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- outer dark bronze edge -->
      <circle cx="500" cy="500" r="494" fill="none" stroke="#3a200a" stroke-width="9"/>
      <!-- engraved tick ring (astrolabe degrees) -->
      <g id="degreeTicks" stroke="#8a5a18" opacity="0.55"></g>
      <!-- main metallic rim -->
      <circle cx="500" cy="500" r="473" fill="none" stroke="url(#medalRim)" stroke-width="34" filter="url(#medalGlow)"/>
      <!-- secondary inner ring -->
      <circle cx="500" cy="500" r="448" fill="none" stroke="#e3b961" stroke-width="3.5" opacity="0.6"/>
      <!-- inner dark seat -->
      <circle cx="500" cy="500" r="455" fill="none" stroke="rgba(18,10,2,.85)" stroke-width="4"/>
      <!-- decorative studs at the 10 star angles -->
      <g id="studs"></g>
      <!-- rotating shine sweep -->
      <g class="sheen">
        <path d="M 500 27 A 473 473 0 0 1 905 295" fill="none" stroke="url(#medalShine)" stroke-width="30" stroke-linecap="round" opacity="0.85"/>
      </g>
    </svg>

    <div class="arena">
      <svg class="grain" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 600 600">
        <defs>
          <filter id="obsidianGrain">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch"/>
            <feColorMatrix values="0 0 0 0 0.03  0 0 0 0 0.10  0 0 0 0 0.09  0 0 0 0.5 0"/>
          </filter>
          <filter id="obsidianCracks">
            <feTurbulence type="turbulence" baseFrequency="0.012 0.04" numOctaves="3" seed="3"/>
            <feColorMatrix values="0 0 0 0 0.02  0 0 0 0 0.08  0 0 0 0 0.07  0 0 0 0.3 0"/>
          </filter>
        </defs>
        <rect width="100%" height="100%" filter="url(#obsidianCracks)"/>
        <rect width="100%" height="100%" filter="url(#obsidianGrain)"/>
      </svg>
      <canvas id="cv" width="640" height="640"></canvas>
      <div class="fog a"></div>
      <div class="fog b"></div>
      <div class="vignette"></div>
      <div class="rays"></div>
      <div class="heartbeat" id="heartbeat"></div>
      <div class="slowmo-veil"></div>
      <div class="breath-veil"></div>
      <div class="climax-veil"></div>
      <canvas class="fxcv" id="fxcv" width="640" height="640"></canvas>
      <div class="verdict" id="verdict">
        <div class="wax" id="wax">★</div>
        <div class="v-main">—</div>
        <div class="v-sub">—</div>
        <div class="v-nums">—</div>
      </div>
    </div>
  </div>

  <!-- Goo edge distortion: low-frequency fractalNoise = slow, high-viscosity waves -->
  <svg id="goo-filters" style="position:absolute;width:0;height:0;overflow:hidden;" aria-hidden="true">
    <defs>
      <filter id="gooWobble" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
        <feTurbulence id="gooTurb" type="fractalNoise" baseFrequency="0.007 0.005" numOctaves="2" seed="4" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="13" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <p class="caption" id="caption">Le stelle si allineano sopra la vetta…</p>

  <div class="fate">
    <div class="fate-bar">
      <div class="track">
        <div class="gold" id="fateGold"></div>
      </div>
      <div class="marker" id="fateMarker"></div>
    </div>
    <div class="fate-legend"><span>Fortuna <b id="fateChance">—</b></span><span class="roll-out">Tiro <b id="fateRoll">—</b></span></div>
  </div>

  <div class="controls">
    <button class="btn cta" id="reroll">Lancia il Dado</button>
    <button class="btn" id="restart">Riavvia Scena</button>
    <label class="toggle"><input type="checkbox" id="perfect"/> Stella Perfetta</label>
    <label class="toggle"><input type="checkbox" id="sound" checked/> Suono</label>
  </div>

<script>
/* =========================================================================
   ASTERISM V8 — "Tiro Contrapposto · Wanderlust"
   Engine ported verbatim from AltVisualsV6Asterism.tsx (same as V7).
   Physics, timings, RNG and probability math are UNCHANGED.
   New presentation layer (reads engine state, never writes):
   overture ritual, golden comet, impact shockwaves, obelisk reflections,
   dust motes, constellations, perceived slow-mo, golden rain / goo swallow,
   verdict seal card, teal fog, astrolabe engraving.
   ========================================================================= */

const AXES = 5;
const MAX_STAT = 100;
const TICKS = 10;
const RADIUS = 220;
const MIN_BASE_VALUE = 3;
