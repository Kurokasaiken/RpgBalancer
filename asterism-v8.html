/* ---------- pure helpers (engine, unchanged) ---------- */
function randomPointOnPolygonEdges(vertices){
  if(vertices.length===0) return null;
  const edgeIndex=Math.floor(Math.random()*vertices.length);
  const start=vertices[edgeIndex];
  const end=vertices[(edgeIndex+1)%vertices.length];
  const t=Math.random();
  return { x:start.x+(end.x-start.x)*t, y:start.y+(end.y-start.y)*t };
}
function movePointTowardCenter(point,center,distance){
  const dx=point.x-center.x, dy=point.y-center.y;
  const len=Math.hypot(dx,dy)||1;
  return { x:point.x-(dx/len)*distance, y:point.y-(dy/len)*distance };
}
function isPointInPolygon(x,y,vertices){
  let inside=false;
  for(let i=0,j=vertices.length-1;i<vertices.length;j=i,i+=1){
    const xi=vertices[i].x, yi=vertices[i].y, xj=vertices[j].x, yj=vertices[j].y;
    const intersect=((yi>y)!==(yj>y)) && (x<((xj-xi)*(y-yi))/(yj-yi)+xi);
    if(intersect) inside=!inside;
  }
  return inside;
}
function generateMockStats(){
  const range=MOCK_STAT_RANGE.max-MOCK_STAT_RANGE.min;
  return Array.from({length:AXES}, ()=>Math.round(MOCK_STAT_RANGE.min+Math.random()*range));
}
function calculateSuccessChance(state){
  const playerSum=state.playerStatValues.reduce((s,v)=>s+v,0);
  const enemySum=state.enemyStatValues.reduce((s,v)=>s+v,0);
  return clamp(50+(playerSum-enemySum), SUCCESS_PROB_CLAMP.min, SUCCESS_PROB_CLAMP.max);
}
function rollForOutcome(state){
  const roll=Math.random()*100;
  state.successRoll=roll;
  return roll<=state.successChance;
}
function randomPointInsidePolygon(vertices, predicate=()=>true){
  const bounds=vertices.reduce((acc,v)=>({
    minX:Math.min(acc.minX,v.x), maxX:Math.max(acc.maxX,v.x),
    minY:Math.min(acc.minY,v.y), maxY:Math.max(acc.maxY,v.y),
  }),{minX:Infinity,maxX:-Infinity,minY:Infinity,maxY:-Infinity});
  for(let attempt=0;attempt<200;attempt+=1){
    const x=bounds.minX+Math.random()*(bounds.maxX-bounds.minX||1);
    const y=bounds.minY+Math.random()*(bounds.maxY-bounds.minY||1);
    if(isPointInPolygon(x,y,vertices) && predicate(x,y)) return {x,y};
  }
  return null;
}
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
function canvasCenter(){ return {x:320,y:320}; }
function easeInOut(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

/* =========================================================================
   AUDIO — synthesized, no assets.
   Master chain: master gain -> lowpass (slow-mo duck) -> destination.
   ========================================================================= */
const AudioFX = (() => {
  let ac=null, master=null, duckFilter=null;
  let enabled=true;
  function ensure(){
    if(!ac){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return;
      ac=new AC();
      master=ac.createGain();
      master.gain.value=0.32;
      duckFilter=ac.createBiquadFilter();
      duckFilter.type='lowpass';
      duckFilter.frequency.value=20000;
      master.connect(duckFilter);
      duckFilter.connect(ac.destination);
    }
    if(ac.state==='suspended') ac.resume();
  }
  function tone(freq,type,attack,decay,peak,when=0,detune=0){
    if(!enabled||!ac) return;
    const t=ac.currentTime+when;
    const o=ac.createOscillator();
    o.type=type; o.frequency.value=freq; o.detune.value=detune;
    const g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002),t+attack);
    g.gain.exponentialRampToValueAtTime(0.0001,t+attack+decay);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+attack+decay+0.06);
  }
  function noiseBurst(dur,peak,filterFreq,q,when=0){
    if(!enabled||!ac) return;
    const t=ac.currentTime+when;
    const len=Math.max(1,Math.floor(ac.sampleRate*dur));
    const buf=ac.createBuffer(1,len,ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i+=1) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=ac.createBufferSource(); src.buffer=buf;
    const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=filterFreq; f.Q.value=q;
    const g=ac.createGain(); g.gain.value=peak;
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t);
  }
  return {
    ensure,
    setEnabled(v){ enabled=v; },
    /* perceived slow-mo: muffle the world (audio only, physics untouched) */
    duck(on){
      if(!ac||!duckFilter) return;
      const t=ac.currentTime;
      duckFilter.frequency.cancelScheduledValues(t);
      duckFilter.frequency.setTargetAtTime(on?520:20000, t, 0.12);
    },
    gong(low=1){
      tone(98*low,'sine',0.01,2.2,0.4);
      tone(147*low,'sine',0.01,1.6,0.18,0.01);
      tone(196*low,'triangle',0.02,1.2,0.08,0.02);
      noiseBurst(0.35,0.07,400,1.5);
    },
    studTick(i){ tone(880+i*70,'triangle',0.004,0.12,0.06); noiseBurst(0.02,0.08,3200,6); },
    tick(speed){
      noiseBurst(0.03,0.18,2200+speed*60,6);
      tone(1300+Math.random()*200,'square',0.004,0.03,0.05);
    },
    thudEnemy(){ tone(62,'sine',0.008,0.3,0.55); noiseBurst(0.12,0.22,180,1.2); },
    thudPlayer(){ tone(115,'sine',0.006,0.22,0.4); noiseBurst(0.08,0.18,900,2); tone(880,'triangle',0.004,0.12,0.08); },
    gooSettle(){
      if(!ac||!enabled) return;
      const t=ac.currentTime;
      const o=ac.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(190,t);
      o.frequency.exponentialRampToValueAtTime(48,t+0.5);
      const g=ac.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.35,t+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.55);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+0.6);
    },
    starShimmer(){
      [1318,1568,2093,2637].forEach((f,i)=>tone(f,'triangle',0.01,0.5,0.07,i*0.05));
      noiseBurst(0.4,0.06,5200,3);
    },
    launch(){
      if(!ac||!enabled) return;
      const t=ac.currentTime;
      const o=ac.createOscillator(); o.type='sawtooth';
      o.frequency.setValueAtTime(160,t);
      o.frequency.exponentialRampToValueAtTime(620,t+0.35);
      const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1200;
      const g=ac.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.12,t+0.05);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.45);
      o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t+0.5);
    },
    breath(){ tone(46,'sine',0.05,0.5,0.3); },
    win(){
      [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
        tone(f,'triangle',0.01,0.55,0.22,i*0.09);
        tone(f*2,'sine',0.01,0.4,0.06,i*0.09);
      });
      noiseBurst(0.5,0.08,6500,2,0.25);
      tone(130.8,'sine',0.02,0.8,0.25,0.05);
    },
    rain(){
      for(let i=0;i<10;i+=1){
        tone(2093+Math.random()*1200,'triangle',0.01,0.25,0.03,0.15+i*0.12);
      }
    },
    lose(){
      tone(220,'sawtooth',0.02,0.55,0.16);
      tone(164.8,'sawtooth',0.02,0.8,0.16,0.22);
      tone(55,'sine',0.03,1.0,0.35,0.22);
    },
    swallow(){
      if(!ac||!enabled) return;
      const t=ac.currentTime;
      const o=ac.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(160,t);
      o.frequency.exponentialRampToValueAtTime(32,t+0.7);
      const g=ac.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.4,t+0.05);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.75);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+0.8);
      noiseBurst(0.3,0.14,240,1.4,0.05);
      noiseBurst(0.18,0.1,520,2,0.3);
    },
  };
})();

/* =========================================================================
   ENGINE (verbatim) + presentation layer
   ========================================================================= */
function init(canvas, checkbox, onOutcome, onStop, present){
  const ctx=canvas.getContext('2d',{alpha:true});
  const state={
    usePerfectStar:false,
    tarPuddle:{active:false,radius:0,maxRadius:30,growing:true,morphing:false,morphProgress:0},
    goldStar:{active:false,radius:0,maxRadius:30,growing:true,morphing:false,morphProgress:0},
    ball:{
      active:false,x:320,y:320,vx:0,vy:0,radius:8,speed:12,
      startTime:0,duration:5000,stopped:false,success:null,
      targetX:320,targetY:320,targetAssigned:false,
      guidanceDelay:0,targetArrivalTime:0,forcedOutcome:null,
      guidanceActive:false,guidanceDuration:0,guidanceStartX:320,guidanceStartY:320,hasSettled:false,
    },
    axisMeta:FALLBACK_AXIS_META,
    baseEnemyValues:[65,58,60,55,62],
    basePlayerValues:[60,54,58,50,59],
    enemyStatValues:[],playerStatValues:[],
    enemyPillars:[],playerPillars:[],tentacles:[],particleBursts:[],
    currentEnemyPillarIndex:0,currentPlayerPillarIndex:0,
    enemyPillarAnimationDelay:0,playerPillarAnimationDelay:0,
    playerAnimationStarted:false,
    screenShake:{active:false,trauma:0,offsetX:0,offsetY:0},
    flashOpacity:0,animationFrameId:null,lastTimestamp:performance.now(),
    successChance:50, successRoll:null,
  };

  /* presentation-only state (never read by the engine) */
  const fx={
    cam:{scale:1,x:320,y:320},
    trail:[],
    sparks:[],            // comet embers
    shocks:[],            // impact shockwave rings
    tickDist:0,
    seenLanded:new Set(), // pillars that already fired their impact FX
    prevEnemyLanded:0, prevPlayerLanded:0,
    prevBallActive:false, prevTarMorphDone:false, prevStarMorphDone:false,
    bgStars:Array.from({length:54},()=>({
      x:Math.random()*640, y:Math.random()*640,
      r:Math.random()*1.3+0.4, ph:Math.random()*Math.PI*2, sp:0.4+Math.random()*1.2,
    })),
    motes:Array.from({length:26},()=>({
      x:Math.random()*640, y:Math.random()*640,
      r:Math.random()*1.6+0.5, sp:2.5+Math.random()*7,
      sway:Math.random()*Math.PI*2, ph:Math.random()*Math.PI*2,
    })),
    constellations:null,
  };
  /* pick a few star pairs once for faint constellation lines */
  fx.constellations=(()=>{
    const pairs=[];
    for(let i=0;i<9;i+=1){
      const a=fx.bgStars[Math.floor(Math.random()*fx.bgStars.length)];
      let best=null,bd=1e9;
      fx.bgStars.forEach(s=>{
        if(s===a) return;
        const d=Math.hypot(s.x-a.x,s.y-a.y);
        if(d>30 && d<120 && d<bd){bd=d;best=s;}
      });
      if(best) pairs.push([a,best]);
    }
    return pairs;
  })();

  function resetAnimation(){
    if(state.usePerfectStar){
      const p=70;
      state.enemyStatValues=Array.from({length:AXES},()=>p);
      state.playerStatValues=Array.from({length:AXES},()=>p);
    } else {
      state.enemyStatValues=generateMockStats();
      state.playerStatValues=generateMockStats();
    }
    state.baseEnemyValues=[...state.enemyStatValues];
    state.basePlayerValues=[...state.playerStatValues];
    state.tarPuddle={active:false,radius:0,maxRadius:30,growing:true,morphing:false,morphProgress:0};
    state.goldStar={active:false,radius:0,maxRadius:30,growing:true,morphing:false,morphProgress:0};
    state.enemyPillars=[]; state.playerPillars=[]; state.tentacles=[]; state.particleBursts=[];
    state.currentEnemyPillarIndex=0; state.currentPlayerPillarIndex=0;
    state.enemyPillarAnimationDelay=0; state.playerPillarAnimationDelay=0;
    state.playerAnimationStarted=false;
    state.screenShake={active:false,trauma:0,offsetX:0,offsetY:0};
    state.flashOpacity=0;
    state.ball={
      active:false,x:320,y:320,vx:0,vy:0,radius:8,speed:16,
      startTime:0,duration:BALL_TOTAL_DURATION_MS,stopped:false,success:null,
      targetX:320,targetY:320,targetAssigned:false,
      guidanceDelay:0,targetArrivalTime:0,forcedOutcome:null,
      guidanceActive:false,guidanceDuration:0,guidanceStartX:320,guidanceStartY:320,hasSettled:false,
    };
    state.successChance=calculateSuccessChance(state);
    state.successRoll=null;
    outcomeFired=false; stopFired=false;
    fx.trail.length=0; fx.sparks.length=0; fx.shocks.length=0; fx.tickDist=0;
    fx.seenLanded.clear();
    fx.prevEnemyLanded=0; fx.prevPlayerLanded=0;
    fx.prevBallActive=false; fx.prevTarMorphDone=false; fx.prevStarMorphDone=false;
    fx.cam={scale:1,x:320,y:320};
  }

  function triggerShake(intensity){ state.screenShake.trauma=Math.min(1,state.screenShake.trauma+intensity); }
  function updateScreenShake(){
    if(state.screenShake.trauma>0){
      state.screenShake.trauma-=0.05;
      if(state.screenShake.trauma<0) state.screenShake.trauma=0;
      const m=state.screenShake.trauma*state.screenShake.trauma;
      const maxOffset=VISUAL_CONFIG.screenShakeIntensity*m*10;
      state.screenShake.offsetX=(Math.random()*2-1)*maxOffset;
      state.screenShake.offsetY=(Math.random()*2-1)*maxOffset;
    } else { state.screenShake.offsetX=0; state.screenShake.offsetY=0; }
  }

  function updatePillars(){
    state.enemyPillarAnimationDelay+=1;
    const PILLAR_START_HEIGHT=400;
    if(state.enemyPillarAnimationDelay%PILLAR_DELAY===0 && state.currentEnemyPillarIndex<AXES){
      const sv=state.enemyStatValues[state.currentEnemyPillarIndex];
      const angle=-Math.PI/2 + state.currentEnemyPillarIndex*((2*Math.PI)/AXES);
      const progress=(MIN_BASE_VALUE+sv)/(MAX_STAT+MIN_BASE_VALUE);
      const finalRadius=RADIUS*progress;
      state.enemyPillars.push({angle,finalRadius,currentHeight:PILLAR_START_HEIGHT,velocity:0,landed:false});
      state.tentacles.push({angle,length:0,targetLength:finalRadius,growing:false});
      state.currentEnemyPillarIndex+=1;
    }
    state.enemyPillars.forEach((pillar,i)=>{
      if(!pillar.landed){
        pillar.velocity+=2;
        pillar.currentHeight-=pillar.velocity;
        if(pillar.currentHeight<=0){
          pillar.currentHeight=0; pillar.landed=true; pillar.velocity=0;
          if(state.tentacles[i]) state.tentacles[i].growing=true;
          triggerShake(0.4);
          spawnParticleBurst(pillar.angle,pillar.finalRadius,'#ff3df0','#7b5cff',12);
        }
      }
    });
    state.tentacles.forEach(t=>{
      if(t.growing && t.length<t.targetLength){
        t.length+=15;
        if(t.length>=t.targetLength) t.length=t.targetLength;
      }
    });
    if(!state.playerAnimationStarted && state.tarPuddle.morphing && state.tarPuddle.morphProgress>=1){
      state.playerAnimationStarted=true;
    }
    if(state.playerAnimationStarted){
      state.playerPillarAnimationDelay+=1;
      if(state.playerPillarAnimationDelay%PILLAR_DELAY===0 && state.currentPlayerPillarIndex<AXES){
        const sv=state.playerStatValues[state.currentPlayerPillarIndex];
        const angle=-Math.PI/2 + state.currentPlayerPillarIndex*((2*Math.PI)/AXES);
        const progress=(MIN_BASE_VALUE+sv)/(MAX_STAT+MIN_BASE_VALUE);
        const finalRadius=RADIUS*progress;
        state.playerPillars.push({angle,finalRadius,currentHeight:PILLAR_START_HEIGHT,velocity:0,landed:false});
        state.currentPlayerPillarIndex+=1;
      }
      state.playerPillars.forEach(p=>{
        if(!p.landed){
          p.velocity+=2.5;
          p.currentHeight-=p.velocity;
          if(p.currentHeight<=0){
            p.currentHeight=0; p.landed=true; p.velocity=0;
            triggerShake(0.5);
            spawnParticleBurst(p.angle,p.finalRadius,VISUAL_CONFIG.colors.playerPillarStroke,'#ffffff',16);
          }
        }
      });
    }
  }

  function updateTarAnimation(){
    if(!state.tarPuddle.active && state.enemyPillarAnimationDelay>30) state.tarPuddle.active=true;
    if(state.tarPuddle.active && state.tarPuddle.growing && state.tarPuddle.radius<state.tarPuddle.maxRadius){
      state.tarPuddle.radius+=2;
      if(state.tarPuddle.radius>=state.tarPuddle.maxRadius) state.tarPuddle.growing=false;
    }
    if(!state.tarPuddle.growing && state.tentacles.length===AXES && state.enemyPillars.every(p=>p.landed) && state.tentacles.every(t=>t.length>=t.targetLength)){
      state.tarPuddle.morphing=true;
    }
    if(state.tarPuddle.morphing && state.tarPuddle.morphProgress<1){
      state.tarPuddle.morphProgress+=VISUAL_CONFIG.morphSpeed;
      if(state.tarPuddle.morphProgress>1){ state.tarPuddle.morphProgress=1; triggerShake(0.3); }
    }
    if(state.playerAnimationStarted && !state.goldStar.active) state.goldStar.active=true;
    if(state.goldStar.active && state.goldStar.growing && state.goldStar.radius<state.goldStar.maxRadius){
      state.goldStar.radius+=2;
      if(state.goldStar.radius>=state.goldStar.maxRadius) state.goldStar.growing=false;
    }
    if(state.goldStar.active && !state.goldStar.growing && state.playerPillars.length===AXES && state.playerPillars.every(p=>p.landed)){
      state.goldStar.morphing=true;
    }
    if(state.goldStar.morphing && state.goldStar.morphProgress<1){
      state.goldStar.morphProgress+=VISUAL_CONFIG.morphSpeed;
      if(state.goldStar.morphProgress>1){
        state.goldStar.morphProgress=1;
        state.flashOpacity=1;
        triggerShake(0.8);
      }
    }
    if(!state.ball.active && !state.ball.stopped) startBallLaunch();
  }

  function getStarVertices(){
    const v=[];
    for(let i=0;i<AXES*2;i+=1){
      const angle=-Math.PI/2 + i*(Math.PI/AXES);
      let r;
      if(i%2===0){
        r=state.playerPillars[Math.floor(i/2)]?.finalRadius ?? state.goldStar.radius;
      } else {
        const pi=Math.floor(i/2), ni=(pi+1)%AXES;
        const avg=((state.playerPillars[pi]?.finalRadius ?? state.goldStar.radius)+(state.playerPillars[ni]?.finalRadius ?? state.goldStar.radius))/2;
        r=avg*0.4;
      }
      v.push({x:canvasCenter().x+Math.cos(angle)*r,y:canvasCenter().y+Math.sin(angle)*r});
    }
    return v;
  }
  function getPentagonVertices(){
    const v=[];
    for(let i=0;i<AXES;i+=1){
      const angle=-Math.PI/2 + i*((2*Math.PI)/AXES);
      const dist=state.tentacles[i]?.length ?? 0;
      v.push({x:canvasCenter().x+Math.cos(angle)*dist,y:canvasCenter().y+Math.sin(angle)*dist});
    }
    return v;
  }

  function assignBallTarget(){
    const sv=getStarVertices(), pv=getPentagonVertices(), c=canvasCenter();
    if(state.ball.forcedOutcome===null){ state.ball.targetAssigned=false; return; }
    if(state.ball.forcedOutcome){
      const ep=randomPointOnPolygonEdges(sv) ?? c;
      const tp=movePointTowardCenter(ep,c,VISUAL_CONFIG.ballTargetOffsets.successInset);
      state.ball.targetX=tp.x; state.ball.targetY=tp.y;
    } else {
      const ep=randomPointOnPolygonEdges(sv) ?? randomPointOnPolygonEdges(pv) ?? c;
      let tp=movePointTowardCenter(ep,c,-VISUAL_CONFIG.ballTargetOffsets.failureOutset);
      if(!isPointInPolygon(tp.x,tp.y,pv) || isPointInPolygon(tp.x,tp.y,sv)){
        tp=randomPointInsidePolygon(pv,(x,y)=>!isPointInPolygon(x,y,sv)) ?? movePointTowardCenter(ep,c,0);
      }
      state.ball.targetX=tp.x; state.ball.targetY=tp.y;
    }
    state.ball.targetAssigned=true;
  }

  function startBallLaunch(opts={}){
    if(!opts.skipReadinessCheck){
      const goldReady=state.goldStar.active && state.goldStar.morphProgress>=1;
      const playerReady=state.playerPillars.length===AXES && state.playerPillars.every(p=>p.landed);
      if(!goldReady || !playerReady) return;
    }
    state.ball.active=true; state.ball.stopped=false; state.ball.success=null; state.ball.targetAssigned=false;
    state.ball.startTime=Date.now(); state.ball.duration=BALL_TOTAL_DURATION_MS;
    state.ball.guidanceDelay=CHAOS_PHASE_DURATION_MS;
    state.ball.targetArrivalTime=state.ball.startTime+BALL_TOTAL_DURATION_MS;
    state.ball.x=canvasCenter().x; state.ball.y=canvasCenter().y;
    state.ball.guidanceActive=false; state.ball.guidanceDuration=GUIDANCE_PHASE_DURATION_MS;
    state.ball.guidanceStartX=state.ball.x; state.ball.guidanceStartY=state.ball.y;
    state.ball.hasSettled=false;
    state.successChance=calculateSuccessChance(state);
    const forcedSuccess=rollForOutcome(state);
    state.ball.forcedOutcome=forcedSuccess;
    assignBallTarget();
    const launchAngle=Math.random()*Math.PI*2;
    const launchSpeed=state.ball.speed*1.4;
    state.ball.vx=Math.cos(launchAngle)*launchSpeed;
    state.ball.vy=Math.sin(launchAngle)*launchSpeed;
  }

  function updateBall(){
    if(!state.ball.active || state.ball.stopped) return;
    const now=Date.now();
    const elapsed=now-state.ball.startTime;
    const timeRemaining=state.ball.duration-elapsed;
    if(timeRemaining<=0){
      state.ball.stopped=true; state.ball.vx=0; state.ball.vy=0;
      const sv=getStarVertices();
      state.ball.success=isPointInPolygon(state.ball.x,state.ball.y,sv);
      if(state.ball.forcedOutcome!==null) state.ball.success=state.ball.forcedOutcome;
      triggerShake(0.6);
      return;
    }
    if(elapsed<state.ball.guidanceDelay){
      state.ball.vx=(state.ball.vx+(Math.random()-0.5)*VISUAL_CONFIG.ballPath.chaosImpulse)*VISUAL_CONFIG.ballPath.chaosDamping;
      state.ball.vy=(state.ball.vy+(Math.random()-0.5)*VISUAL_CONFIG.ballPath.chaosImpulse)*VISUAL_CONFIG.ballPath.chaosDamping;
    } else {
      state.ball.vx*=VISUAL_CONFIG.ballPath.globalDrag;
      state.ball.vy*=VISUAL_CONFIG.ballPath.globalDrag;
    }
    if(state.ball.targetAssigned && elapsed>=state.ball.guidanceDelay){
      if(!state.ball.guidanceActive){
        state.ball.guidanceActive=true;
        state.ball.guidanceStartX=state.ball.x;
        state.ball.guidanceStartY=state.ball.y;
        state.ball.guidanceDuration=state.ball.targetArrivalTime-(state.ball.startTime+state.ball.guidanceDelay);
        spawnParticleBurst(Math.random()*Math.PI*2,40,VISUAL_CONFIG.colors.playerPillarStroke,VISUAL_CONFIG.colors.particleSecondary,8,state.ball.x,state.ball.y);
        triggerShake(0.25);
      }
      const sv=getStarVertices();
      const insideStar=isPointInPolygon(state.ball.x,state.ball.y,sv);
      const shouldBeInsideStar=state.ball.forcedOutcome===true;
      const currentSpeed=Math.hypot(state.ball.vx,state.ball.vy);
      if(insideStar!==shouldBeInsideStar){
        if(currentSpeed<10){ state.ball.vx*=1.02; state.ball.vy*=1.02; }
        if(currentSpeed>12){ state.ball.vx*=VISUAL_CONFIG.ballPath.pinballFriction; state.ball.vy*=VISUAL_CONFIG.ballPath.pinballFriction; }
      } else {
        const brake=0.92;
        state.ball.vx*=brake; state.ball.vy*=brake;
        if(Math.hypot(state.ball.vx,state.ball.vy)<0.2){ state.ball.vx=0; state.ball.vy=0; }
      }
      if(state.ball.vx===0 && state.ball.vy===0 && !state.ball.hasSettled){
        state.ball.hasSettled=true; state.ball.stopped=true;
        state.ball.success=shouldBeInsideStar;
        triggerShake(0.4);
        return;
      }
    }
    const nextX=state.ball.x+state.ball.vx;
    const nextY=state.ball.y+state.ball.vy;
    const pv=getPentagonVertices();
    if(!isPointInPolygon(nextX,nextY,pv)){
      let minDist=Infinity, bestNormal={x:0,y:0};
      pv.forEach((vertex,index)=>{
        const nv=pv[(index+1)%pv.length];
        const dx=nv.x-vertex.x, dy=nv.y-vertex.y;
        const len=Math.hypot(dx,dy)||1;
        const nx=-dy/len, ny=dx/len;
        const d=Math.abs((state.ball.x-vertex.x)*nx + (state.ball.y-vertex.y)*ny);
        if(d<minDist){ minDist=d; bestNormal={x:nx,y:ny}; }
      });
      const dot=state.ball.vx*bestNormal.x + state.ball.vy*bestNormal.y;
      state.ball.vx-=2*dot*bestNormal.x;
      state.ball.vy-=2*dot*bestNormal.y;
      state.ball.vx*=0.98; state.ball.vy*=0.98;
      triggerShake(0.2);
      spawnParticleBurst(0,0,'#ff3df0','#fff',5,state.ball.x,state.ball.y);
    } else {
      state.ball.x=nextX; state.ball.y=nextY;
    }
  }

  function spawnParticleBurst(angle,targetRadius,primary,secondary,count=18,overrideX,overrideY){
    const particles=[];
    const c=canvasCenter();
    const ox = overrideX ?? (c.x+Math.cos(angle)*targetRadius);
    const oy = overrideY ?? (c.y+Math.sin(angle)*targetRadius);
    for(let i=0;i<count;i+=1){
      const theta=Math.random()*Math.PI*2;
      const speed=Math.random()*4+1;
      particles.push({
        x:ox,y:oy,
        vx:Math.cos(theta)*speed, vy:Math.sin(theta)*speed,
        radius:Math.random()*(VISUAL_CONFIG.particleSize/2)+2,
        life:VISUAL_CONFIG.particleLifetime,
        color: Math.random()>0.5 ? primary : secondary,
      });
    }
    state.particleBursts.push(particles);
  }
  function updateParticles(delta){
    for(let i=state.particleBursts.length-1;i>=0;i-=1){
      const burst=state.particleBursts[i];
      for(let j=burst.length-1;j>=0;j-=1){
        const p=burst[j];
        p.life-=delta;
        if(p.life<=0){ burst.splice(j,1); continue; }
        p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.radius*=0.95;
      }
      if(burst.length===0) state.particleBursts.splice(i,1);
    }
  }

  /* ====================== DRAWING (presentation) ====================== */

  function drawBackgroundStars(now){
    const t=now/1000;
    /* faint constellation lines first */
    ctx.strokeStyle='rgba(140,210,195,0.07)';
    ctx.lineWidth=0.6;
    fx.constellations.forEach(([a,b])=>{
      ctx.beginPath();
      ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
      ctx.stroke();
    });
    fx.bgStars.forEach(s=>{
      const a=0.12+0.24*(0.5+0.5*Math.sin(t*s.sp+s.ph));
      ctx.globalAlpha=a;
      ctx.fillStyle='#cfeede';
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fill();
      /* 4-point twinkle on the brightest */
      if(s.r>1.4 && a>0.3){
        ctx.globalAlpha=a*0.5;
        ctx.strokeStyle='#e8fff5';
        ctx.lineWidth=0.5;
        ctx.beginPath();
        ctx.moveTo(s.x-s.r*3,s.y); ctx.lineTo(s.x+s.r*3,s.y);
        ctx.moveTo(s.x,s.y-s.r*3); ctx.lineTo(s.x,s.y+s.r*3);
        ctx.stroke();
      }
    });
    ctx.globalAlpha=1;
  }

  /* golden dust motes — Solar Triumph air */
  function drawMotes(now,delta){
    const t=now/1000;
    fx.motes.forEach(m=>{
      m.y-=m.sp*(delta/1000);
      m.x+=Math.sin(t*0.7+m.sway)*0.12;
      if(m.y<-4){ m.y=644; m.x=Math.random()*640; }
      const a=0.10+0.20*(0.5+0.5*Math.sin(t*1.3+m.ph));
      ctx.globalAlpha=a;
      ctx.fillStyle='#fce890';
      ctx.beginPath();
      ctx.arc(m.x,m.y,m.r,0,Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha=1;
  }

  /* astrolabe engraving: rings, rays teal→gold, tick marks */
  function drawGrid(){
    const c=canvasCenter();
    /* engraved concentric rings */
    for(let ri=1;ri<=3;ri+=1){
      const r=RADIUS*(ri/3);
      ctx.strokeStyle=ri===3?'rgba(201,162,39,0.12)':'rgba(16,185,129,0.07)';
      ctx.lineWidth=ri===3?1.2:0.8;
      ctx.beginPath();
      ctx.arc(c.x,c.y,r,0,Math.PI*2);
      ctx.stroke();
    }
    for(let i=0;i<AXES;i+=1){
      const angle=-Math.PI/2 + i*((2*Math.PI)/AXES);
      const dx=Math.cos(angle), dy=Math.sin(angle);
      const grad=ctx.createLinearGradient(c.x,c.y,c.x+dx*RADIUS,c.y+dy*RADIUS);
      grad.addColorStop(0,'rgba(16,185,129,0.05)');
      grad.addColorStop(0.7,'rgba(16,185,129,0.18)');
      grad.addColorStop(1,'rgba(252,232,144,0.26)');
      ctx.strokeStyle=grad;
      ctx.lineWidth=1.4;
      ctx.beginPath();
      ctx.moveTo(c.x,c.y);
      ctx.lineTo(c.x+dx*RADIUS,c.y+dy*RADIUS);
      ctx.stroke();
      for(let t=1;t<=TICKS;t+=1){
        const r=(RADIUS/TICKS)*t;
        const tx=c.x+dx*r, ty=c.y+dy*r;
        ctx.strokeStyle=t===TICKS?'rgba(252,232,144,0.25)':'rgba(120,220,200,0.13)';
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(tx+dy*5,ty-dx*5);
        ctx.lineTo(tx-dy*5,ty+dx*5);
        ctx.stroke();
      }
      /* tiny gold rosette at each axis end */
      const ex=c.x+dx*RADIUS, ey=c.y+dy*RADIUS;
      ctx.fillStyle='rgba(252,232,144,0.4)';
      ctx.beginPath();
      ctx.arc(ex,ey,2,0,Math.PI*2);
      ctx.fill();
    }
    ctx.strokeStyle='rgba(16,185,129,0.10)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.arc(c.x,c.y,RADIUS,0,Math.PI*2);
    ctx.stroke();
  }

  function drawStatOverlay(){
    const c=canvasCenter();
    for(let i=0;i<AXES;i+=1){
      const angle=-Math.PI/2 + i*((2*Math.PI)/AXES);
      const lr=RADIUS+38;
      const ix=c.x+Math.cos(angle)*lr;
      const iy=c.y+Math.sin(angle)*lr;
      const meta=state.axisMeta[i] ?? FALLBACK_AXIS_META[i%FALLBACK_AXIS_META.length];
      ctx.font="600 21px 'Space Grotesk',system-ui";
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='#e9e4cd';
      ctx.fillText(meta.icon ?? '◆', ix, iy);
      const pv=Math.round(state.playerStatValues[i] ?? 0);
      const ev=Math.round(state.enemyStatValues[i] ?? 0);
      ctx.font="600 14px 'Cormorant Garamond',serif";
      ctx.fillStyle='#f6e8ae';
      ctx.shadowColor='rgba(252,232,144,0.35)'; ctx.shadowBlur=4;
      ctx.fillText(`${pv}`, ix-12, iy+20);
      ctx.shadowBlur=0;
      ctx.fillStyle='rgba(160,200,190,.4)';
      ctx.fillText('·', ix, iy+20);
      ctx.fillStyle='#b9aef5';
      ctx.fillText(`${ev}`, ix+12, iy+20);
    }
  }

  /* comet ribbon: tapered, gold→amber, plus dying embers */
  function drawBallTrail(){
    const n=fx.trail.length;
    if(n>1){
      for(let i=1;i<n;i+=1){
        const t0=fx.trail[i-1], t1=fx.trail[i];
        const a=t1.life/460;
        if(a<=0) continue;
        ctx.globalAlpha=a*0.6;
        ctx.strokeStyle=`rgba(255,${200+Math.floor(40*a)},${110+Math.floor(80*a)},1)`;
        ctx.lineWidth=state.ball.radius*1.5*a;
        ctx.lineCap='round';
        ctx.beginPath();
        ctx.moveTo(t0.x,t0.y);
        ctx.lineTo(t1.x,t1.y);
        ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
    /* embers */
    fx.sparks.forEach(s=>{
      const a=s.life/s.max;
      if(a<=0) return;
      ctx.globalAlpha=a;
      ctx.fillStyle=s.c;
      ctx.shadowColor=s.c;
      ctx.shadowBlur=6;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r*a,0,Math.PI*2);
      ctx.fill();
      ctx.shadowBlur=0;
    });
    ctx.globalAlpha=1;
  }

  /* the golden comet */
  function drawBall(now){
    if(!state.ball.active && !state.ball.stopped) return;
    const b=state.ball;
    ctx.save();
    const sp=Math.hypot(b.vx,b.vy);
    const pulse=b.stopped ? 1+0.08*Math.sin(now/120) : 1;
    const r=b.radius*pulse;
    /* outer halo */
    const halo=ctx.createRadialGradient(b.x,b.y,r*0.5,b.x,b.y,r*4);
    halo.addColorStop(0,'rgba(255,236,170,0.5)');
    halo.addColorStop(0.5,'rgba(252,232,144,0.12)');
    halo.addColorStop(1,'rgba(252,232,144,0)');
    ctx.fillStyle=halo;
    ctx.beginPath();
    ctx.arc(b.x,b.y,r*4,0,Math.PI*2);
    ctx.fill();
    /* core */
    const g=ctx.createRadialGradient(b.x-3,b.y-3,1,b.x,b.y,r+2);
    g.addColorStop(0,'#ffffff');
    g.addColorStop(0.4,'#ffeebc');
    g.addColorStop(1,'#a06a1e');
    ctx.shadowColor='rgba(252,232,144,0.95)';
    ctx.shadowBlur=28;
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(b.x,b.y,r,0,Math.PI*2);
    ctx.fill();
    ctx.lineWidth=1.5;
    ctx.strokeStyle='rgba(255,244,200,0.95)';
    ctx.stroke();
    ctx.shadowBlur=0;
    /* lens-flare cross when slow (anticipation focus) */
    const slowK=clamp(1-sp/6,0,1);
    if(slowK>0.15 && !b.stopped){
      ctx.globalAlpha=slowK*0.85;
      ctx.strokeStyle='rgba(255,248,220,0.9)';
      ctx.lineWidth=1;
      const L=r*(3+5*slowK);
      ctx.beginPath();
      ctx.moveTo(b.x-L,b.y); ctx.lineTo(b.x+L,b.y);
      ctx.moveTo(b.x,b.y-L); ctx.lineTo(b.x,b.y+L);
      ctx.stroke();
      ctx.globalAlpha=slowK*0.4;
      ctx.beginPath();
      ctx.moveTo(b.x-L*0.55,b.y-L*0.55); ctx.lineTo(b.x+L*0.55,b.y+L*0.55);
      ctx.moveTo(b.x-L*0.55,b.y+L*0.55); ctx.lineTo(b.x+L*0.55,b.y-L*0.55);
      ctx.stroke();
      ctx.globalAlpha=1;
    }
    ctx.restore();
  }

  /* impact shockwave rings + ground dust */
  function drawShocks(delta){
    for(let i=fx.shocks.length-1;i>=0;i-=1){
      const s=fx.shocks[i];
      s.t+=delta;
      const p=s.t/s.dur;
      if(p>=1){ fx.shocks.splice(i,1); continue; }
      const r=s.r0+(s.r1-s.r0)*easeInOut(p);
      const a=(1-p);
      ctx.save();
      ctx.globalAlpha=a*0.8;
      ctx.strokeStyle=s.c;
      ctx.lineWidth=2.4*(1-p)+0.4;
      ctx.shadowColor=s.c;
      ctx.shadowBlur=12;
      ctx.beginPath();
      ctx.ellipse(s.x,s.y,r,r*0.42,0,0,Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawPillars(){
    const c=canvasCenter();
    const drawObelisk=(pillar,palette,glow)=>{
      const isPlayer=(glow===VISUAL_CONFIG.colors.obeliskEdgeGlow);
      const dx=Math.cos(pillar.angle), dy=Math.sin(pillar.angle);
      const px=c.x+dx*pillar.finalRadius;
      const py=c.y+dy*pillar.finalRadius;
      const vy=py-pillar.currentHeight;
      const falling=pillar.currentHeight>0;
      const w=26+pillar.finalRadius*0.022;
      const h=66+pillar.finalRadius*0.045;

      ctx.save();

      /* ── reflection smear on the dark floor (teal-tinted, mai grigia) ── */
      if(!falling){
        const refl=ctx.createLinearGradient(px,py+2,px,py+h*0.55);
        if(isPlayer){
          refl.addColorStop(0,'rgba(255,242,210,0.16)');
          refl.addColorStop(0.5,'rgba(220,200,150,0.05)');
          refl.addColorStop(1,'rgba(20,90,80,0)');
        } else {
          refl.addColorStop(0,'rgba(120,80,200,0.10)');
          refl.addColorStop(0.5,'rgba(60,40,120,0.04)');
          refl.addColorStop(1,'rgba(20,90,80,0)');
        }
        ctx.fillStyle=refl;
        ctx.beginPath();
        ctx.moveTo(px-w*0.42,py+1);
        ctx.lineTo(px+w*0.42,py+1);
        ctx.lineTo(px+w*0.2,py+h*0.55);
        ctx.lineTo(px-w*0.2,py+h*0.55);
        ctx.closePath();
        ctx.fill();
      }

      /* ── ground shadow (teal-cooled) ── */
      ctx.fillStyle='rgba(3,22,20,0.6)';
      ctx.beginPath();
      ctx.ellipse(px,py,w*0.62,w*0.26,0,0,Math.PI*2);
      ctx.fill();

      /* ── falling light trail ── */
      if(falling){
        const tg=ctx.createLinearGradient(px,vy-h-60,px,vy);
        tg.addColorStop(0,glow+'00');
        tg.addColorStop(0.6,glow+'44');
        tg.addColorStop(1,'transparent');
        ctx.fillStyle=tg;
        ctx.beginPath();
        ctx.moveTo(px-w*0.28,vy-h*0.3);
        ctx.lineTo(px,vy-h-65);
        ctx.lineTo(px+w*0.28,vy-h*0.3);
        ctx.closePath();
        ctx.globalAlpha=0.6; ctx.fill(); ctx.globalAlpha=1;
      }

      /* ── SIDE face (shadow/left) ── */
      const sidePath=new Path2D();
      sidePath.moveTo(px,vy+14); sidePath.lineTo(px-w*0.5,vy+2);
      sidePath.lineTo(px-w*0.5,vy-h); sidePath.lineTo(px,vy-h+14);
      sidePath.closePath();
      {
        const sg=ctx.createLinearGradient(px-w*0.5,vy-h,px,vy);
        if(isPlayer){
          sg.addColorStop(0,'#a89268'); sg.addColorStop(1,'#c4a97a');
        } else {
          sg.addColorStop(0,'#050208'); sg.addColorStop(1,'#0b0812');
        }
        ctx.fillStyle=sg; ctx.fill(sidePath);
      }

      /* ── FRONT face ── */
      const frontPath=new Path2D();
      frontPath.moveTo(px,vy+14); frontPath.lineTo(px+w*0.5,vy+2);
      frontPath.lineTo(px+w*0.5,vy-h); frontPath.lineTo(px,vy-h+14);
      frontPath.closePath();
      if(isPlayer){
        /* Alabaster: cool highlight → warm ivory → golden shadow */
        const fg=ctx.createLinearGradient(px-w*0.3,vy-h,px+w*0.5,vy);
        fg.addColorStop(0,'#ffffff');
        fg.addColorStop(0.25,'#fef7e8');
        fg.addColorStop(0.65,'#ede0be');
        fg.addColorStop(1,'#c4a97a');
        ctx.fillStyle=fg; ctx.fill(frontPath);
        /* Subsurface warm glow (translucent alabaster) */
        ctx.save(); ctx.clip(frontPath);
        const ssg=ctx.createRadialGradient(px+w*0.05,vy-h*0.42,0,px+w*0.05,vy-h*0.42,w*1.3);
        ssg.addColorStop(0,'rgba(255,210,130,0.22)');
        ssg.addColorStop(0.6,'rgba(255,200,100,0.07)');
        ssg.addColorStop(1,'rgba(255,200,100,0)');
        ctx.fillStyle=ssg; ctx.fillRect(px-w,vy-h-20,w*3,h+40);
        /* Marble veining */
        const sv=((pillar.angle*9.1+3.3)%1+1)%1;
        ctx.lineWidth=0.55;
        const veins=[[0.22,0.92,0.10,0.78],[0.38,0.68,0.18,0.52],[0.55,0.48,0.26,0.32]];
        veins.forEach(([ax,ay,bx,by],vi)=>{
          ctx.strokeStyle=`rgba(175,148,95,${0.16+vi*0.05})`;
          const y0=vy-h*(ay-sv*0.08), y1=vy-h*(by+sv*0.06);
          ctx.beginPath();
          ctx.moveTo(px-w*(0.32-sv*0.12),y0);
          ctx.bezierCurveTo(px+w*(ax-0.12),y0+(y1-y0)*0.32,
                            px-w*(bx-0.28)+sv*w*0.1,y0+(y1-y0)*0.68,
                            px+w*0.38,y1);
          ctx.stroke();
        });
        ctx.restore();
      } else {
        /* Basalto nero venato: polished near-black, blue-violet iridescence */
        const fg=ctx.createLinearGradient(px-w*0.4,vy-h,px+w*0.5,vy);
        fg.addColorStop(0,'#1a1128'); fg.addColorStop(0.35,'#0e0b17');
        fg.addColorStop(0.7,'#060309'); fg.addColorStop(1,'#020104');
        ctx.fillStyle=fg; ctx.fill(frontPath);
        ctx.save(); ctx.clip(frontPath);
        /* Iridescent obsidian sheen (faint violet-blue caustic) */
        const ish=ctx.createRadialGradient(px-w*0.1,vy-h*0.6,0,px-w*0.1,vy-h*0.6,w*0.9);
        ish.addColorStop(0,'rgba(100,70,220,0.14)');
        ish.addColorStop(0.5,'rgba(60,30,140,0.06)');
        ish.addColorStop(1,'rgba(60,30,140,0)');
        ctx.fillStyle=ish; ctx.fillRect(px-w,vy-h-20,w*3,h+40);
        /* basalt veins: thin sun-bronze filaments */
        const sv=((pillar.angle*6.7+1.7)%1+1)%1;
        ctx.lineWidth=0.5;
        for(let vi=0;vi<2;vi++){
          ctx.strokeStyle=`rgba(200,134,46,${0.14+vi*0.06})`;
          const y0=vy-h*(0.8-vi*0.3-sv*0.1), y1=vy-h*(0.2+sv*0.08);
          ctx.beginPath();
          ctx.moveTo(px-w*0.28+sv*w*0.2,y0);
          ctx.bezierCurveTo(px+w*0.1,y0+(y1-y0)*0.4, px-w*0.05,y0+(y1-y0)*0.7, px+w*0.36,y1);
          ctx.stroke();
        }
        ctx.restore();
      }

      /* ── TOP diamond facet ── */
      const topPath=new Path2D();
      topPath.moveTo(px,vy-h+14); topPath.lineTo(px-w*0.5,vy-h+2);
      topPath.lineTo(px,vy-h-14); topPath.lineTo(px+w*0.5,vy-h+2);
      topPath.closePath();
      {
        const tg2=ctx.createRadialGradient(px,vy-h-4,0,px,vy-h-4,w);
        if(isPlayer){
          tg2.addColorStop(0,'#ffffff'); tg2.addColorStop(0.4,'#fef5e2');
          tg2.addColorStop(1,'#ddc98e');
        } else {
          tg2.addColorStop(0,'#221630'); tg2.addColorStop(0.5,'#100b1a');
          tg2.addColorStop(1,'#060309');
        }
        ctx.fillStyle=tg2; ctx.fill(topPath);
      }

      /* ── ambient edge glow ── */
      ctx.shadowColor=glow; ctx.shadowBlur=falling?22:11;
      ctx.strokeStyle=glow; ctx.lineWidth=falling?1.6:0.9;
      ctx.stroke(frontPath);
      ctx.shadowBlur=0;

      /* ── specular catchlight lines ── */
      ctx.save();
      const specC=isPlayer?'rgba(255,253,240,0.95)':'rgba(195,128,38,0.82)';
      ctx.strokeStyle=specC; ctx.shadowColor=specC;
      ctx.shadowBlur=isPlayer?9:5;
      ctx.lineWidth=isPlayer?1.6:1.1;
      ctx.beginPath();
      ctx.moveTo(px,vy-h-14); ctx.lineTo(px-w*0.5,vy-h+2);
      ctx.stroke();
      ctx.lineWidth=isPlayer?1.2:0.9;
      const evg=ctx.createLinearGradient(px+w*0.5,vy-h,px+w*0.5,vy);
      evg.addColorStop(0,specC); evg.addColorStop(0.6,specC.replace(/[\d.]+\)$/,'0.3)'));
      evg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.strokeStyle=evg;
      ctx.beginPath();
      ctx.moveTo(px+w*0.5,vy-h+2); ctx.lineTo(px+w*0.5,vy+2);
      ctx.stroke();
      ctx.restore();

      ctx.restore();
    };
    const all=[
      ...state.enemyPillars.map(p=>({pillar:p,palette:VISUAL_CONFIG.colors.obeliskEnemy,glow:VISUAL_CONFIG.colors.obeliskEnemyGlow})),
      ...state.playerPillars.map(p=>({pillar:p,palette:VISUAL_CONFIG.colors.obeliskPlayer,glow:VISUAL_CONFIG.colors.obeliskEdgeGlow})),
    ];
    all.sort((a,b)=>{
      const ya=c.y+Math.sin(a.pillar.angle)*a.pillar.finalRadius - a.pillar.currentHeight;
      const yb=c.y+Math.sin(b.pillar.angle)*b.pillar.finalRadius - b.pillar.currentHeight;
      return ya-yb;
    }).forEach(({pillar,palette,glow})=>drawObelisk(pillar,palette,glow));
  }

  function drawParticles(){
    state.particleBursts.forEach(burst=>{
      burst.forEach(p=>{
        ctx.save();
        ctx.globalAlpha=Math.max(0,p.life/VISUAL_CONFIG.particleLifetime);
        ctx.fillStyle=p.color;
        ctx.shadowColor=p.color;
        ctx.shadowBlur=10;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
        ctx.fill();
        ctx.restore();
      });
    });
  }

  function buildPuddlePath2D(){
    const c=canvasCenter();
    const path=new Path2D();
    if(!state.tarPuddle.morphing || state.tarPuddle.morphProgress===0){
      path.arc(c.x,c.y,state.tarPuddle.radius,0,Math.PI*2);
      return path;
    }
    const segments=60;
    for(let i=0;i<=segments;i+=1){
      const angle=(i/segments)*Math.PI*2 - Math.PI/2;
      const cr=state.tarPuddle.radius;
      let pr=state.tarPuddle.radius;
      for(let j=0;j<AXES;j+=1){
        const va=-Math.PI/2 + j*((2*Math.PI)/AXES);
        const nva=-Math.PI/2 + ((j+1)%AXES)*((2*Math.PI)/AXES);
        let na=angle, nnv=nva;
        if(j===AXES-1){
          nnv=nva+Math.PI*2;
          if(angle<0) na=angle+Math.PI*2;
        }
        if((j<AXES-1 && angle>=va && angle<=nva) || (j===AXES-1 && na>=va && na<=nnv)){
          const v1=state.tentacles[j]?.length ?? cr;
          const v2=state.tentacles[(j+1)%AXES]?.length ?? cr;
          const t=(na-va)/(nnv-va||1);
          pr=v1+(v2-v1)*t;
          break;
        }
      }
      const r=cr+(pr-cr)*state.tarPuddle.morphProgress;
      const x=c.x+Math.cos(angle)*r;
      const y=c.y+Math.sin(angle)*r;
      if(i===0) path.moveTo(x,y); else path.lineTo(x,y);
    }
    path.closePath();
    return path;
  }

  /* GOO — viscous black tar, magenta+indigo veins, slow rising bubbles */
  const gooBubbles=Array.from({length:5},(_,i)=>({
    ph:i*1.7, sp:0.14+i*0.04, rad:2.5+i*1.2, ox:(i-2)*14,
  }));
  function drawTarAnimation(now){
    if(!state.tarPuddle.active || state.tarPuddle.radius<=0) return;
    const c=canvasCenter();
    const path=buildPuddlePath2D();
    ctx.save();
    ctx.filter='url(#gooWobble)';
    ctx.shadowColor='rgba(90,59,255,0.45)';
    ctx.shadowBlur=VISUAL_CONFIG.glowStrengthPentagon;
    const base=ctx.createRadialGradient(c.x-12,c.y-14,2,c.x,c.y,Math.max(state.tarPuddle.radius,40));
    base.addColorStop(0,'#1a1226');
    base.addColorStop(0.35,'#070310');
    base.addColorStop(1,'#000000');
    ctx.fillStyle=base;
    ctx.fill(path);
    ctx.filter='none';
    ctx.shadowBlur=0;
    ctx.clip(path);
    const t=now/1000;
    const m1x=c.x+18+Math.sin(t*0.6)*8, m1y=c.y+22+Math.cos(t*0.5)*6;
    const vein1=ctx.createRadialGradient(m1x,m1y,2,m1x,m1y,90);
    vein1.addColorStop(0,'rgba(255,61,240,0.5)');
    vein1.addColorStop(0.4,'rgba(255,61,240,0.12)');
    vein1.addColorStop(1,'rgba(255,61,240,0)');
    ctx.fillStyle=vein1;
    ctx.fillRect(c.x-260,c.y-260,520,520);
    const m2x=c.x-22+Math.cos(t*0.45)*9, m2y=c.y-10+Math.sin(t*0.7)*7;
    const vein2=ctx.createRadialGradient(m2x,m2y,2,m2x,m2y,110);
    vein2.addColorStop(0,'rgba(90,59,255,0.5)');
    vein2.addColorStop(0.5,'rgba(90,59,255,0.15)');
    vein2.addColorStop(1,'rgba(90,59,255,0)');
    ctx.fillStyle=vein2;
    ctx.fillRect(c.x-260,c.y-260,520,520);
    /* slow viscous bubbles: swell then pop with a tiny ring */
    gooBubbles.forEach(bub=>{
      const cyc=((t*bub.sp+bub.ph)%1+1)%1;
      const bx=c.x+bub.ox+Math.sin(bub.ph*3.1)*22;
      const by=c.y+10-cyc*16;
      if(cyc<0.82){
        const br=bub.rad*(0.3+cyc);
        const bg=ctx.createRadialGradient(bx-br*0.3,by-br*0.3,0.4,bx,by,br);
        bg.addColorStop(0,'rgba(150,120,200,0.35)');
        bg.addColorStop(0.7,'rgba(40,25,70,0.25)');
        bg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=bg;
        ctx.beginPath();
        ctx.arc(bx,by,br,0,Math.PI*2);
        ctx.fill();
      } else {
        const pop=(cyc-0.82)/0.18;
        ctx.globalAlpha=(1-pop)*0.4;
        ctx.strokeStyle='rgba(170,140,220,0.8)';
        ctx.lineWidth=0.8;
        ctx.beginPath();
        ctx.arc(bx,by,bub.rad*(1+pop*1.6),0,Math.PI*2);
        ctx.stroke();
        ctx.globalAlpha=1;
      }
    });
    /* wet specular */
    const wx=c.x-10+Math.sin(t*0.8)*4, wy=c.y-18;
    const wet=ctx.createRadialGradient(wx,wy,1,wx,wy,28);
    wet.addColorStop(0,'rgba(255,255,255,0.5)');
    wet.addColorStop(0.4,'rgba(255,255,255,0.08)');
    wet.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=wet;
    ctx.fillRect(c.x-260,c.y-260,520,520);
    ctx.restore();
    /* teal rim light along the goo edge (Wanderlust shadow rule) */
    ctx.save();
    ctx.strokeStyle='rgba(16,150,130,0.20)';
    ctx.lineWidth=1.6;
    ctx.shadowColor='rgba(16,185,129,0.35)';
    ctx.shadowBlur=8;
    ctx.stroke(path);
    ctx.restore();
  }

  function buildStarPath2D(){
    const c=canvasCenter();
    const path=new Path2D();
    if(!state.goldStar.morphing || state.goldStar.morphProgress===0){
      for(let i=0;i<AXES*2;i+=1){
        const angle=-Math.PI/2 + i*(Math.PI/AXES);
        const r=(i%2===0)?state.goldStar.radius:state.goldStar.radius*0.4;
        const x=c.x+Math.cos(angle)*r;
        const y=c.y+Math.sin(angle)*r;
        if(i===0) path.moveTo(x,y); else path.lineTo(x,y);
      }
    } else {
      for(let i=0;i<AXES*2;i+=1){
        const angle=-Math.PI/2 + i*(Math.PI/AXES);
        let r;
        if(i%2===0){
          r=state.playerPillars[Math.floor(i/2)]?.finalRadius ?? state.goldStar.radius;
        } else {
          const pi=Math.floor(i/2), ni=(pi+1)%AXES;
          const avg=((state.playerPillars[pi]?.finalRadius ?? state.goldStar.radius)+(state.playerPillars[ni]?.finalRadius ?? state.goldStar.radius))/2;
          r=avg*0.4;
        }
        const fr=state.goldStar.radius + (r-state.goldStar.radius)*state.goldStar.morphProgress;
        const x=c.x+Math.cos(angle)*fr;
        const y=c.y+Math.sin(angle)*fr;
        if(i===0) path.moveTo(x,y); else path.lineTo(x,y);
      }
    }
    path.closePath();
    return path;
  }

  /* STAR — satin ivory face, rotating sheen, bronze triple rim,
     prismatic glints breathing at the tips (Solar Triumph) */
  function drawGoldStar(now){
    if(!state.goldStar.active || state.goldStar.radius<=0) return;
    const c=canvasCenter();
    const path=buildStarPath2D();
    ctx.save();
    const breathe=1+0.06*Math.sin(now/900);
    const face=ctx.createRadialGradient(c.x-20,c.y-30,4,c.x,c.y,Math.max(state.goldStar.radius,40));
    face.addColorStop(0,'#ffffff');
    face.addColorStop(0.45,'#fbf6e4');
    face.addColorStop(1,'#e0c98a');
    ctx.fillStyle=face;
    ctx.shadowColor=`rgba(244,201,118,${0.45*breathe})`;
    ctx.shadowBlur=VISUAL_CONFIG.glowStrengthStar*breathe;
    ctx.fill(path);
    ctx.shadowBlur=0;
    /* rotating sheen clipped inside the star face */
    ctx.save();
    ctx.clip(path);
    const ang=now/2600;
    const sx=c.x+Math.cos(ang)*200, sy=c.y+Math.sin(ang)*200;
    const sheen=ctx.createLinearGradient(c.x-(sx-c.x),c.y-(sy-c.y),sx,sy);
    sheen.addColorStop(0.42,'rgba(255,255,255,0)');
    sheen.addColorStop(0.5,'rgba(255,255,255,0.35)');
    sheen.addColorStop(0.58,'rgba(255,255,255,0)');
    ctx.fillStyle=sheen;
    ctx.fillRect(c.x-260,c.y-260,520,520);
    ctx.restore();
    /* bronze rim, three passes */
    ctx.lineJoin='round';
    ctx.lineWidth=4.5;
    ctx.strokeStyle='#602c08';
    ctx.stroke(path);
    ctx.lineWidth=2.6;
    const rim=ctx.createLinearGradient(c.x-100,c.y-100,c.x+100,c.y+100);
    rim.addColorStop(0,'#fce890');
    rim.addColorStop(0.5,'#a06a1e');
    rim.addColorStop(1,'#fce890');
    ctx.strokeStyle=rim;
    ctx.stroke(path);
    ctx.lineWidth=0.8;
    ctx.strokeStyle='rgba(255,248,215,0.85)';
    ctx.stroke(path);
    /* prismatic glints at the star tips (only when fully formed) */
    if(state.goldStar.morphProgress>=1){
      const t=now/1000;
      for(let i=0;i<AXES;i+=1){
        const angle=-Math.PI/2 + i*((2*Math.PI)/AXES);
        const r=state.playerPillars[i]?.finalRadius ?? state.goldStar.radius;
        const gx=c.x+Math.cos(angle)*r, gy=c.y+Math.sin(angle)*r;
        const tw=0.5+0.5*Math.sin(t*2.2+i*2.4);
        if(tw<0.45) continue;
        const L=4+7*tw;
        ctx.globalAlpha=tw*0.9;
        ctx.strokeStyle=i%2===0?'rgba(255,252,235,0.95)':'rgba(180,240,255,0.8)';
        ctx.lineWidth=0.9;
        ctx.beginPath();
        ctx.moveTo(gx-L,gy); ctx.lineTo(gx+L,gy);
        ctx.moveTo(gx,gy-L); ctx.lineTo(gx,gy+L);
        ctx.stroke();
        ctx.globalAlpha=1;
      }
    }
    ctx.restore();
  }

  /* spotlight dims everything but the ball during the roll */
  function drawSpotlight(){
    const b=state.ball;
    if(!b.active || b.stopped) return;
    const elapsed=Date.now()-b.startTime;
    const p=clamp(elapsed/b.duration,0,1);
    const dim=p<0.3 ? 0 : Math.min(0.55,(p-0.3)/0.7*0.62);
    if(dim<=0.01) return;
    const g=ctx.createRadialGradient(b.x,b.y,30,b.x,b.y,210);
    g.addColorStop(0,'rgba(2,8,8,0)');
    g.addColorStop(1,`rgba(2,8,8,${dim})`);
    ctx.fillStyle=g;
    ctx.fillRect(-160,-160,960,960);
  }

  /* ====================== LOOP ====================== */
  let outcomeFired=false;
  let stopFired=false;

  function loop(){
    const now=performance.now();
    const delta=now-state.lastTimestamp;
    state.lastTimestamp=now;

    /* engine updates (unchanged) */
    updateScreenShake();
    updatePillars();
    updateTarAnimation();
    updateBall();
    updateParticles(delta);
    if(state.flashOpacity>0){
      state.flashOpacity-=0.05;
      if(state.flashOpacity<0) state.flashOpacity=0;
    }

    /* ---- presentation: observe state transitions ---- */
    const enemyLanded=state.enemyPillars.filter(p=>p.landed).length;
    if(enemyLanded>fx.prevEnemyLanded) AudioFX.thudEnemy();
    fx.prevEnemyLanded=enemyLanded;
    const playerLanded=state.playerPillars.filter(p=>p.landed).length;
    if(playerLanded>fx.prevPlayerLanded) AudioFX.thudPlayer();
    fx.prevPlayerLanded=playerLanded;
    /* impact shockwaves: detect newly landed pillars (read-only Set) */
    const c0=canvasCenter();
    [...state.enemyPillars.map(p=>({p,c:'rgba(200,134,46,0.9)'})),
     ...state.playerPillars.map(p=>({p,c:'rgba(255,242,200,0.95)'}))].forEach(({p,c})=>{
      if(p.landed && !fx.seenLanded.has(p)){
        fx.seenLanded.add(p);
        fx.shocks.push({
          x:c0.x+Math.cos(p.angle)*p.finalRadius,
          y:c0.y+Math.sin(p.angle)*p.finalRadius,
          r0:6, r1:46, t:0, dur:620, c,
        });
      }
    });
    const tarDone=state.tarPuddle.morphProgress>=1;
    if(tarDone && !fx.prevTarMorphDone) AudioFX.gooSettle();
    fx.prevTarMorphDone=tarDone;
    const starDone=state.goldStar.morphProgress>=1;
    if(starDone && !fx.prevStarMorphDone) AudioFX.starShimmer();
    fx.prevStarMorphDone=starDone;
    if(state.ball.active && !fx.prevBallActive) AudioFX.launch();
    fx.prevBallActive=state.ball.active && !state.ball.stopped;

    /* comet trail + embers + roulette ticks */
    if(state.ball.active && !state.ball.stopped){
      fx.trail.push({x:state.ball.x,y:state.ball.y,life:460});
      const sp=Math.hypot(state.ball.vx,state.ball.vy);
      if(sp>1.2 && Math.random()<0.5){
        fx.sparks.push({
          x:state.ball.x+(Math.random()-0.5)*6,
          y:state.ball.y+(Math.random()-0.5)*6,
          vx:-state.ball.vx*0.12+(Math.random()-0.5)*0.8,
          vy:-state.ball.vy*0.12+(Math.random()-0.5)*0.8-0.3,
          r:1.2+Math.random()*1.6,
          life:300+Math.random()*260, max:560,
          c:Math.random()>0.3?'#fce890':'#ffb46a',
        });
      }
      fx.tickDist+=sp;
      if(fx.tickDist>30){ fx.tickDist=0; if(sp>0.5) AudioFX.tick(sp); }
    }
    for(let i=fx.trail.length-1;i>=0;i-=1){
      fx.trail[i].life-=delta;
      if(fx.trail[i].life<=0) fx.trail.splice(i,1);
    }
    if(fx.trail.length>80) fx.trail.splice(0,fx.trail.length-80);
    for(let i=fx.sparks.length-1;i>=0;i-=1){
      const s=fx.sparks[i];
      s.life-=delta;
      if(s.life<=0){ fx.sparks.splice(i,1); continue; }
      s.x+=s.vx; s.y+=s.vy; s.vy+=0.015;
    }

    /* animate goo turbulence: very slow oscillation (high viscosity) */
    {
      const gt=document.getElementById('gooTurb');
      if(gt){
        const bf1=(0.007+0.002*Math.sin(now/6200)).toFixed(5);
        const bf2=(0.005+0.0015*Math.cos(now/8800)).toFixed(5);
        gt.setAttribute('baseFrequency',bf1+' '+bf2);
      }
    }

    /* camera: push-in as the ball decelerates; deeper in slow-mo window */
    let tScale=1, tX=320, tY=320;
    const b=state.ball;
    if(b.active && !b.stopped){
      const p=clamp((Date.now()-b.startTime)/b.duration,0,1);
      if(p>0.5){
        const z=easeInOut((p-0.5)/0.5);
        tScale=1+0.38*z;
        tX=320+(b.x-320)*0.55*z;
        tY=320+(b.y-320)*0.55*z;
      }
      if(p>0.85){
        const k=(p-0.85)/0.15;
        tScale+=0.22*k;             /* extra slow-mo zoom */
        tX=320+(b.x-320)*(0.55+0.18*k);
        tY=320+(b.y-320)*(0.55+0.18*k);
      }
    } else if(b.stopped && stage.classList.contains('breath')){
      tScale=1.62; tX=320+(b.x-320)*0.64; tY=320+(b.y-320)*0.64;
    }
    fx.cam.scale+=(tScale-fx.cam.scale)*0.06;
    fx.cam.x+=(tX-fx.cam.x)*0.06;
    fx.cam.y+=(tY-fx.cam.y)*0.06;

    /* ---- draw ---- */
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawBackgroundStars(now);
    drawMotes(now,delta);

    ctx.translate(canvas.width/2 + state.screenShake.offsetX, canvas.height/2 + state.screenShake.offsetY);
    ctx.scale(fx.cam.scale,fx.cam.scale);
    ctx.translate(-fx.cam.x,-fx.cam.y);

    drawGrid();
    drawTarAnimation(now);
    drawGoldStar(now);
    drawShocks(delta);
    drawPillars();
    drawSpotlight();
    drawBallTrail();
    drawBall(now);
    drawParticles();

    if(onOutcome && state.ball.stopped && state.ball.success!==null && !outcomeFired){
      outcomeFired=true;
      onOutcome({success:state.ball.success, roll:state.successRoll ?? 0});
    }
    if(onStop && state.ball.stopped && state.ball.success!==null && !stopFired){
      stopFired=true;
      onStop({success:state.ball.success, roll:state.successRoll ?? 0, chance:state.successChance});
    }

    ctx.setTransform(1,0,0,1,0,0);
    drawStatOverlay();
    if(state.flashOpacity>0){
      ctx.fillStyle=`rgba(255,236,170,${state.flashOpacity})`;
      ctx.fillRect(0,0,canvas.width,canvas.height);
    }

    if(present) present(state, now);
    state.animationFrameId=requestAnimationFrame(loop);
  }

  if(checkbox){
    checkbox.checked=false;
    checkbox.addEventListener('change',e=>{
      state.usePerfectStar=e.target.checked;
      resetAnimation();
    });
  }
  resetAnimation();
  loop();

  return {
    reroll(){
      outcomeFired=false; stopFired=false;
      if(!state.goldStar.active || state.goldStar.morphProgress<1) return;
      state.ball.active=false; state.ball.stopped=false; state.ball.success=null; state.ball.targetAssigned=false;
      startBallLaunch({skipReadinessCheck:true});
    },
    restart(){ resetAnimation(); },
    cleanup(){ if(state.animationFrameId!==null) cancelAnimationFrame(state.animationFrameId); },
    /* read-only view info for overlay FX (world → screen mapping) */
    peek(){
      return {
        x:state.ball.x, y:state.ball.y,
        cam:{scale:fx.cam.scale, x:fx.cam.x, y:fx.cam.y},
      };
    },
  };
}

/* =========================================================================
   PAGE WIRING — overture, captions, fate bar, climax, overlay FX
   ========================================================================= */
const stage=document.getElementById('stage');
const verdict=document.getElementById('verdict');
const waxEl=document.getElementById('wax');
const heartbeat=document.getElementById('heartbeat');
const captionEl=document.getElementById('caption');
const fateGold=document.getElementById('fateGold');
const fateMarker=document.getElementById('fateMarker');
const fateChance=document.getElementById('fateChance');
const fateRoll=document.getElementById('fateRoll');
const rerollBtn=document.getElementById('reroll');

/* medal studs at the 10 star angles + engraved degree ticks */
const studEls=[];
(function buildFrame(){
  const g=document.getElementById('studs');
  for(let i=0;i<10;i+=1){
    const a=-Math.PI/2 + i*(Math.PI/5);
    const x=500+Math.cos(a)*473, y=500+Math.sin(a)*473;
    const big=i%2===0;
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',x); c.setAttribute('cy',y);
    c.setAttribute('r',big?13:8);
    c.setAttribute('fill','url(#studG)');
    c.setAttribute('stroke','#602c08');
    c.setAttribute('stroke-width','2');
    c.setAttribute('class','stud');
    g.appendChild(c);
    studEls.push(c);
  }
  const ticks=document.getElementById('degreeTicks');
  for(let i=0;i<72;i+=1){
    const a=i*(Math.PI/36);
    const r1=489, r2=i%6===0?481:485;
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',500+Math.cos(a)*r1); l.setAttribute('y1',500+Math.sin(a)*r1);
    l.setAttribute('x2',500+Math.cos(a)*r2); l.setAttribute('y2',500+Math.sin(a)*r2);
    l.setAttribute('stroke-width',i%6===0?'2':'1');
    ticks.appendChild(l);
  }
})();

let currentCaption='';
function setCaption(text){
  if(text===currentCaption) return;
  currentCaption=text;
  captionEl.classList.add('swap');
  setTimeout(()=>{ captionEl.textContent=text; captionEl.classList.remove('swap'); },220);
}

/* flavor variants — a different line each run keeps the ritual alive */
let runCount=0;
const FLAVOR={
  enemy:['L’Avversità scaglia i suoi obelischi d’onice','Il basalto nero della montagna si erge contro di te','Ombre di pietra rispondono alla sfida'],
  goo:['L’ombra reclama il suo dominio','Il catrame primordiale si distende, paziente','L’abisso apre la sua bocca nera'],
  player:['Le tue virtù innalzano colonne d’alabastro','La tua forza scolpisce il marmo della speranza','Colonne di luce rispondono al tuo nome'],
  star:['La stella del destino prende forma','L’oro del trionfo si fonde al centro del campo','La stella si accende: il campo è tracciato'],
  roll:['Il Fato decide…','La cometa cerca la sua casa…','Trattieni il respiro: il dado è vivo…'],
  win:['La vetta si inchina al tuo passo.','Il sole bacia chi osa.','L’oro riconosce il tuo coraggio.'],
  lose:['La montagna respinge i mortali.','L’abisso inghiotte la tua cometa.','Oggi la pietra è più forte della carne.'],
};
const pick=(arr)=>arr[runCount%arr.length];

let climaxTimers=[];
function clearClimax(){
  climaxTimers.forEach(clearTimeout); climaxTimers=[];
  stage.classList.remove('climax','breath','fail-tone','success-tone','slowmo');
  verdict.classList.remove('success','fail');
  fateMarker.classList.remove('show');
  fateMarker.style.left='0%';
  fateRoll.textContent='—';
  rerollBtn.classList.remove('pulse');
  heartbeat.style.opacity='0';
  AudioFX.duck(false);
  overlayFX.clear();
}

/* ============ OVERLAY FX CANVAS — golden rain / goo swallow ============ */
const overlayFX=(()=>{
  const cv=document.getElementById('fxcv');
  const octx=cv.getContext('2d');
  let drops=[];      // golden rain
  let swallow=null;  // goo devour
  let raf=null, last=0;
  function ensureLoop(){
    if(raf===null){ last=performance.now(); raf=requestAnimationFrame(step); }
  }
  function step(now){
    const dt=Math.min(50,now-last); last=now;
    octx.clearRect(0,0,640,640);
    let alive=false;
    /* rain */
    for(let i=drops.length-1;i>=0;i-=1){
      const d=drops[i];
      d.y+=d.vy*dt/16; d.x+=d.vx*dt/16; d.life-=dt;
      if(d.life<=0 || d.y>660){ drops.splice(i,1); continue; }
      alive=true;
      const a=Math.min(1,d.life/400);
      octx.globalAlpha=a;
      if(d.streak){
        octx.strokeStyle=d.c;
        octx.lineWidth=d.r*0.7;
        octx.lineCap='round';
        octx.beginPath();
        octx.moveTo(d.x,d.y);
        octx.lineTo(d.x-d.vx*2.2,d.y-d.vy*2.2);
        octx.stroke();
      } else {
        octx.fillStyle=d.c;
        octx.shadowColor=d.c; octx.shadowBlur=6;
        octx.beginPath();
        octx.arc(d.x,d.y,d.r,0,Math.PI*2);
        octx.fill();
        octx.shadowBlur=0;
      }
    }
    /* swallow */
    if(swallow){
      swallow.t+=dt;
      const p=swallow.t/swallow.dur;
      if(p>=1){ swallow=null; }
      else{
        alive=true;
        const r=8+90*easeOutCubic(p);
        /* black wave ring */
        octx.globalAlpha=(1-p)*0.9;
        const wg=octx.createRadialGradient(swallow.x,swallow.y,r*0.4,swallow.x,swallow.y,r);
        wg.addColorStop(0,'rgba(2,0,6,0.95)');
        wg.addColorStop(0.75,'rgba(8,3,16,0.7)');
        wg.addColorStop(1,'rgba(8,3,16,0)');
        octx.fillStyle=wg;
        octx.beginPath();
        octx.arc(swallow.x,swallow.y,r,0,Math.PI*2);
        octx.fill();
        /* magenta vein flash */
        octx.globalAlpha=(1-p)*0.55;
        octx.strokeStyle='rgba(255,61,240,0.8)';
        octx.lineWidth=1.4;
        for(let k=0;k<5;k+=1){
          const a0=swallow.seed+k*(Math.PI*2/5);
          octx.beginPath();
          octx.moveTo(swallow.x+Math.cos(a0)*r*0.3,swallow.y+Math.sin(a0)*r*0.3);
          octx.quadraticCurveTo(
            swallow.x+Math.cos(a0+0.4)*r*0.7,swallow.y+Math.sin(a0+0.4)*r*0.7,
            swallow.x+Math.cos(a0+0.15)*r,swallow.y+Math.sin(a0+0.15)*r);
          octx.stroke();
        }
        /* black droplets */
        swallow.blobs.forEach(bl=>{
          const bp=Math.min(1,swallow.t/bl.dur);
          const bx=swallow.x+bl.vx*bp*46;
          const by=swallow.y+bl.vy*bp*46+22*bp*bp;
          octx.globalAlpha=(1-bp)*0.9;
          octx.fillStyle='#05030c';
          octx.beginPath();
          octx.arc(bx,by,bl.r*(1-bp*0.5),0,Math.PI*2);
          octx.fill();
        });
      }
    }
    octx.globalAlpha=1;
    if(alive){ raf=requestAnimationFrame(step); }
    else { raf=null; octx.clearRect(0,0,640,640); }
  }
  function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
  return {
    goldenRain(){
      for(let i=0;i<120;i+=1){
        const streak=Math.random()<0.4;
        drops.push({
          x:Math.random()*640, y:-20-Math.random()*240,
          vx:(Math.random()-0.5)*0.8, vy:4.5+Math.random()*5,
          r:streak?2.4+Math.random()*1.6:1+Math.random()*2.2,
          life:1400+Math.random()*900,
          c:Math.random()>0.25?'#fce890':'#ffffff',
          streak,
        });
      }
      ensureLoop();
    },
    gooSwallow(x,y){
      swallow={x,y,t:0,dur:950,seed:Math.random()*Math.PI*2,
        blobs:Array.from({length:7},()=>({
          vx:(Math.random()-0.5)*2, vy:-0.4-Math.random()*1.2,
          r:2+Math.random()*3.4, dur:700+Math.random()*250,
        }))};
      ensureLoop();
    },
    clear(){ drops=[]; swallow=null; },
  };
})();

/* climax: held breath -> quake + flash + verdict seal + spoils */
function onStopSeq(result){
  runCount+=1;
  AudioFX.duck(false);
  stage.classList.remove('slowmo');
  AudioFX.breath();
  stage.classList.add('breath');
  climaxTimers.push(setTimeout(()=>{
    stage.classList.remove('breath');
    const main=verdict.querySelector('.v-main');
    const sub=verdict.querySelector('.v-sub');
    const nums=verdict.querySelector('.v-nums');
    if(result.success){
      verdict.classList.remove('fail'); verdict.classList.add('success');
      waxEl.textContent='★';
      main.textContent='Vittoria';
      sub.textContent=pick(FLAVOR.win);
      stage.classList.add('success-tone');
      AudioFX.win();
      AudioFX.rain();
      overlayFX.goldenRain();
    } else {
      verdict.classList.remove('success'); verdict.classList.add('fail');
      waxEl.textContent='✕';
      main.textContent='Sconfitta';
      sub.textContent=pick(FLAVOR.lose);
      stage.classList.add('fail-tone');
      AudioFX.lose();
      AudioFX.swallow();
      /* the goo devours the comet at its resting place */
      if(controller){
        const v=controller.peek();
        const sx=320+(v.x-v.cam.x)*v.cam.scale;
        const sy=320+(v.y-v.cam.y)*v.cam.scale;
        overlayFX.gooSwallow(sx,sy);
      }
    }
    nums.textContent=`Tiro ${result.roll.toFixed(1)} · Fortuna ${result.chance.toFixed(0)}%`;
    void stage.offsetWidth;
    stage.classList.add('climax');
    fateMarker.style.left=`${result.roll}%`;
    fateMarker.classList.add('show');
    fateRoll.textContent=result.roll.toFixed(1);
    rerollBtn.classList.add('pulse');
  },560));
}

/* per-frame presentation hook (read-only) */
function present(state, now){
  const b=state.ball;
  if(b.stopped){
    setCaption('');
  } else if(b.active){
    setCaption(pick(FLAVOR.roll));
  } else if(state.goldStar.morphing && state.goldStar.morphProgress<1){
    setCaption(pick(FLAVOR.star));
  } else if(state.playerAnimationStarted){
    setCaption(pick(FLAVOR.player));
  } else if(state.tarPuddle.morphing){
    setCaption(pick(FLAVOR.goo));
  } else if(state.enemyPillars.length>0){
    setCaption(pick(FLAVOR.enemy));
  } else {
    setCaption('Il campo si prepara…');
  }

  /* fate bar */
  fateGold.style.width=`${state.successChance}%`;
  fateChance.textContent=`${state.successChance.toFixed(0)}%`;

  /* heartbeat + perceived slow-mo in the last stretch */
  if(b.active && !b.stopped){
    const p=Math.min(1,(Date.now()-b.startTime)/b.duration);
    if(p>0.45){
      const k=(p-0.45)/0.55;
      const freq=1.4+5.2*k;
      const beat=Math.max(0,Math.sin(now/1000*freq*Math.PI*2));
      heartbeat.style.opacity=(0.25*k + 0.5*k*beat*beat).toFixed(3);
    } else {
      heartbeat.style.opacity='0';
    }
    /* slow-mo veil + audio duck — perception only, physics untouched */
    if(p>0.85 && !stage.classList.contains('slowmo')){
      stage.classList.add('slowmo');
      AudioFX.duck(true);
    }
  } else if(!b.stopped){
    heartbeat.style.opacity='0';
  }
}

/* ============ OVERTURE — il rituale ha inizio ============ */
const canvas=document.getElementById('cv');
const perfect=document.getElementById('perfect');
let controller=null;

(function overture(){
  setCaption('Le stelle si allineano sopra la vetta…');
  /* studs ignite one by one around the medal */
  studEls.forEach((el,i)=>{
    setTimeout(()=>{ el.classList.add('lit'); AudioFX.studTick(i); }, 350+i*140);
  });
  setTimeout(()=>{ AudioFX.gong(1); },300);
  setTimeout(()=>{
    stage.classList.remove('overture');
    AudioFX.gong(1.5);
    controller=init(canvas, perfect, null, onStopSeq, present);
  }, 2200);
})();

rerollBtn.addEventListener('click',()=>{
  AudioFX.ensure(); clearClimax();
  if(controller) controller.reroll();
});
document.getElementById('restart').addEventListener('click',()=>{
  AudioFX.ensure(); clearClimax();
  if(controller) controller.restart();
});
perfect.addEventListener('change',()=>{ clearClimax(); });
document.getElementById('sound').addEventListener('change',e=>{ AudioFX.setEnabled(e.target.checked); AudioFX.ensure(); });
window.addEventListener('pointerdown',()=>AudioFX.ensure(),{once:false});
</script>
