<textarea id="out" readonly>clicca sull'immagine…</textarea>
<script>
const marks=[];
const wrap=document.getElementById('wrap'),out=document.getElementById('out');
wrap.addEventListener('click',e=>{
  const r=wrap.getBoundingClientRect();
  const x=(e.clientX-r.left)/2, y=(e.clientY-r.top)/2;      // canvas px
  const barX=x-120, barY=y-120;                        // → coord bar-slim device px
  marks.push({barX:+barX.toFixed(1),barY:+barY.toFixed(1)});
  const d=document.createElement('div');d.className='mk';
  d.style.left=(e.clientX-r.left)+'px';d.style.top=(e.clientY-r.top)+'px';
  d.textContent=marks.length;wrap.appendChild(d);render();});
function render(){out.value=marks.map((m,i)=>`#${i+1}  bar-slim(${m.barX},${m.barY})`).join('\n');}
function undo(){marks.pop();wrap.querySelector('.mk:last-of-type')?.remove();render();}
function copy(){out.select();document.execCommand('copy');}
</script></body></html>
