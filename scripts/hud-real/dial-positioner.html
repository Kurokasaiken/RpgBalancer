/* cx,cy = centro della SEDE gemma (dove sede sole/luna). La sede dipinta in
 * dial-frame.webp non è al centro del canvas: misurata a (−2.9, −4.0) design px
 * dal centro → il frame va disegnato con offset (+2.9, +4.0). La sede misura
 * r≈31. Stato battezzato (R-380, 2026-11-24): seat 25.6,22.9 (= canvas frame al
 * pick 28.5,26.9), disc 26.15 = il «100%» del Director (Ø52.3 = fill 87%, bordo
 * smeraldo ~5px visibile), corona r 31. */
let cx=28.6, cy=26.7, dock=58, fsize=170, fill=68, rtick=35.6;
const S=2, PADY=40, EDGE=30;          // design->dev scale, canvas pad, viewport line x
const SEAT_R=37, FOFF_X=-0.1, FOFF_Y=0.2;
const BAR_W=839, BAR_H=108;
const cv=document.getElementById('cv'), g=cv.getContext('2d');
let drag=null; // 'dock' | 'dial'
function load(){let n=0;for(const k in src){IMG[k]=new Image();IMG[k].onload=()=>{if(++n===Object.keys(src).length)draw()};IMG[k].src=src[k]}}
function barX(){return EDGE+dock*S}
function dialX(){return barX()+cx*S}
function dialY(){return PADY+cy*S}
function draw(){
 g.clearRect(0,0,cv.width,cv.height);
 // scacchiera
 for(let y=0;y<cv.height;y+=16)for(let x=0;x<cv.width;x+=16){g.fillStyle=((x+y)/16)%2?'#bab6ae':'#d8d4cd';g.fillRect(x,y,16,16)}
 // bordo schermo
 g.strokeStyle='#e33';g.lineWidth=2;g.beginPath();g.moveTo(EDGE,0);g.lineTo(EDGE,cv.height);g.stroke();
 g.fillStyle='#e33';g.font='11px system-ui';g.fillText('bordo schermo',EDGE+4,12);
 const bx=barX(), dx=dialX(), dy=dialY();
 g.drawImage(IMG.bar,bx,PADY,BAR_W,BAR_H);
 // frame (canvas decentrato rispetto alla sede → offset misurato)
 g.drawImage(IMG.frame,dx+FOFF_X*S-fsize/2,dy+FOFF_Y*S-fsize/2,fsize,fsize);
 // disco — centrato sulla sede (dx,dy)
 const img=document.getElementById('night').checked?IMG.moon:(document.getElementById('alpha').checked?IMG.sunA:IMG.sun);
 const ds=SEAT_R*2*fill/100*S;
 g.drawImage(img,dx-ds/2,dy-ds/2,ds,ds);
 // corona tick (schema)
 if(document.getElementById('ticks').checked){
  g.strokeStyle='rgba(255,220,140,.9)';g.lineWidth=1.2;
  for(let i=0;i<24;i++){const a=i/24*Math.PI*2,R=rtick*S,in_=R-8;
   g.beginPath();g.moveTo(dx+Math.cos(a)*in_,dy+Math.sin(a)*in_);
   g.lineTo(dx+Math.cos(a)*R,dy+Math.sin(a)*R);g.stroke();}
 }
 // centro sede
 g.strokeStyle='#f4f';g.lineWidth=1;g.beginPath();g.moveTo(dx-6,dy);g.lineTo(dx+6,dy);g.moveTo(dx,dy-6);g.lineTo(dx,dy+6);g.stroke();
 out();
}
function out(){
 const discD=(SEAT_R*2*fill/100).toFixed(1);
 document.getElementById('out').textContent=
`cassettoLayoutConfig.topChrome:
  bannerMarginPx: ${dock.toFixed(1)}   (px dal bordo schermo)

dialSlim (design px, relativi al top-left di bar-slim):
  cx: ${cx.toFixed(1)}  cy: ${cy.toFixed(1)}   (centro sede)
  frame: { url, size: ${fsize/2}, offset: { x: ${FOFF_X}, y: ${FOFF_Y} } }
  r (corona): ${rtick}
  disc: ${(SEAT_R*fill/100).toFixed(2)}   (Ø ${discD} design px)`;
}
cv.onpointerdown=e=>{
 const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
 const dx=dialX(),dy=dialY();
 const onDial=Math.hypot(mx-dx,my-dy)<fsize*0.6;
 drag=onDial?'dial':'dock';cv.setPointerCapture(e.pointerId);drag.ox=mx;drag.oy=my;
 drag.cx=cx;drag.cy=cy;drag.dock=dock;
};
cv.onpointermove=e=>{if(!drag)return;
 const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
 if(drag==='dial'){cx=drag.cx+(mx-drag.ox)/S;cy=drag.cy+(my-drag.oy)/S}
 else{dock=drag.dock+(mx-drag.ox)/S}
 draw();
};
cv.onpointerup=()=>drag=null;
addEventListener('keydown',e=>{const st=e.shiftKey?5:.5;let u=true;
 if(e.key==='ArrowLeft')cx-=st;else if(e.key==='ArrowRight')cx+=st;
 else if(e.key==='ArrowUp')cy-=st;else if(e.key==='ArrowDown')cy+=st;else u=false;
 if(u){e.preventDefault();draw()}});
size.oninput=()=>{fsize=+size.value;sizeV.textContent=fsize/2;draw()};
fill.oninput=()=>{fill=+fill.value;fillV.textContent=fill;draw()};
night.onchange=alpha.onchange=ticks.onchange=draw;
copy.onclick=()=>navigator.clipboard.writeText(out.textContent);
load();
</script></body></html>
