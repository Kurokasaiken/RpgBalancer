const IMG=new Image(); IMG.onload=draw; IMG.src=src;
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const W=document.getElementById('w'), Y=document.getElementById('y');
W.oninput=Y.oninput=draw;
function params(){return {w:+W.value, y:+Y.value}}
function draw(){
 document.getElementById('wV').textContent=W.value;
 document.getElementById('yV').textContent=Y.value;
 const p=params();
 g.clearRect(0,0,cv.width,cv.height);
 // scacchiera
 for(let yy=0;yy<cv.height;yy+=16)for(let x=0;x<cv.width;x+=16){g.fillStyle=((x+yy)/16)%2?'#bab6ae':'#d8d4cd';g.fillRect(x,yy,16,16)}
 // socket mock: alcova scura con ring oro
 const CX=170,CY=170,R=140;
 g.save();g.beginPath();g.arc(CX,CY,R,0,7);g.clip();
 const grd=g.createRadialGradient(CX,CY,10,CX,CY,R);
 grd.addColorStop(0,'#12293d');grd.addColorStop(1,'#06090f');

 g.strokeStyle='#c9a44a';g.lineWidth=6;g.beginPath();g.arc(CX,CY,R-3,0,7);g.stroke();
 // forziere (socket 128 scalato 2x=256 -> R=140 ~ diametro 280)
 const S=280/128;
 const cw=p.w/100*128*S, ch=cw*IMG.height/IMG.width;
 const cx=CX-cw/2, cy=CY-128*S/2 + p.y/100*(128*S-ch);
 g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
 g.drawImage(IMG,cx,cy,cw,ch);
 // preview 27px reale
 g.save();g.beginPath();g.arc(430,120,16,0,7);g.clip();
 g.fillStyle='#0a1420';g.fillRect(414,104,32,32);g.restore();

 const s=30/128, w2=p.w/100*128*s, h2=w2*IMG.height/IMG.width;
 g.drawImage(IMG,430-w2/2,120-15+p.y/100*(30-h2),w2,h2);
 g.fillStyle='#9aa';g.font='11px system-ui';g.fillText('~27px live',414,150);
 // canvas export view
 g.fillStyle='#9aa';g.fillText('canvas 128 (export)',520,60);
 const off=document.createElement('canvas');off.width=off.height=128;
 const og=off.getContext('2d');
 const ew=p.w/100*128, eh=ew*IMG.height/IMG.width;
