name: Coordinator

on:
  push:
    paths:
      - "src/docs/docs/coordinator/agent_assignments.md"
  workflow_dispatch:
  schedule:
    # Run every 5 minutes to check for new tasks
    - cron: '*/5 * * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: coordinator-queue
  cancel-in-progress: false

jobs:
  coordinator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r coordinator/requirements.txt 2>/dev/null || pip install pyyaml

      - name: Run coordinator to select batch
        run: python coordinator/coordinator.py --select-only --output coordinator/batch.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coordinator/batch.json coordinator/live_registry.json
          git diff --cached --quiet || git commit -m "Coordinator: batch selection [ci skip]"
          git push
