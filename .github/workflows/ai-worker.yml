name: AI Worker

on:
  push:
    paths:
      - "ai-worker/kanban.json"
  workflow_run:
    workflows: ["Coordinator"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  select-tasks:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      max_parallel: ${{ steps.set-matrix.outputs.max_parallel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set matrix from ai-worker kanban
        id: set-matrix
        run: |
          echo "matrix=$(jq -c '.tasks' ai-worker/kanban.json)" >> $GITHUB_OUTPUT
          echo "max_parallel=1" >> $GITHUB_OUTPUT

  ai-worker:
    needs: select-tasks
    if: needs.select-tasks.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: ${{ needs.select-tasks.outputs.max_parallel }}
      matrix:
        task: ${{ fromJson(needs.select-tasks.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ai-worker/requirements.txt

      - name: Run AI worker for task
        id: run-task
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          python ai-worker/coordinator.py
          echo "status=done" >> $GITHUB_OUTPUT

      - name: Write registry end event
        if: always()
        run: |
          mkdir -p coordinator/registry-events
          echo "{\"task_id\": \"${{ matrix.task.id }}\", \"ended_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"status\": \"${{ steps.run-task.outputs.status || 'failed' }}\", \"model_used\": \"\"}" > coordinator/registry-events/${{ matrix.task.id }}-end.json

      - name: Commit and push changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ai-worker/kanban.json
          git add test-results/ai-worker-*.json 2>/dev/null || true
          git add coordinator/registry-events/${{ matrix.task.id }}-end.json
          git diff --cached --quiet || git commit -m "AI worker: ${{ matrix.task.id }} [ci skip]"

          # Retry with rebase on conflict (max 3 attempts)
          for i in {1..3}; do
            if git push; then
              break
            else
              echo "Push failed, attempt $i/3, trying rebase..."
              git pull --rebase
              git push
              break
            fi
          done
