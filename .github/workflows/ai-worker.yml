name: AI Worker

on:
  push:
    paths:
      - "ai-worker/kanban.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  select-tasks:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r coordinator/requirements.txt 2>/dev/null || pip install pyyaml

      - name: Run coordinator to select batch
        run: python coordinator/coordinator.py --select-only --output coordinator/batch.json

      - name: Set matrix output
        id: set-matrix
        run: echo "matrix=$(cat coordinator/batch.json)" >> $GITHUB_OUTPUT

  ai-worker:
    needs: select-tasks
    if: needs.select-tasks.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 20
      matrix:
        task: ${{ fromJson(needs.select-tasks.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ai-worker/requirements.txt

      - name: Run AI worker for task
        id: run-task
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TASK_ID: ${{ matrix.task.task_id }}
          CHANNEL: ${{ matrix.task.channel }}
          MODEL: ${{ matrix.task.model }}
        run: |
          python ai-worker/coordinator.py --task-id $TASK_ID --channel $CHANNEL --model $MODEL
          echo "status=done" >> $GITHUB_OUTPUT

      - name: Write registry end event
        if: always()
        run: |
          mkdir -p coordinator/registry-events
          echo "{\"task_id\": \"${{ matrix.task.task_id }}\", \"ended_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"status\": \"${{ steps.run-task.outputs.status || 'failed' }}\", \"model_used\": \"${{ matrix.task.model }}\"}" > coordinator/registry-events/${{ matrix.task.task_id }}-end.json

      - name: Commit and push changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coordinator/registry-events/${{ matrix.task.task_id }}-end.json
          git diff --cached --quiet || git commit -m "AI worker: task end event [ci skip]"
          
          # Retry with rebase on conflict (max 3 attempts)
          for i in {1..3}; do
            if git push; then
              break
            else
              echo "Push failed, attempt $i/3, trying rebase..."
              git pull --rebase
              git push
              break
            fi
          done
