
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<style>
  :root {
    --fd:"Cinzel",serif; --fs:"EB Garamond",Georgia,serif; --fn:system-ui,sans-serif;
    --parchment:#ede0c4; --parch-soft:rgba(237,224,196,0.92);
    --gold:#d8b13e; --gold-bright:#f0cf6a; --label:#c9a84e; --label-dim:#9a8246;
    --hp:#7bc96f; --hp-dim:rgba(123,201,111,0.85); --stamina:#e0b23e;
  }
  .stage { padding:24px 14px; background:#4a5a6a; }
  .roster {
    max-width:820px; margin:0 auto; position:relative; overflow:hidden;
    background:radial-gradient(ellipse at 42% 12%, #100a06 0%, #070403 46%, #030202 88%);
    border-radius:14px; padding:24px 22px;
    box-shadow:inset 0 0 0 1px rgba(216,177,62,0.18), 0 8px 32px rgba(0,0,0,0.65);
  }
  .atm { position:absolute; inset:0; pointer-events:none; z-index:0; mix-blend-mode:screen; opacity:0.4; background:radial-gradient(ellipse 200px 160px at 20% 30%, rgba(216,177,62,0.08), transparent 70%), radial-gradient(ellipse 220px 160px at 80% 70%, rgba(240,207,106,0.06), transparent 70%); animation:atm-drift 24s ease-in-out infinite alternate; }
  @keyframes atm-drift { 0%{transform:translate(0,0);} 100%{transform:translate(-10px,-6px) scale(1.05);} }
  .content { position:relative; z-index:2; }

  .roster-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; padding:0 4px; }
  .roster-title { display:flex; align-items:baseline; gap:12px; }
  .roster-title .txt { font:600 11px/1 var(--fn); letter-spacing:0.4em; text-transform:uppercase; color:var(--label); text-shadow:0 1px 2px rgba(0,0,0,0.7); }
  .roster-title .count { font:700 13px/1 var(--fd); color:var(--gold-bright); letter-spacing:0.05em; }
  .roster-ctrl { display:flex; align-items:center; gap:10px; }
  .roster-ctrl .pill { display:flex; align-items:center; gap:8px; padding:7px 14px; border-radius:20px; border:1px solid rgba(216,177,62,0.25); background:rgba(216,177,62,0.04); font:600 10px/1 var(--fn); letter-spacing:0.2em; text-transform:uppercase; color:var(--label); cursor:pointer; transition:all 200ms; }
  .roster-ctrl .pill:hover { border-color:rgba(216,177,62,0.5); color:var(--gold-bright); }
  .roster-ctrl .icon-btn { width:34px; height:34px; border-radius:50%; border:1px solid rgba(216,177,62,0.22); background:rgba(216,177,62,0.03); display:flex; align-items:center; justify-content:center; color:var(--label-dim); cursor:pointer; transition:all 200ms; }
  .roster-ctrl .icon-btn:hover { border-color:rgba(216,177,62,0.45); color:var(--gold-bright); }

  .cards { display:flex; flex-direction:column; gap:14px; }

  .card {
    position:relative; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:20px;
    padding:18px 22px; border-radius:10px; cursor:grab;
    background:linear-gradient(160deg, rgba(216,177,62,0.05) 0%, rgba(20,12,7,0.2) 45%, rgba(6,4,3,0.3) 100%);
    box-shadow:inset 0 1px 0 rgba(216,177,62,0.1), inset 0 2px 10px rgba(0,0,0,0.35), inset 0 -1px 0 rgba(0,0,0,0.3);
    transition:all 300ms ease;
  }
  .card::before { content:''; position:absolute; left:0; top:15%; bottom:15%; width:2px; border-radius:2px; background:linear-gradient(180deg, transparent, var(--gold), transparent); opacity:0; transition:opacity 300ms; box-shadow:0 0 8px rgba(240,207,106,0.4); }
  .card:hover { background:linear-gradient(160deg, rgba(216,177,62,0.08) 0%, rgba(20,12,7,0.2) 45%, rgba(6,4,3,0.3) 100%); box-shadow:inset 0 1px 0 rgba(216,177,62,0.15), inset 0 2px 10px rgba(0,0,0,0.35), 0 0 20px rgba(216,177,62,0.08); transform:translateY(-1px); }
  .card:hover::before { opacity:0.6; }

  .card.hero { box-shadow:inset 0 1px 0 rgba(240,207,106,0.2), inset 0 2px 10px rgba(0,0,0,0.35), 0 0 16px rgba(216,177,62,0.12); }
  .card.hero::after { content:''; position:absolute; inset:0; border-radius:10px; pointer-events:none; box-shadow:inset 0 0 0 1px rgba(216,177,62,0.25); }

  .card-identity { display:flex; flex-direction:column; gap:6px; min-width:160px; }
  .card-name { font:700 20px/1 var(--fd); letter-spacing:0.03em; color:var(--parchment); text-shadow:0 1px 0 rgba(0,0,0,0.6), 0 0 14px rgba(240,207,106,0.06); }
  .card-role { font:600 10px/1 var(--fn); letter-spacing:0.24em; text-transform:uppercase; color:var(--label-dim); text-shadow:0 1px 2px rgba(0,0,0,0.6); display:flex; align-items:center; gap:7px; }
  .card-role .dot { width:6px; height:6px; border-radius:50%; background:var(--hp); box-shadow:0 0 6px rgba(123,201,111,0.6); }

  .card-bars { display:flex; flex-direction:column; gap:12px; }
  .bar-block { display:flex; flex-direction:column; gap:5px; }
  .bar-head { display:flex; justify-content:space-between; align-items:baseline; }
  .bar-label { font:600 10px/1 var(--fn); letter-spacing:0.24em; text-transform:uppercase; color:var(--label-dim); text-shadow:0 1px 2px rgba(0,0,0,0.6); }
  .bar-value { font:600 12px/1 var(--fn); color:var(--parch-soft); letter-spacing:0.04em; font-variant-numeric:tabular-nums; text-shadow:0 1px 1px rgba(0,0,0,0.5); }
  .bar-track { height:7px; border-radius:5px; background:rgba(6,4,3,0.7); box-shadow:inset 0 1px 3px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(216,177,62,0.06); overflow:hidden; position:relative; }
  .bar-fill { height:100%; border-radius:5px; position:relative; }
  .bar-fill::after { content:''; position:absolute; inset:0 0 50% 0; border-radius:5px 5px 0 0; background:linear-gradient(180deg, rgba(255,255,255,0.22), transparent); }
  .bar-fill.hp { background:linear-gradient(90deg, #4a9e5a, #7bc96f); box-shadow:0 0 8px rgba(123,201,111,0.3); }
  .bar-fill.stamina { background:linear-gradient(90deg, #b8862a, #e0b23e); box-shadow:0 0 8px rgba(224,178,62,0.3); }

  .card-portrait { position:relative; width:56px; height:56px; flex-shrink:0; }
  .card-portrait .frame { width:100%; height:100%; border-radius:50%; overflow:hidden; border:1.5px solid var(--gold); box-shadow:inset 0 1px 4px rgba(0,0,0,0.5), 0 0 12px rgba(216,177,62,0.2); background:radial-gradient(circle at 38% 32%, #2a1810, #0a0503); }
  .card-portrait .frame img { width:100%; height:100%; object-fit:cover; }
  .card-portrait .initials { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font:700 18px var(--fd); color:var(--gold-bright); }

  .caption { max-width:820px; margin:16px auto 0; font:12px/1.5 var(--fn); color:rgba(255,255,255,0.5); text-align:center; letter-spacing:0.03em; }
</style>

<div class="stage">
  <div class="roster">
    <div class="atm"></div>
    <div class="content">

      <div class="roster-hdr">
        <div class="roster-title">
          <span class="txt">Roster</span>
          <span class="count">3 / 3</span>
        </div>
        <div class="roster-ctrl">
          <div class="pill">Tutti
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
          </div>
          <div class="icon-btn"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M14.5 4l5.5 5.5M9.5 20l-5.5-5.5M4 4l16 16M20 4L4 20"/></svg></div>
          <div class="icon-btn"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg></div>
        </div>
      </div>

      <div class="cards">

        <div class="card hero">
          <div class="card-identity">
            <span class="card-name">Giggiolillo</span>
            <span class="card-role"><span class="dot"></span>Eroe attivo</span>
          </div>
          <div class="card-bars">
            <div class="bar-block">
              <div class="bar-head"><span class="bar-label">HP</span><span class="bar-value">195 / 195</span></div>
              <div class="bar-track"><div class="bar-fill hp" style="width:100%;"></div></div>
            </div>
            <div class="bar-block">
              <div class="bar-head"><span class="bar-label">Stamina</span><span class="bar-value">100%</span></div>
              <div class="bar-track"><div class="bar-fill stamina" style="width:100%;"></div></div>
            </div>
          </div>
          <div class="card-portrait"><div class="frame"><div class="initials">G</div></div></div>
        </div>

        <div class="card">
          <div class="card-identity">
            <span class="card-name">Salvatrice</span>
            <span class="card-role"><span class="dot"></span>Disponibile</span>
          </div>
          <div class="card-bars">
            <div class="bar-block">
              <div class="bar-head"><span class="bar-label">HP</span><span class="bar-value">142 / 180</span></div>
              <div class="bar-track"><div class="bar-fill hp" style="width:79%;"></div></div>
            </div>
            <div class="bar-block">
              <div class="bar-head"><span class="bar-label">Stamina</span><span class="bar-value">64%</span></div>
              <div class="bar-track"><div class="bar-fill stamina" style="width:64%;"></div></div>
            </div>
          </div>
          <div class="card-portrait"><div class="frame"><div class="initials">S</div></div></div>
        </div>

        <div class="card">
          <div class="card-identity">
            <span class="card-name">Baldassarre</span>
            <span class="card-role"><span class="dot" style="background:#d98a4a; box-shadow:0 0 6px rgba(217,138,74,0.6);"></span>Ferito</span>
          </div>
          <div class="card-bars">
            <div class="bar-block">
              <div class="bar-head"><span class="bar-label">HP</span><span class="bar-value">38 / 160</span></div>
              <div class="bar-track"><div class="bar-fill hp" style="width:24%; background:linear-gradient(90deg,#9e5a4a,#d98a4a);"></div></div>
            </div>
            <div class="bar-block">
              <div class="bar-head"><span class="bar-label">Stamina</span><span class="bar-value">28%</span></div>
              <div class="bar-track"><div class="bar-fill stamina" style="width:28%;"></div></div>
            </div>
          </div>
          <div class="card-portrait"><div class="frame"><div class="initials">B</div></div></div>
        </div>

      </div>

    </div>
  </div>
  <p class="caption">passa il mouse sulle card — il rail dorato appare a sinistra, come negli slot della quest</p>
</div>
