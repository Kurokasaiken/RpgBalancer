<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- EPIC FAIL: inner rim of the SKILL circle -->
  <path d="M 210 20 A 190 190 0 1 1 209.9 20" fill="none" stroke="#9e2b20" stroke-width="28" opacity="0.95"/>

  <!-- FAIL: ring between almost and epicfail -->
  <circle cx="210" cy="210" r="152" fill="none" stroke="#5a6bff" stroke-width="46" opacity="0.85"/>

  <!-- WIN/BIGWIN star (gold) with ALMOST as its bronze stroke -->
  <!-- True 5-point star: 10 vertices (5 outer tips, 5 inner points) -->
  <polygon points="210,20 280,96 390,151 321,276 260,352 210,280 160,352 98,276 29,151 139,96" fill="#fdd97b" stroke="#b08035" stroke-width="28" stroke-linejoin="round"/>

  <!-- BIGWIN: tiny white center -->
  <circle cx="210" cy="210" r="16" fill="#fff" stroke="#fdd97b" stroke-width="2" filter="url(#glow)"/>

  <!-- WOUNDED: transversal band -->
  <line x1="60" y1="340" x2="360" y2="80" stroke="#ff3df0" stroke-width="8" stroke-linecap="butt" opacity="0.8"/>

  <!-- DEAD: transversal band crossing the first -->
  <line x1="60" y1="80" x2="360" y2="340" stroke="#02020b" stroke-width="8" stroke-linecap="butt" stroke-opacity="0.95"/>

  <!-- Ball example -->
  <circle cx="245" cy="138" r="7" fill="#3fa9f5" stroke="#02020b" stroke-width="2" filter="url(#glow)"/>

  <!-- 5 axes (black lines, drawn last to be on top) -->
  <line x1="210" y1="210" x2="210" y2="20" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <line x1="210" y1="210" x2="390" y2="151" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <line x1="210" y1="210" x2="321" y2="363" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <line x1="210" y1="210" x2="98" y2="363" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <line x1="210" y1="210" x2="29" y2="151" stroke="#000" stroke-width="3" stroke-linecap="round"/>
</svg>
