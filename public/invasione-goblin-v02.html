<!doctype html> <html lang="it"><head><meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"> <title>Prototipo: Invasione Goblin v0.2</title> <style> :root{--bg:#eef1f0;--fg:#1d2624;--card:#fff;--mut:#66726f;--ac:#1f6f5c;--main:#7a4fb5;--bad:#b3261e;--bd:#cfd6d4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a19;--fg:#e6ecea;--card:#1f2827;--mut:#93a09c;--ac:#4cc3a4;--main:#b995ee;--bad:#ff8a80;--bd:#34413f}} :root[data-theme="dark"]{--bg:#141a19;--fg:#e6ecea;--card:#1f2827;--mut:#93a09c;--ac:#4cc3a4;--main:#b995ee;--bad:#ff8a80;--bd:#34413f} html{scroll-padding-top:env(safe-area-inset-top,0px)} body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif} main{max-width:760px;margin:0 auto;padding:12px} .box{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:10px} .row{display:flex;flex-wrap:wrap;gap:6px 14px} .mut{color:var(--mut);font-size:13px} h2{font-size:15px;margin:14px 0 6px} .q{display:flex;justify-content:space-between;gap:10px;align-items:center} .q.m{border-left:4px solid var(--main)} button{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:6px;padding:7px 11px;cursor:pointer} button:disabled{opacity:.4;cursor:not-allowed} button.alt{background:transparent;color:var(--fg);border:1px solid var(--bd)} input{font:inherit;width:90px;padding:5px 7px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--fg)} #log{font-size:13px;max-height:190px;overflow:auto} #hist{font-size:13px;max-height:160px;overflow:auto} .bad{color:var(--bad)} </style></head><body><main id="app"></main> <script> const mulberry32=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}; let rng=mulberry32(1); const R=(a,b)=>a+Math.floor(rng()*(b-a+1)),d2=()=>R(1,6)+R(1,6); const pr=n=>{let c=0;for(let a=1;a<=6;a++)for(let b=1;b<=6;b++)if(a+b>=n)c++;return Math.round(c*100/36)}; const NM={FOR:['Battuta di caccia','Il troll del ponte'],AST:['Rovine dimenticate','La cripta sigillata'],CAR:['Carovana di passaggio','Alleanza col barone']}; const RES=['legna','ferro','cibo','oro']; const ITM={pal:'+1 palizzata',trn:'+3 villager addestrati',oil:'olio trappole (+1 per trappola, permanente)',FOR:'+1 Forza',AST:'+1 Astuzia',CAR:'+1 Carisma'}; const BLD={seg:['Segheria','legna',['cibo','oro']],min:['Miniera','ferro',['legna','oro']],cam:['Campi','cibo',['legna','ferro']]}; const ANM={pal:'Palizzata',trn:'Addestramento',trap:'Trappole',seg:'Segheria',min:'Miniera',cam:'Campi',FOR:'Allenamento FOR',AST:'Allenamento AST',CAR:'Allenamento CAR'}; let S; function init(seed){S={seed:(seed===undefined?Math.floor(Math.random()*2147483647):seed)>>>0,day:0,res:{legna:15,ferro:10,cibo:15,oro:10},st:{FOR:5,AST:3,CAR:2},b:{seg:0,min:0,cam:0},pop:20,pal:0,trn:0,traps:0,oil:0,q:[],nS:6,nM:12,inv:0,nI:120,kingAt:60,log:[],hist:[],qDone:0,qFail:0,end:null,win:0,id:1};rng=mulberry32(S.seed); batch();render()} function newRun(){const el=document.getElementById('seedIn'),v=el&&el.value.trim()!==''?parseInt(el.value,10):NaN;init(Number.isFinite(v)?v:undefined)} function lg(t,c){S.log.unshift(`<div class="${c||''}">g${S.day}: ${t}</div>`);S.log=S.log.slice(0,40)} const hist=t=>S.hist.push(`g${S.day} — ${t}`); const rr=()=>RES[R(0,3)]; function batch(){for(let i=0;i<3;i++)spawn(0)} function spawn(main){const k=['FOR','AST','CAR'][R(0,2)],lv=Math.floor(S.day/60); const avg=Math.round((S.st[k]+(S.st.FOR+S.st.AST+S.st.CAR)/3)/2),d=main?R(0,6):R(-3,4),dc=avg+7+d,v=f=>Math.round((8+2.5*(d+3)+2*lv)*f*(0.8+rng()*.4)); let q={id:S.id++,stat:k,main,t:main?R(6,8):R(3,5),dc,exp:S.day+(main?R(20,30):R(5,7)),req:main?R(4,6):0,name:NM[k][main?1:0]}; if(main)q.rw=[{r:rr(),v:v(1.5)},{r:rr(),v:v(1)},{i:['pal','trn','oil',k][R(0,3)]}]; else{q.rw=[{r:rr(),v:v(.8)}];if(rng()<.35)q.rw.push({r:rr(),v:v(.4)});if(rng()<.06)q.rw.push({i:k})} S.q.push(q)} const pw=q=>q.king?S.st.FOR+S.st.AST+Math.floor(S.trn/2):S.st[q.stat]; const ok=q=>q.king?S.st.FOR+S.st.AST>=10:S.st[q.stat]>=q.req; const inc=()=>({legna:S.b.seg,ferro:S.b.min,cibo:S.b.cam,oro:0}); function adv(n){for(let i=0;i<n&&!S.end;i++){S.day++; for(const r in inc())S.res[r]+=inc()[r]; if(S.day>=S.nS){batch();S.nS=S.day+6} if(S.day>=S.nM){if(S.q.filter(q=>q.main&&!q.king).length<2)spawn(1);S.nM=S.day+R(18,26)} if(S.day>=S.kingAt&&!S.q.some(q=>q.king)){S.q.push({id:S.id++,king:1,main:1,stat:'FOR',name:'Il Re dei Goblin',t:8,dc:40,exp:S.day+300,rw:[]});lg('Il Re dei Goblin si mostra: puoi sfidarlo.')} S.q=S.q.filter(q=>{if(q.exp<=S.day){lg(`Scaduta: ${q.name}`,'mut');return false}return true}); if(S.day>=S.nI)invade()}render()} const thr=n=>70+45*n+12*n*n,def=()=>6+S.pal*8+S.trn*3+S.traps*(2+S.oil); function invade(){const T=thr(S.inv),D=def(),m=D+(d2()-7)*2-T; lg(`INVASIONE #${S.inv+1}: difesa ${D} vs ${T} (margine ${m>0?'+':''}${m})`,m<0?'bad':''); if(m>=0){const l=Math.max(0,Math.floor((10-m)/5));S.pop-=l;if(l)lg(`Perdi ${l} villager.`,'bad')} else{const l=3+Math.floor(-m/4);S.pop-=l;lg(`Perdi ${l} villager.`,'bad');if(m<-8&&S.pal){S.pal--;lg('Una palizzata crolla.','bad')}if(m<-30)S.pop=0} S.traps=0;S.inv++;S.nI+=120; if(S.pop<=0){S.end='Il villaggio è caduto.';return} S.pop=Math.min(S.pop+3,30);S.trn=Math.min(S.trn,S.pop)} function go(id){const q=S.q.find(x=>x.id==id);if(!q||S.end||!ok(q))return; const tot=d2()+pw(q),m=tot-q.dc;S.q=S.q.filter(x=>x.id!=id); if(m>=0){S.qDone++;hist(`${q.main?'★ ':''}${q.name}: successo`);const crit=m>=4,mul=crit?1.5:1;let g=[]; q.rw.forEach(r=>{if(r.r){const v=Math.round(r.v*mul);S.res[r.r]+=v;g.push(`+${v} ${r.r}`)}else{ if(r.i=='pal')S.pal++;else if(r.i=='trn')S.trn=Math.min(S.trn+3,S.pop);else if(r.i=='oil')S.oil++;else S.st[r.i]++;g.push(ITM[r.i])}}); lg(`${q.name}: ${tot} vs ${q.dc} — ${crit?'successo pieno':'successo'}. ${g.join(', ')}`); if(q.king){S.end='Hai sconfitto il Re dei Goblin! Le invasioni finiscono.';S.win=1;render();return}} else{S.qFail++;hist(`${q.main?'★ ':''}${q.name}: fallita`);lg(`${q.name}: ${tot} vs ${q.dc} — fallito.`,'bad'); if(m<=-4){const l=q.main?2:1;S.pop-=l;lg(`Perdi ${l} villager nel fallimento.`,'bad')} if(q.king){S.pop-=5;S.trn=Math.floor(S.trn/2);S.kingAt=S.day+q.t+30;lg('Il Re ti respinge con gravi perdite.','bad')}} if(S.pop<=0)S.end='Il villaggio è caduto.';adv(q.t)} const bc=k=>{const l=S.b[k],[,,[a,b]]=BLD[k];return {[a]:15+8*l,[b]:10+6*l}}; const tc=s=>({cibo:8+3*S.st[s],oro:5+2*S.st[s]}); const C={pal:()=>({legna:30+15*S.pal}),trn:()=>({cibo:10,oro:6}),trap:()=>({ferro:8}),seg:()=>bc('seg'),min:()=>bc('min'),cam:()=>bc('cam'),FOR:()=>tc('FOR'),AST:()=>tc('AST'),CAR:()=>tc('CAR')}; const can=k=>!S.end&&Object.entries(C[k]()).every(([r,v])=>S.res[r]>=v)&&(k!='trn'||S.pop-S.trn>=2); function act(k){if(!can(k))return;Object.entries(C[k]()).forEach(([r,v])=>S.res[r]-=v);hist(ANM[k]); if(k=='pal'){S.pal++;lg('Costruita una palizzata.');adv(3)} else if(k=='trn'){S.trn+=2;lg('Addestrati 2 villager.');adv(2)} else if(k=='trap'){S.traps+=3;lg('Piazzate 3 trappole.');adv(1)} else if(BLD[k]){S.b[k]++;lg(`${BLD[k][0]} livello ${S.b[k]}.`);adv(3)} else{S.st[k]++;lg(`Allenamento: +1 ${k}.`);adv(4)}} const cs=o=>Object.entries(o).map(([r,v])=>v+' '+r).join(', '); const bt=(k,l,d)=>`<button ${can(k)?'':'disabled'} onclick="act('${k}')">${l} · ${cs(C[k]())} · ${d}g</button>`; function summary(){const h=S.hist.map(t=>`<div>${t}</div>`).join('')||'<div class="mut">Nessuna azione registrata.</div>'; return `<div class="box ${S.win?'':'bad'}"><b>${S.end}</b> <div class="row" style="margin-top:6px"><span>Giorno <b>${S.day}</b></span><span>Invasioni affrontate <b>${S.inv}</b></span><span>Villager <b>${S.pop}</b></span><span>Quest riuscite <b>${S.qDone}</b> / fallite <b>${S.qFail}</b></span></div> <div class="row mut">Risorse: ${RES.map(r=>r+' '+S.res[r]).join(', ')}</div> <div class="row mut">Difese: palizzate ${S.pal} · addestrati ${S.trn} · olio ${S.oil} · trappole ${S.traps} — Investimenti: ${Object.keys(BLD).map(k=>BLD[k][0]+' lv'+S.b[k]).join(', ')} — FOR ${S.st.FOR} · AST ${S.st.AST} · CAR ${S.st.CAR}</div> <div class="mut" style="margin-top:6px">Seed <b>${S.seed}</b> — riproduci questa partita inserendo lo stesso seed.</div> <div class="row" style="margin-top:6px"><input id="seedIn" type="number" value="${S.seed}"><button onclick="newRun()">Ricomincia con seed</button><button class="alt" onclick="init()">Seed casuale</button></div></div> <h2>Storia delle scelte</h2><div class="box" id="hist">${h}</div>`} function render(){const q=[...S.q].sort((a,b)=>b.main-a.main||a.exp-b.exp),I=inc(); document.getElementById('app').innerHTML=` <div class="box"><b>Giorno ${S.day}</b> · invasione #${S.inv+1} tra <b>${S.nI-S.day}</b> giorni <div class="mut">Minaccia ${thr(S.inv)} · Difesa attuale <b style="color:${def()>=thr(S.inv)?'var(--ac)':'var(--bad)'}">${def()}</b> (base 6 + palizzate ${S.pal}×8 + addestrati ${S.trn}×3 + trappole ${S.traps}×${2+S.oil})</div> <div class="row" style="margin-top:6px">${RES.map(r=>`<span>${r} <b>${S.res[r]}</b>${I[r]?` <span class="mut">(+${I[r]}/g)</span>`:''}</span>`).join('')}</div> <div class="row mut">Villager ${S.pop} · FOR ${S.st.FOR} · AST ${S.st.AST} · CAR ${S.st.CAR} · Seed ${S.seed}</div> ${S.end?'':`<div class="row" style="margin-top:6px"><input id="seedIn" type="number" value="${S.seed}"><button class="alt" onclick="newRun()">Ricomincia con seed</button><button class="alt" onclick="init()">Seed casuale</button></div>`}</div> ${S.end?summary():''} <h2>Difesa (costa e basta)</h2><div class="box row">${bt('pal','Palizzata +1',3)}${bt('trn','Addestra 2',2)}${bt('trap','3 trappole',1)}</div> <h2>Investimenti (rendono col tempo)</h2><div class="box row">${Object.keys(BLD).map(k=>bt(k,`${BLD[k][0]} lv${S.b[k]+1} (+1 ${BLD[k][1]}/g)`,3)).join('')} ${['FOR','AST','CAR'].map(k=>bt(k,'Allena '+k,4)).join('')} <button class="alt" ${S.end?'disabled':''} onclick="adv(3)">Aspetta 3 giorni</button></div> <h2>Quest (scadono presto: ne fai una sola)</h2> ${q.map(x=>{const s=pw(x),good=ok(x);return `<div class="box q ${x.main?'m':''}"><div><b>${x.main?'★ ':''}${x.name}</b> <span class="mut">(${x.king?'FOR+AST+½addestrati':x.stat} ${s} vs CD ${x.dc}${x.req?` · richiede ${x.stat} ≥ ${x.req}`:''}${x.king?' · richiede FOR+AST ≥ 10':''})</span> <div class="mut">Reward: ${x.rw.map(r=>r.r?r.v+' '+r.r:ITM[r.i]).join(', ')||'fine delle invasioni'} · scade tra ${x.exp-S.day}g</div></div> <button ${good&&!S.end?'':'disabled'} onclick="go(${x.id})">${good?pr(x.dc-s)+'% · '+x.t+'g':'Requisiti'}</button></div>`}).join('')||'<div class="mut">Nessuna quest: aspetta.</div>'} <h2>Diario</h2><div class="box" id="log">${S.log.join('')}</div>`} init(); </script></body></html>
