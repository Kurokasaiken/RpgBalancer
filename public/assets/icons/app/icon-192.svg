<?xml version="1.0" encoding="UTF-8"?>
<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Gilded Observatory theme -->
  <rect width="192" height="192" rx="24" fill="#0b0b12"/>
  
  <!-- Outer ring -->
  <circle cx="96" cy="96" r="88" fill="none" stroke="#f2c94c" stroke-width="2" opacity="0.8"/>
  
  <!-- Inner decorative ring -->
  <circle cx="96" cy="96" r="76" fill="none" stroke="#f2c94c" stroke-width="1" opacity="0.4"/>
  
  <!-- RPG Balancer icon - Balance scales -->
  <g transform="translate(96, 96)">
    <!-- Scale base -->
    <rect x="-20" y="30" width="40" height="4" fill="#f2c94c"/>
    
    <!-- Scale pole -->
    <rect x="-2" y="-40" width="4" height="70" fill="#f2c94c"/>
    
    <!-- Scale beam -->
    <rect x="-60" y="-4" width="120" height="3" fill="#f2c94c"/>
    
    <!-- Left scale pan -->
    <path d="M -50 -4 L -45 -20 L -35 -20 L -30 -4 Z" fill="#f2c94c" opacity="0.9"/>
    
    <!-- Right scale pan -->
    <path d="M 30 -4 L 35 -20 L 45 -20 L 50 -4 Z" fill="#f2c94c" opacity="0.9"/>
    
    <!-- Balance indicators -->
    <circle cx="-40" cy="-12" r="2" fill="#0b0b12"/>
    <circle cx="40" cy="-12" r="2" fill="#0b0b12"/>
    
    <!-- Village/Sandbox elements -->
    <!-- Small house icon -->
    <g transform="translate(-40, -12)">
      <path d="M -8 0 L 0 -8 L 8 0 L 8 8 L -8 8 Z" fill="#f2c94c" opacity="0.7"/>
      <rect x="-2" y="2" width="4" height="6" fill="#0b0b12"/>
    </g>
    
    <!-- Stats bars -->
    <g transform="translate(32, -12)">
      <rect x="0" y="-6" width="3" height="12" fill="#f2c94c" opacity="0.7"/>
      <rect x="5" y="-4" width="3" height="10" fill="#f2c94c" opacity="0.7"/>
      <rect x="10" y="-8" width="3" height="16" fill="#f2c94c" opacity="0.7"/>
    </g>
  </g>
  
  <!-- Corner decorations -->
  <g opacity="0.3">
    <!-- Top left -->
    <path d="M 20 20 L 32 20 L 20 32 Z" fill="#f2c94c"/>
    <!-- Top right -->
    <path d="M 172 20 L 160 20 L 172 32 Z" fill="#f2c94c"/>
    <!-- Bottom left -->
    <path d="M 20 172 L 32 172 L 20 160 Z" fill="#f2c94c"/>
    <!-- Bottom right -->
    <path d="M 172 172 L 160 172 L 172 160 Z" fill="#f2c94c"/>
  </g>
</svg>
