# Registro icone — PLAN-058 T2.2, bibbia §11.
#
# Una voce per icona. Campi:
#   id          kebab-case, stabile; per le dipinte è anche il nome di cartella del prompt
#               (.mw/specs/icons/<id>/prompt.md) e del file finale.
#   livello     dipinta | incisa (bibbia §11.1).
#   famiglia    dipinte POI: impresa | minaccia (= sagoma del Sigillo, PLAN-058 T4.1;
#               "lavoro" non ha ancora glifi); poi: risorsa | medaglione.
#               incise: comando | navigazione | evento | ruolo | stato | oggetto.
#   soggetto    UNA frase in inglese: per le dipinte è la riga SUBJECT del prompt, con la
#               patina d'accento in coda ("; patina accent: ..."). Per le voci `needed`
#               è una bozza da rifinire in T3.1. Per le incise descrive il glifo.
#   taglie      dipinte [512, 128, 64, 32]; incise [24] (griglia SVG).
#   display_px  taglia d'uso nell'HUD (dipinte ancora): glifi POI 26 px (campo interno del
#               medaglione 44/55/69 px × 55-60%), risorse 28 px (riquadro ICON_BOX). Il soggetto
#               deve reggere quella taglia: niente raggi, crepe, anelli, rigature (lint I8).
#   stato       needed → prompted (prompt generato e lint verde) → candidate (immagini
#               generate, in scelta) → approved (scelta del Director, file montato).
#   ancora      true solo per le sei ancore di T2.6 (riferimento per i prompt successivi).
#   prompt      percorso del prompt generato, null finché `needed` o se incisa.
#   file        destinazione dell'asset finale nel repo (null = da decidere in T3.2).
#   fonte       da dove viene il soggetto nel contenuto canonico.
#   file (dipinte) = master 512; le taglie 128/64/32 stanno accanto con suffisso `-128`, `-64`, `-32`.
#   deroga      (facoltativa, solo dipinte) eccezione del Director alla kill list del kit per UNA icona:
#               {motivo, kill_omit: [voci della kill list da togliere, testo identico], allow_terms: [termini
#               di `banned_terms` ammessi nel soggetto]}. Letta da gen-icon-prompts.py e lint-icon-prompts.py.
#   provenance  null finché non c'è un'immagine; poi
#               {tool, model, variant: gpt|gemini|grok, date, operator, source_file}.
#
# Fuori dal registro, di proposito: quest legacy (city-rats, bandit-camp, …) e il ferro,
# finché non entra nel config canonico (decisione aperta di PLAN-058).

