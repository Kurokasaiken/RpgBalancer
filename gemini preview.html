<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Wanderlust UI Art Direction Mockup</title>
    <style>
        /* BASE & THEME PALETTE */
        body {
            background-color: #030305;
            color: #f0efe4; /* Ivory text */
            font-family: 'Times New Roman', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* THE WAR ROOM TABLE (CONTENITORE MACRO) */
        .war-room-table {
            position: relative;
            width: 900px;
            background: radial-gradient(circle at 50% 30%, #0c161a 0%, #050509 100%); /* Obsidian to Teal shadow base */
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 25px 50px -12px rgba(15, 115, 95, 0.25); /* Teal deep shadow */
            overflow: hidden;
        }

        /* SVG FILTER TEXTURE APPLIED VIA CSS */
        .stone-texture {
            filter: url(#stone-noise);
        }

        /* IL NUOVO PANNELLO MATERICO (LO STILE DEL MEDAGLIONE) */
        .layered-panel {
            position: relative;
            background: #070b10;
            border: 3px solid transparent;
            border-image: linear-gradient(135deg, #fce890 0%, #e4b048 20%, #a05c18 50%, #341604 100%) 3;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9), 0 10px 30px rgba(15, 113, 95, 0.15);
            padding: 24px;
            margin-bottom: 30px;
        }

        /* ANGOLI DECORATIVI A DIAMANTE */
        .layered-panel::before, .layered-panel::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: #e4b048;
            transform: rotate(45deg);
            box-shadow: 0 0 8px #fce890;
        }
        .layered-panel::before { top: -6px; left: -6px; }
        .layered-panel::after { bottom: -6px; right: -6px; }

        /* TITOLI IN AVORIO E RIGHE DORATE */
        h2 {
            color: #f0efe4;
            font-weight: 300;
            letter-spacing: 2px;
            margin-top: 0;
            text-transform: uppercase;
            border-bottom: 1px solid #a05c18;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        h2 span { color: #c9a227; font-size: 14px; align-self: flex-end; }

        /* SCANALATURA HP (PROGRESS BAR INCISE NELLA ROCCIA) */
        .hp-groove {
            width: 100%;
            height: 12px;
            background: #020406; /* Canale scavato scuro */
            border-radius: 6px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
            overflow: hidden;
            margin-top: 8px;
            position: relative;
        }
        .hp-fill-amber {
            height: 100%;
            width: 75%;
            background: linear-gradient(90deg, #a05c18 0%, #e4b048 80%, #fce890 100%);
            box-shadow: 0 0 12px #e4b048;
        }

        /* COMPONENTE GETTONE SKILL / FASE (CERCHIO COMPLESSO) */
        .astrolabe-preview {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .skill-token {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, #142129 0%, #050509 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 0 4px #a05c18, 0 0 0 6px #341604, 0 10px 20px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        /* STATO ATTIVO CON GLOW AMBRA/SOLARE */
        .token-active-amber {
            box-shadow: 0 0 0 4px #e4b048, 0 0 0 6px #a05c18, 0 0 20px rgba(228, 176, 72, 0.6);
            animation: breathing 4s ease-in-out infinite;
        }

        /* STATO ATTIVO CON GLOW TEAL/MERAVIGLIA */
        .token-active-teal {
            box-shadow: 0 0 0 4px #148c73, 0 0 0 6px #0c5445, 0 0 20px rgba(20, 140, 115, 0.8);
        }

        /* STATO DISATTIVATO (B&W / PASSATO) */
        .token-locked {
            filter: grayscale(1) brightness(0.4);
            box-shadow: 0 0 0 4px #333, 0 0 0 6px #111;
        }

        .token-icon {
            font-size: 24px;
            font-weight: bold;
            color: #f0efe4;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* GEMMA DI STATO INCASTONATA IN BASSO (STILE MEDAGLIONE) */
        .gem-mount {
            position: absolute;
            bottom: -8px;
            width: 14px;
            height: 14px;
            background: #148c73; /* Gemma Smeraldo */
            transform: rotate(45deg);
            border: 2px solid #fce890;
            box-shadow: 0 0 8px #148c73;
        }

        @keyframes breathing {
            0%, 100% { opacity: 0.95; transform: scale(1); }
            50% { opacity: 0.75; transform: scale(0.98); }
        }
    </style>
</head>
<body>

    <!-- CONTENITORE SVG PER FILTRI MATERICI GLOBALI -->
    <svg style="position: absolute; width: 0; height: 0;">
        <defs>
            <!-- Filtro per la pietra Ossidiana/Ardesia -->
            <filter id="stone-noise" x="0%" y="0%" width="100%" height="100%">
                <feTurbulence type="fractalNoise" baseFrequency="0.45" numOctaves="3" seed="5" result="noise" />
                <feColorMatrix type="matrix" values="0 0 0 0 .01   0 0 0 0 .04   0 0 0 0 .06  0 0 0 .15 0" result="colorNoise"/>
                <feBlend in="SourceGraphic" in2="colorNoise" mode="overlay" />
            </filter>
        </defs>
    </svg>

    <!-- INTERFACCIA MOCKATA -->
    <div class="war-room-table">
        
        <!-- PANNELLO ROSTER RI-PROGETTATO -->
        <div class="layered-panel stone-texture">
            <h2>Giggiolillo <span>Guerriero - Liv. 7</span></h2>
            <div style="margin-top: 10px; color: #8db3a5;">Punti Vitalità (Incisione Ambra)</div>
            <div class="hp-groove">
                <div class="hp-fill-amber"></div>
            </div>
        </div>

        <!-- MOCKUP DEL COERENZA DEI GETTONI (STILE ASTROLABIO/POI) -->
        <div class="layered-panel stone-texture">
            <h2>Gettoni Attitudine <span>Grammatica Visiva Coerente</span></h2>
            <p style="color: #8db3a5; font-style: italic; margin-bottom: 25px;">
                Esempio dei tre stati: Successo (Saturato/Teal), In Corso (Ambra Pulsante), Bloccato (Pietra Fredda/Grigio).
            </p>
            
            <div class="astrolabe-preview">
                <!-- Fase 1: Risolta (Teal/Meraviglia) -->
                <div class="skill-token token-active-teal">
                    <div class="token-icon">STR</div>
                    <div class="gem-mount"></div>
                </div>

                <!-- Fase 2: In Corso (Ambra Solare Meccanica) -->
                <div class="skill-token token-active-amber">
                    <div class="token-icon">DEX</div>
                </div>

                <!-- Fase 3: Bloccata (Pietra/Passato) -->
                <div class="skill-token token-locked">
                    <div class="token-icon">END</div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
