# Mind Weaver — Web multi-AI: ChatGPT + Gemini
# Richiesto dal Director: "usa un piano multi ai cn chatGPT web e gemini web"
models:
  A:
    provider: chatgpt
    transport: web
    model: gpt-4o
    timeout_s: 180
  B:
    provider: gemini-web
    transport: web
    model: web-default
    timeout_s: 180
fallbacks:
  - provider: openrouter
    model: google/gemini-2.5-pro
    api_key_env: OPENROUTER_API_KEY
    timeout_s: 180
