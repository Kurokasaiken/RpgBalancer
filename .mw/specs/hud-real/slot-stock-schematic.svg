<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="640" viewBox="0 0 1760 640" font-family="Georgia, serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d8b96a"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c96a5a"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7fc9a0"/>
    </marker>
    <marker id="arrRot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d8b96a"/>
    </marker>
  </defs>
  <rect width="1760" height="640" fill="#0d1420"/>
  <text x="880" y="42" text-anchor="middle" fill="#e8ddc0" font-size="22" letter-spacing="6">SLOT STOCK — la coreografia certificata</text>

  <!-- ============ STATO 1: APERTO ============ -->
  <g transform="translate(210,320)">
    <!-- ghiera ruotata -30 e ingrandita 1.18 -->
    <g transform="rotate(-30) scale(1.18)">
      <circle r="105" fill="none" stroke="#b98a4f" stroke-width="10"/>
      <circle r="105" fill="none" stroke="#0f5f4a" stroke-width="4" opacity="0.7"/>
      <!-- 3 chele ritratti visibili sulla banda (270,30,150 nel frame ruotato) -->
      <g fill="#6a5230" stroke="#3a2a12" stroke-width="1.5" opacity="0.6">
        <path d="M-6,96 L6,96 L3,110 L-3,110 Z"/>          <!-- 270 (sud) -->
        <path d="M84,-42 L96,-50 L94,-36 L84,-30 Z"/>       <!-- 30 -->
        <path d="M-84,-42 L-96,-50 L-94,-36 L-84,-30 Z"/>   <!-- 150 -->
      </g>
    </g>
    <!-- riferimento verticale per mostrare la rotazione -->
    <line x1="0" y1="-145" x2="0" y2="-128" stroke="#4a5a70" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="10" y="-134" fill="#4a5a70" font-size="11">-30°</text>
    <circle r="80" fill="none" stroke="#4a5a70" stroke-width="2" stroke-dasharray="5 5"/>
    <text y="4" text-anchor="middle" fill="#4a5a70" font-size="13" font-style="italic">sede vuota</text>
    <text y="152" text-anchor="middle" fill="#8a9ab0" font-size="12" font-style="italic">ruotata -30° · scale 1.18 · chele ritratti a vista</text>
    <text y="182" text-anchor="middle" fill="#d8b96a" font-size="15" letter-spacing="3">APERTO</text>
  </g>

  <!-- freccia 1 -->
  <g transform="translate(430,320)">
    <text x="0" y="-56" text-anchor="middle" fill="#d8b96a" font-size="12">il medaglione</text>
    <text x="0" y="-41" text-anchor="middle" fill="#d8b96a" font-size="12">entra al centro</text>
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#d8b96a" stroke-width="2" marker-end="url(#arr)"/>
    <text x="0" y="22" text-anchor="middle" fill="#d8b96a" font-size="11" font-style="italic">la ghiera RUOTA +30°</text>
    <text x="0" y="37" text-anchor="middle" fill="#d8b96a" font-size="11" font-style="italic">e STRINGE (1.18 → 1.0)</text>
    <text x="0" y="52" text-anchor="middle" fill="#c96a5a" font-size="11" font-style="italic">slam 440ms · impatto + rimbalzo</text>
  </g>

  <!-- ============ STATO 2: ROTAZIONE + STRINGE ============ -->
  <g transform="translate(680,320)">
    <circle r="105" fill="none" stroke="#b98a4f" stroke-width="10" stroke-dasharray="6 6" opacity="0.4"/>
    <circle r="100" fill="none" stroke="#b98a4f" stroke-width="10"/>
    <circle r="100" fill="none" stroke="#0f5f4a" stroke-width="4" opacity="0.7"/>
    <circle r="82" fill="#1a2438" stroke="#d8b96a" stroke-width="4"/>
    <text y="4" text-anchor="middle" fill="#8a9ab0" font-size="12" font-style="italic">medaglione</text>
    <!-- arco di rotazione -->
    <path d="M-100,-124 A160,160 0 0 1 -52,-152" fill="none" stroke="#d8b96a" stroke-width="2" marker-end="url(#arrRot)"/>
    <text x="-96" y="-152" fill="#d8b96a" font-size="11">-30° → 0°</text>
    <!-- chele che avanzano -->
    <g stroke="#7fc9a0" stroke-width="3" marker-end="url(#arrGreen)">
      <line x1="0" y1="118" x2="0" y2="102"/>
      <line x1="104" y1="-52" x2="90" y2="-44"/>
      <line x1="-104" y1="-52" x2="-90" y2="-44"/>
    </g>
    <text y="152" text-anchor="middle" fill="#7fc9a0" font-size="12" font-style="italic">ruota + stringe — le chele avanzano</text>
    <text y="182" text-anchor="middle" fill="#d8b96a" font-size="15" letter-spacing="3">CHIUSURA</text>
  </g>

  <!-- freccia 2 -->
  <g transform="translate(920,320)">
    <text x="0" y="-46" text-anchor="middle" fill="#d8b96a" font-size="12">a 200ms (48% slam):</text>
    <text x="0" y="-31" text-anchor="middle" fill="#d8b96a" font-size="12">le chele scattano</text>
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#d8b96a" stroke-width="2" marker-end="url(#arr)"/>
    <text x="0" y="22" text-anchor="middle" fill="#c96a5a" font-size="11" font-style="italic">scatto 70ms — il morso</text>
    <text x="0" y="37" text-anchor="middle" fill="#c96a5a" font-size="11" font-style="italic">atterra SULL'impatto</text>
  </g>

  <!-- ============ STATO 3: CHIUSO ============ -->
  <g transform="translate(1120,320)">
    <circle r="82" fill="#1a2438" stroke="#d8b96a" stroke-width="4"/>
    <text y="30" text-anchor="middle" fill="#8a9ab0" font-size="12" font-style="italic">medaglione</text>
    <circle r="95" fill="none" stroke="#b98a4f" stroke-width="11"/>
    <circle r="95" fill="none" stroke="#0f5f4a" stroke-width="5" opacity="0.8"/>
    <!-- 3 chele sopra, avanzate sul filo (270,30,150) -->
    <g fill="#d8b96a" stroke="#7a5c28" stroke-width="1.5">
      <path d="M-9,80 L9,80 L4,62 L-4,62 Z"/>              <!-- 270 sud -->
      <path d="M75,-48 L88,-58 L80,-38 L66,-32 Z"/>         <!-- 30 -->
      <path d="M-75,-48 L-88,-58 L-80,-38 L-66,-32 Z"/>     <!-- 150 -->
    </g>
    <!-- gemma ore 6 -->
    <path d="M0,110 l7,10 -7,10 -7,-10 z" fill="#1fae86" stroke="#0c6a52" stroke-width="1.5"/>
    <text y="152" text-anchor="middle" fill="#8a9ab0" font-size="12" font-style="italic">3 chele sul filo (6h·2h·10h) — un pezzo unico</text>
    <text y="182" text-anchor="middle" fill="#d8b96a" font-size="15" letter-spacing="3">CHIUSO</text>
  </g>

  <!-- freccia 3 -->
  <g transform="translate(1340,320)">
    <text x="0" y="-46" text-anchor="middle" fill="#d8b96a" font-size="12">estrazione:</text>
    <text x="0" y="-31" text-anchor="middle" fill="#d8b96a" font-size="12">primo 35% = chele</text>
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#d8b96a" stroke-width="2" marker-end="url(#arr)"/>
    <text x="0" y="22" text-anchor="middle" fill="#c96a5a" font-size="11" font-style="italic">rientrano, POI la ghiera</text>
    <text x="0" y="37" text-anchor="middle" fill="#c96a5a" font-size="11" font-style="italic">ruota -30° e si allarga</text>
  </g>

  <!-- ============ STATO 4: RIAPERTURA ============ -->
  <g transform="translate(1560,320)">
    <g transform="rotate(-15) scale(1.09)">
      <circle r="105" fill="none" stroke="#b98a4f" stroke-width="10"/>
      <circle r="105" fill="none" stroke="#0f5f4a" stroke-width="4" opacity="0.7"/>
    </g>
    <circle r="80" fill="#1a2438" stroke="#d8b96a" stroke-width="4" opacity="0.55"/>
    <g stroke="#c96a5a" stroke-width="3" marker-end="url(#arrRed)">
      <line x1="0" y1="96" x2="0" y2="114"/>
      <line x1="86" y1="-48" x2="100" y2="-58"/>
      <line x1="-86" y1="-48" x2="-100" y2="-58"/>
    </g>
    <text y="152" text-anchor="middle" fill="#8a9ab0" font-size="12" font-style="italic">chele rientrano + ghiera si stacca</text>
    <text y="182" text-anchor="middle" fill="#d8b96a" font-size="15" letter-spacing="3">RIAPERTURA</text>
  </g>

  <!-- footer -->
  <text x="880" y="600" text-anchor="middle" fill="#5a6a80" font-size="12" font-style="italic">tempi congelati: slam 440ms cubic-bezier(0.42,0,0.2,1) · scatto chele 70ms @200ms · retrazione nel primo 35% dell'estrazione</text>
</svg>
