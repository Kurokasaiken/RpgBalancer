# Mind Weaver — Astrolabe V6.3 materiality exploration profile
# Uses authenticated web sessions for ChatGPT and Claude.

models:
  caller:
    provider: chatgpt
    model: gpt-4o
    transport: web
    max_tokens: 4096
    timeout_s: 120

  A:
    provider: chatgpt
    model: gpt-4o
    transport: web
    max_tokens: 4096
    timeout_s: 120

  B:
    provider: claude
    model: claude-sonnet-4-20250514
    transport: web
    max_tokens: 4096
    timeout_s: 120

fallbacks:
  - provider: openrouter
    model: openai/gpt-4o
    max_tokens: 4096
    timeout_s: 120
