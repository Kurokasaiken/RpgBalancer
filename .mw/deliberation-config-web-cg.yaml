# Mind Weaver — Web multi-AI: Claude + Gemini (chatgpt session scaduta 2026-09-08)
models:
  A:
    provider: claude
    transport: web
    model: claude-sonnet-4-20250514
    timeout_s: 180
  B:
    provider: gemini-web
    transport: web
    model: web-default
    timeout_s: 180
fallbacks:
  - provider: openrouter
    model: google/gemini-2.5-pro
    api_key_env: OPENROUTER_API_KEY
    timeout_s: 120
