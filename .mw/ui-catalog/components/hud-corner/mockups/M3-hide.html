    <div style="width:46px;height:46px;border-radius:50%;background:linear-gradient(180deg,#0f2a35,#09202a);border:1.5px solid #c2a355;display:flex;align-items:center;justify-content:center"><span style="color:#cfaf63;font-size:16px">◉</span></div>
  </div>
</div>
<div style="width:2px;background:#0c1b24"></div>
<div style="flex:1;background:linear-gradient(180deg,#3d8a9b,#2f7d8f);position:relative">
  <span style="position:absolute;top:14px;left:16px;color:#d8bd78;font-size:10px;letter-spacing:2px;opacity:.8">CHROME HIDDEN — the way back is labeled</span>
