<!doctype html><html><body style="margin:0;background:#16323c;font-family:Cinzel,serif;display:flex;justify-content:center;align-items:flex-end;min-height:100vh;padding:0 0 30px">
<div style="zoom:2.2">

<!-- plinth of recessed panels ("battenti"): each slot is an inset carved door -->
<div style="background:linear-gradient(180deg,#0f2a35,#09202a);border:1.5px solid #8a6a2f;border-top:3px solid #c2a355;border-radius:18px 18px 4px 4px;padding:10px 14px 11px;display:flex;align-items:stretch;gap:8px;box-shadow:0 6px 16px rgba(0,0,0,.55)">

  <!-- VILLAGE: open door, dim interior -->
  <div style="width:86px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;background:linear-gradient(180deg,#061419,#0a222c);border:1px solid #3d2f14;border-radius:6px;box-shadow:inset 0 2px 6px rgba(0,0,0,.7),inset 0 -1px 0 rgba(207,175,99,.15)">
    <span style="color:#a98d4e;font-size:18px;line-height:1">⌂</span>
    <span style="color:#a98d4e;font-size:9.5px;letter-spacing:2px">VILLAGE</span>
  </div>

  <!-- MAP active: raised brass cartouche breaking the inset -->
  <div style="width:86px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;background:linear-gradient(180deg,#1a3d4d,#0f2a35);border:1.5px solid #cfaf63;border-bottom:2.5px solid #f0cf6a;border-radius:6px;box-shadow:0 -2px 8px rgba(207,175,99,.25),inset 0 1px 0 rgba(255,255,255,.15)">
    <span style="color:#f0cf6a;font-size:18px;line-height:1;filter:drop-shadow(0 0 5px rgba(255,214,120,.5))">◈</span>
    <span style="color:#f0cf6a;font-size:9.5px;letter-spacing:2px">MAP</span>
  </div>

  <!-- compass kept in-bar but inset brass rose: clearly another family -->
  <div style="align-self:center;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 32%,#0f2a35,#050e14);border:1.5px solid #8a6a2f;box-shadow:inset 0 2px 5px rgba(0,0,0,.8),0 1px 0 rgba(207,175,99,.2);display:grid;place-items:center;cursor:pointer">
    <span style="color:#c2a355;font-size:19px">◎</span>
  </div>

  <!-- WORKSHOP sealed: wax/brass seal centered + requirement strip -->
  <div style="position:relative;width:86px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;background:linear-gradient(180deg,#061419,#0a222c);border:1px solid #3d2f14;border-radius:6px;box-shadow:inset 0 2px 6px rgba(0,0,0,.7)">
    <span style="color:#46575e;font-size:18px;line-height:1;opacity:.55">⚒</span>
    <span style="color:#46575e;font-size:9.5px;letter-spacing:2px;opacity:.7">WORKSHOP</span>
    <span style="font-size:7px;color:#8a6a2f;letter-spacing:1px">REQ · LV.2</span>
    <span style="position:absolute;top:14px;left:50%;transform:translateX(-50%);width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#cfaf63 0%,#8a6a2f 60%,#5f3f16);box-shadow:0 1px 4px rgba(0,0,0,.7),inset 0 1px 1px rgba(255,240,200,.4);display:grid;place-items:center"><span style="color:#2a1c08;font-size:9px">⚿</span></span>
  </div>

  <!-- TAVERN sealed -->
  <div style="position:relative;width:86px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;background:linear-gradient(180deg,#061419,#0a222c);border:1px solid #3d2f14;border-radius:6px;box-shadow:inset 0 2px 6px rgba(0,0,0,.7)">
    <span style="color:#46575e;font-size:18px;line-height:1;opacity:.55">♨</span>
    <span style="color:#46575e;font-size:9.5px;letter-spacing:2px;opacity:.7">TAVERN</span>
    <span style="font-size:7px;color:#8a6a2f;letter-spacing:1px">REQ · DAY 5</span>
    <span style="position:absolute;top:14px;left:50%;transform:translateX(-50%);width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#cfaf63 0%,#8a6a2f 60%,#5f3f16);box-shadow:0 1px 4px rgba(0,0,0,.7),inset 0 1px 1px rgba(255,240,200,.4);display:grid;place-items:center"><span style="color:#2a1c08;font-size:9px">⚿</span></span>
  </div>
</div>
</div></body></html>
