<!doctype html><html><body style="margin:0;background:#16323c;font-family:Cinzel,serif;display:flex;justify-content:center;align-items:flex-end;min-height:100vh;padding:0 0 30px">
<div style="zoom:2.2;display:flex;align-items:flex-end">

<!-- compass as the LEFT rail-cap medallion: same rail, terminal cap -->
<div style="width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#cfaf63,#8a6a2f 70%,#5f3f16);border:1.5px solid #5f3f16;box-shadow:0 5px 12px rgba(0,0,0,.55),inset 0 1px 2px rgba(255,240,200,.5);display:grid;place-items:center;margin-right:-10px;z-index:2;cursor:pointer">
  <span style="color:#1c1206;font-size:20px">◎</span>
</div>

<!-- one continuous brass rail: inlays, engraved tick dividers, no boxes -->
<div style="background:linear-gradient(180deg,#c2a355,#8a6a2f 55%,#5f3f16);border:1.5px solid #5f3f16;border-top:2.5px solid #e8d6ae;border-radius:14px 14px 5px 5px;padding:3px;box-shadow:0 6px 16px rgba(0,0,0,.55)">
<div style="background:linear-gradient(180deg,#0f2a35,#09202a);border-radius:11px 11px 3px 3px;padding:6px 18px 7px;display:flex;align-items:center">

  <div style="padding:0 16px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer">
    <span style="color:#cfaf63;font-size:18px;line-height:1">⌂</span>
    <span style="color:#c2a355;font-size:9.5px;letter-spacing:2.5px">VILLAGE</span>
    <span style="font-size:7px;color:#8a6a2f;letter-spacing:1px">· 1 ·</span>
  </div>

  <span style="color:#5f3f16;font-size:16px;align-self:center">|</span>

  <!-- MAP active: raised gold cartouche overlapping the rail's top edge -->
  <div style="position:relative;padding:0 16px;display:flex;flex-direction:column;align-items:center;gap:2px">
    <div style="position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#e8d6ae,#cfaf63);border:1px solid #5f3f16;border-radius:3px;padding:1px 10px;box-shadow:0 2px 5px rgba(0,0,0,.5)"><span style="color:#2a1c08;font-size:8.5px;letter-spacing:2px;font-weight:700">MAP</span></div>
    <span style="color:#f0cf6a;font-size:18px;line-height:1;margin-top:4px;filter:drop-shadow(0 0 5px rgba(255,214,120,.5))">◈</span>
    <span style="font-size:7px;color:#cfaf63;letter-spacing:1px">· 2 ·</span>
  </div>

  <span style="color:#5f3f16;font-size:16px;align-self:center">|</span>

  <!-- locked: keyhole etched + requirement engraved on the rail face -->
  <div style="padding:0 16px;display:flex;flex-direction:column;align-items:center;gap:2px">
    <span style="position:relative;color:#46575e;font-size:18px;line-height:1;opacity:.55">⚒</span>
    <span style="color:#46575e;font-size:9.5px;letter-spacing:2.5px;opacity:.7">WORKSHOP</span>
    <span style="font-size:7px;color:#8a6a2f;letter-spacing:1px">⚿ LV.2</span>
  </div>

  <span style="color:#5f3f16;font-size:16px;align-self:center">|</span>

  <div style="padding:0 16px;display:flex;flex-direction:column;align-items:center;gap:2px">
    <span style="color:#46575e;font-size:18px;line-height:1;opacity:.55">♨</span>
    <span style="color:#46575e;font-size:9.5px;letter-spacing:2.5px;opacity:.7">TAVERN</span>
    <span style="font-size:7px;color:#8a6a2f;letter-spacing:1px">⚿ DAY 5</span>
  </div>
</div>
</div>
</div></body></html>
