<!doctype html><html><body style="margin:0;background:#16323c;font-family:Cinzel,serif;display:flex;justify-content:center;align-items:flex-end;min-height:100vh;padding:0 0 30px">
<div style="zoom:2.2;display:flex;align-items:flex-end;gap:26px">

<!-- plinth: 4 equal slots, engraved dividers, no compass inside -->
<div style="background:linear-gradient(180deg,#0f2a35,#09202a);border:1.5px solid #8a6a2f;border-top:3px solid #c2a355;border-radius:18px 18px 4px 4px;padding:8px 10px 9px;display:flex;box-shadow:0 6px 16px rgba(0,0,0,.55)">

  <!-- VILLAGE inactive + badge -->
  <div style="position:relative;width:104px;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer">
    <span style="position:absolute;top:3px;left:7px;font-size:8px;color:#8a6a2f;letter-spacing:1px">1</span>
    <span style="position:absolute;top:2px;right:8px;min-width:14px;height:14px;border-radius:7px;background:#b4502e;color:#e8d6ae;font-size:9px;line-height:14px;text-align:center;border:1px solid #cfaf63">2</span>
    <span style="color:#cfaf63;font-size:19px;line-height:1">⌂</span>
    <span style="color:#c2a355;font-size:10px;letter-spacing:2.5px">VILLAGE</span>
  </div>

  <div style="width:1px;background:linear-gradient(180deg,transparent,#5f3f16 30%,#5f3f16 70%,transparent);margin:4px 0"></div>

  <!-- MAP active: 3 channels — raised wash + gold seat line + bright label -->
  <div style="position:relative;width:104px;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;background:radial-gradient(120% 90% at 50% 100%,rgba(255,214,120,.20),transparent 70%),linear-gradient(180deg,#123140,#0a222c);box-shadow:inset 0 -3px 0 #cfaf63,inset 0 1px 0 rgba(255,255,255,.10);border-radius:6px">
    <span style="position:absolute;top:3px;left:7px;font-size:8px;color:#cfaf63;letter-spacing:1px">2</span>
    <span style="color:#f0cf6a;font-size:19px;line-height:1;filter:drop-shadow(0 0 5px rgba(255,214,120,.5))">◈</span>
    <span style="color:#f0cf6a;font-size:10px;letter-spacing:2.5px;text-shadow:0 0 8px rgba(255,214,120,.45)">MAP</span>
  </div>

  <div style="width:1px;background:linear-gradient(180deg,transparent,#5f3f16 30%,#5f3f16 70%,transparent);margin:4px 0"></div>

  <!-- WORKSHOP locked: seal + requirement cartouche -->
  <div style="position:relative;width:104px;padding:7px 0 3px;display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.85">
    <span style="position:absolute;top:3px;left:7px;font-size:8px;color:#5f3f16;letter-spacing:1px">3</span>
    <span style="position:relative;color:#5d7279;font-size:19px;line-height:1">⚒<span style="position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#cfaf63,#8a6a2f);border:1px solid #5f3f16;box-shadow:0 1px 3px rgba(0,0,0,.6)"></span></span>
    <span style="color:#5d7279;font-size:10px;letter-spacing:2.5px">WORKSHOP</span>
    <span style="font-size:7.5px;color:#a0762f;letter-spacing:1px;border-top:1px solid #5f3f16;padding-top:2px">VILLAGE LV.2</span>
  </div>

  <div style="width:1px;background:linear-gradient(180deg,transparent,#5f3f16 30%,#5f3f16 70%,transparent);margin:4px 0"></div>

  <!-- TAVERN locked -->
  <div style="position:relative;width:104px;padding:7px 0 3px;display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.85">
    <span style="position:absolute;top:3px;left:7px;font-size:8px;color:#5f3f16;letter-spacing:1px">4</span>
    <span style="position:relative;color:#5d7279;font-size:19px;line-height:1">♨<span style="position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#cfaf63,#8a6a2f);border:1px solid #5f3f16;box-shadow:0 1px 3px rgba(0,0,0,.6)"></span></span>
    <span style="color:#5d7279;font-size:10px;letter-spacing:2.5px">TAVERN</span>
    <span style="font-size:7.5px;color:#a0762f;letter-spacing:1px;border-top:1px solid #5f3f16;padding-top:2px">DAY 5 · INN</span>
  </div>
</div>

<!-- compass extracted: own detached medallion, same lacquer+brass family -->
<div style="width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#123140,#09202a);border:2px solid #c2a355;box-shadow:0 6px 14px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);display:grid;place-items:center;cursor:pointer">
  <span style="color:#cfaf63;font-size:22px;filter:drop-shadow(0 0 4px rgba(207,175,99,.4))">◎</span>
</div>

</div></body></html>
