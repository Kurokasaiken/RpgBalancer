<!doctype html><html><body style="margin:0;background:#16323c;font-family:Cinzel,serif">
<div style="zoom:2.0;width:660px;margin:0 auto;padding:20px 30px;display:flex;justify-content:space-between;align-items:flex-start;gap:18px">
<!-- TIME tab: placca invariata + regolo senza guida -->
<div style="background:linear-gradient(180deg,#0f2a35,#09202a);border:1.5px solid #a0762f;border-bottom:3px solid #c2a355;border-radius:4px 4px 18px 18px;padding:10px 22px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 14px rgba(0,0,0,.5);min-width:195px;flex:1">
<span style="color:#d8bd78;font-size:16px">◉</span><span style="color:#7d9aa5;font-size:10px;letter-spacing:3px">DAY</span><b style="color:#e8d6ae;font-size:22px">2</b>
<span style="display:flex;align-items:flex-end;gap:0;margin-left:8px;position:relative">
<span style="color:#8a9aa2;font-size:11px;padding:4px 9px">⏸</span>
<span style="color:#e8d6ae;font-size:11px;padding:4px 9px;border-bottom:2px solid #cfaf63;position:relative">×1<span style="position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:#0f2a35;border:1.5px solid #cfaf63"></span></span>
<span style="color:#6d7f86;font-size:11px;padding:4px 9px">×2</span>
<span style="color:#6d7f86;font-size:11px;padding:4px 9px">×4</span></span></div>
<!-- EVENT tab: terzo tab centrale, sempre presente -->
<div style="background:linear-gradient(180deg,#0f2a35,#09202a);border:1.5px solid #a0762f;border-bottom:3px solid #c2a355;border-radius:4px 4px 18px 18px;padding:10px 22px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.5);min-width:170px;flex:1;justify-content:center">
<span style="color:#5f6f76;font-size:14px">◈</span><span style="color:#5d7279;font-size:10px;letter-spacing:2px">NESSUN EVENTO</span></div>
<!-- RESOURCES tab: stessa dimensione del tab tempo -->
<div style="background:linear-gradient(180deg,#0f2a35,#09202a);border:1.5px solid #a0762f;border-bottom:3px solid #c2a355;border-radius:4px 4px 18px 18px;padding:10px 22px;display:flex;gap:16px;box-shadow:0 4px 14px rgba(0,0,0,.5);min-width:195px;flex:1;justify-content:center">
<div style="text-align:center"><div style="color:#cfaf63;font-size:15px">◉ 15</div><div style="color:#7d9aa5;font-size:9px;letter-spacing:2px">GOLD</div></div>
<div style="text-align:center"><div style="color:#f0d8a0;font-size:15px;font-weight:700">✦ 8<span style="color:#7d9aa5;font-size:11px">/20</span></div><div style="color:#7d9aa5;font-size:9px;letter-spacing:2px">FOOD</div></div>
<div style="text-align:center"><div style="color:#a8b4ba;font-size:15px">▤ 0</div><div style="color:#5d7279;font-size:9px;letter-spacing:2px">WOOD</div></div></div>
</div></body></html>
