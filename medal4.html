<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Wanderlust — Medal v3</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
body{font-family:'Cinzel',serif;background:#080604;}

#bg-l,#bg-r{position:fixed;top:0;bottom:0;z-index:0;width:50%;overflow:hidden;}
#bg-l{left:0;}#bg-r{right:0;}
#bg-l img,#bg-r img{width:200%;height:100%;object-fit:cover;
  filter:saturate(.70) brightness(.72) sepia(.05);}
#bg-l img{object-position:left center;}
#bg-r img{object-position:right center;margin-left:-100%;}
#vign{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 82% 78% at 50% 50%,
    transparent 20%,rgba(4,3,2,.54) 64%,rgba(0,0,0,.97) 100%);
  animation:vig 12s ease-in-out infinite;}
@keyframes vig{0%,100%{opacity:1}50%{opacity:.86}}
#divider{position:fixed;left:50%;top:8%;bottom:8%;width:1px;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(192,120,40,.40) 25%,
    rgba(192,120,40,.58) 50%,rgba(192,120,40,.40) 75%,transparent);}
.dlbl{position:fixed;bottom:22px;z-index:5;font-size:5.5px;letter-spacing:.32em;
  text-transform:uppercase;color:rgba(192,120,40,.42);pointer-events:none;}
#dll{left:50%;transform:translateX(calc(-100% - 16px));}
#dlr{left:50%;transform:translateX(16px);}

/* ── STAGE ── */
#stage{position:fixed;inset:0;z-index:10;
  display:flex;align-items:center;justify-content:center;gap:80px;}

/* ── WRAPPER ── */
.tok-wrap{
  position:relative;cursor:grab;
  display:flex;flex-direction:column;align-items:center;
  will-change:transform;
  animation:idle var(--idur,5s) var(--idel,0s) ease-in-out infinite;
  transition:transform 260ms cubic-bezier(.22,1,.36,1);
}
@keyframes idle{
  0%,100%{transform:translateY(0) rotate(var(--irot,.28deg))}
  50%{transform:translateY(-2.5px) rotate(calc(var(--irot,.28deg)*-.4))}
}
.tok-wrap.lifted{cursor:grabbing;animation:none;transition:transform 0ms;}
.tok-wrap.landing{cursor:grab;animation:land .40s cubic-bezier(.22,1,.36,1) forwards;}
@keyframes land{
  0%  {transform:scale(1.06) translateY(-7px)}
  55% {transform:scale(.974) translateY(1.8px)}
  100%{transform:scale(1)   translateY(0)}
}
.tok-wrap.snapback{cursor:grab;animation:none;
  transition:transform .55s cubic-bezier(.34,1.4,.64,1);}

/* Shadow — separate dark ellipse, NO drop-shadow CSS on SVG */
.tok-shadow{
  position:absolute;bottom:-10px;left:50%;
  transform:translateX(-46%);
  width:72px;height:14px;border-radius:50%;
  background:radial-gradient(ellipse at 46% 50%,rgba(0,0,0,.88) 0%,rgba(0,0,0,0) 72%);
  filter:blur(8px);opacity:.72;pointer-events:none;z-index:-1;
  transition:width .26s,height .26s,bottom .26s,opacity .26s,filter .26s;
}

/* SVG wrapper — clip to circle so NO square artifacts */
.tok-svg{
  position:relative;
  width:86px;height:86px;
  border-radius:50%;
  overflow:visible;        /* gem can sit just below edge */
  perspective:400px;
  transform-style:preserve-3d;
}
.tok-svg svg{
  display:block;
  transition:transform .14s cubic-bezier(.2,0,.4,1);
  overflow:visible;
}

/* Rim sweep — slow, subtle, no flicker */
.rim-sweep{
  position:absolute;inset:0;border-radius:50%;
  pointer-events:none;opacity:0;
  mix-blend-mode:screen;
  /* transition smooths the angle change */
  transition:opacity .18s, --sweep-pos .32s;
}
.tok-wrap.lifted .rim-sweep{opacity:1;}

.tok-lbl{margin-top:28px;font-size:6.5px;letter-spacing:.32em;text-transform:uppercase;
  color:rgba(210,160,58,.52);white-space:nowrap;}

/* Drop zones */
.drop-zone{position:fixed;z-index:8;border-radius:4px;
  border:1px dashed rgba(192,120,40,.20);
  display:flex;align-items:center;justify-content:center;
  font-size:6px;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(192,120,40,.28);transition:border-color .18s,background .18s;}
.drop-zone.hover{border-color:rgba(192,120,40,.55);background:rgba(192,120,40,.06);}
#dz1{top:18%;left:6%;width:80px;height:80px;}
#dz2{top:18%;right:6%;width:80px;height:80px;}

#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:20;
  font-size:5.5px;letter-spacing:.26em;text-transform:uppercase;
  color:rgba(192,120,40,.35);pointer-events:none;white-space:nowrap;}
</style>
</head>

  </linearGradient>
  <!-- Right upper face -->
  <linearGradient id="g-gm-ru" x1="100%" y1="20%" x2="0%" y2="80%">
    <stop offset="0%"    stop-color="#88ee98"/>
    <stop offset="100%"  stop-color="#1a6828"/>
  </linearGradient>
  <!-- Left lower face — darker, shadow side -->
  <linearGradient id="g-gm-ll" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"    stop-color="#1a6828"/>
    <stop offset="100%"  stop-color="#083c14"/>
  </linearGradient>
  <!-- Right lower face — medium -->
  <linearGradient id="g-gm-rl" x1="100%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"    stop-color="#2a8838"/>
    <stop offset="100%"  stop-color="#0a4818"/>
  </linearGradient>
  <!-- Bottom culet — darkest -->
  <linearGradient id="g-gm-bot" x1="30%" y1="0%" x2="70%" y2="100%">
    <stop offset="0%"    stop-color="#0e5020"/>
    <stop offset="100%"  stop-color="#042810"/>
  </linearGradient>
  <!-- Gem internal caustic -->
  <radialGradient id="g-gm-caus" cx="68%" cy="72%" r="44%">
    <stop offset="0%"    stop-color="rgba(140,255,160,.32)"/>
    <stop offset="100%"  stop-color="rgba(80,220,100,0)"/>
  </radialGradient>
  <!-- Gem top specular flash -->
  <radialGradient id="g-gm-flash" cx="32%" cy="22%" r="28%">
    <stop offset="0%"    stop-color="rgba(255,255,255,.90)"/>
    <stop offset="50%"   stop-color="rgba(255,255,255,.28)"/>
    <stop offset="100%"  stop-color="rgba(255,255,255,0)"/>
  </radialGradient>
  <!-- Gem glow outer -->
  <radialGradient id="g-gm-glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%"    stop-color="rgba(58,215,80,.35)"/>
    <stop offset="100%"  stop-color="rgba(38,180,60,0)"/>
  </radialGradient>
  <!-- Gem AO around setting -->
  <radialGradient id="g-gm-ao" cx="50%" cy="50%" r="50%">
    <stop offset="55%"   stop-color="rgba(0,0,0,0)"/>
    <stop offset="80%"   stop-color="rgba(0,0,0,.50)"/>
    <stop offset="100%"  stop-color="rgba(0,0,0,.85)"/>
  </radialGradient>

  <!-- FILTERS — bounded to avoid artifacts -->
  <filter id="f-nm" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.52" numOctaves="4"
                  seed="3" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="matrix"
      values="0 0 0 0 .068  0 0 0 0 .046  0 0 0 0 .021  0 0 0 .25 0" result="c"/>
    <feBlend in="SourceGraphic" in2="c" mode="overlay"/>
  </filter>
  <filter id="f-fs" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.90" numOctaves="5"
                  seed="11" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="matrix"
      values="0 0 0 0 .038  0 0 0 0 .026  0 0 0 0 .014  0 0 0 .18 0" result="c"/>
    <feBlend in="SourceGraphic" in2="c" mode="overlay"/>
  </filter>
  <filter id="f-dp" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="turbulence" baseFrequency="0.030" numOctaves="3"
                  seed="7" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t"
                       scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="f-gl" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="1.5" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <filter id="f-glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>

  <clipPath id="c-port">
    <circle cx="43" cy="43" r="27.5"/>
  </clipPath>

  <!-- Full medallion clip — applied to entire SVG group -->
  <clipPath id="c-medal">
    <circle cx="43" cy="43" r="42"/>
  </clipPath>

</defs>

    <circle cx="0" cy="0" r="5.8" fill="none" stroke="rgba(255,218,110,.18)" stroke-width=".6"/>

    <!-- Gem bed -->
    <ellipse cx="0" cy="0" rx="5.2" ry="6.6" fill="#060402"/>
    <ellipse cx="0" cy="0" rx="5.2" ry="6.6" fill="url(#g2-ao)"/>

    <!-- Facets marquise -->
    <polygon points="0,-6.5 -4.2,0 0,6.5"   fill="url(#g2-ll)" opacity=".88"/>
    <polygon points="0,-6.5  4.2,0 0,6.5"   fill="url(#g2-rl)" opacity=".88"/>
    <polygon points="-2.2,3.5 2.2,3.5 0,6.5" fill="url(#g2-bot)" opacity=".95"/>
    <polygon points="0,-6.5 -2.8,-2.8 0,-1.4 2.8,-2.8" fill="url(#g2-top)" opacity=".95"/>
    <polygon points="0,-6.5 -4.2,0 -2.8,-2.8" fill="url(#g2-lu)" opacity=".90"/>
    <polygon points="0,-6.5  4.2,0  2.8,-2.8" fill="url(#g2-ru)" opacity=".90"/>
    <polygon points="-2.8,-2.8 0,-1.4 2.8,-2.8 4.2,0 0,2.2 -4.2,0" fill="url(#g2-top)" opacity=".85"/>

    <!-- Facet lines -->
    <line x1="0" y1="-6.5" x2="-4.2" y2="0"   stroke="rgba(255,255,255,.28)" stroke-width=".4"/>
    <line x1="0" y1="-6.5" x2="4.2"  y2="0"   stroke="rgba(255,255,255,.22)" stroke-width=".4"/>
    <line x1="0" y1="-6.5" x2="0"    y2="-1.4" stroke="rgba(255,255,255,.35)" stroke-width=".4"/>
    <line x1="-2.8" y1="-2.8" x2="2.8" y2="-2.8" stroke="rgba(255,255,255,.18)" stroke-width=".35"/>
    <line x1="-4.2" y1="0"    x2="4.2" y2="0"    stroke="rgba(255,255,255,.14)" stroke-width=".35"/>
    <line x1="0"    y1="2.2"  x2="-4.2" y2="0"   stroke="rgba(0,0,0,.20)" stroke-width=".35"/>
    <line x1="0"    y1="2.2"  x2="4.2"  y2="0"   stroke="rgba(0,0,0,.16)" stroke-width=".35"/>
    <line x1="0"    y1="2.2"  x2="0"    y2="6.5"  stroke="rgba(0,0,0,.24)" stroke-width=".35"/>

    <ellipse cx="0" cy="0" rx="5.2" ry="6.6" fill="url(#g2-caus)"/>
    <ellipse cx="0" cy="0" rx="5.2" ry="6.6" fill="url(#g2-flash)"/>
    <ellipse cx="0" cy="0" rx="5.2" ry="6.6" fill="rgba(50,210,75,.0)">
      <animate attributeName="rx" values="6.5;9;6.5"   dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="8.5;12;8.5"  dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.055;0;0.055" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="rgba(50,210,75,1);rgba(50,210,75,1);rgba(50,210,75,1)" dur="3.2s" repeatCount="indefinite"/>
    </ellipse>
    </svg>
    </div><!-- /gem -->

  </div><!-- /tok-svg -->


  <div class="tok-lbl">Medaglione</div>
</div>

</div><!-- /stage -->
<div id="hint">Trascina sui quadrati · drop errato = rimbalzo</div>

<script>
// ══ AUDIO ══════════════════════════════════════════════
const AC=new (window.AudioContext||window.webkitAudioContext)();
let ar=false;
function ensureAC(){if(!ar){AC.resume();ar=true;}}
function mkNoise(dur,exp=2.2){
  const b=AC.createBuffer(1,Math.floor(AC.sampleRate*dur),AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,exp);
  return b;
}
function playPickup(){
  ensureAC();const t=AC.currentTime;
  const src=AC.createBufferSource();src.buffer=mkNoise(.07,1.8);
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1500;bp.Q.value=2.2;
  const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+.07);
  src.connect(bp);bp.connect(g);g.connect(AC.destination);src.start(t);
}
function playDrop(){
  ensureAC();const t=AC.currentTime;
  const o=AC.createOscillator();o.type='sine';const g=AC.createGain();
  o.frequency.setValueAtTime(100,t);o.frequency.exponentialRampToValueAtTime(44,t+.26);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.36,t+.007);g.gain.exponentialRampToValueAtTime(.001,t+.32);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.34);
  const src=AC.createBufferSource();src.buffer=mkNoise(.055,3);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=500;
  const g2=AC.createGain();g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(.22,t+.005);g2.gain.exponentialRampToValueAtTime(.001,t+.058);
  src.connect(lp);lp.connect(g2);g2.connect(AC.destination);src.start(t);
}
function playReject(){
  ensureAC();const t=AC.currentTime;
  const o=AC.createOscillator();o.type='sine';const g=AC.createGain();
  o.frequency.setValueAtTime(320,t);o.frequency.exponentialRampToValueAtTime(180,t+.12);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.006);g.gain.exponentialRampToValueAtTime(.001,t+.15);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.18);
}

// ══ RIM SWEEP — canvas, slow & subtle ════════════════
const rimCanvas=document.getElementById('rim-canvas');
const rimCtx=rimCanvas.getContext('2d');
let rimAngleTarget=0, rimAngleCurrent=0, rimVisible=false;

function drawRim(angleDeg,opacity){
  rimCtx.clearRect(0,0,86,86);
  if(opacity<.005) return;
  const cx=43,cy=43,r=40;
  const a0=(angleDeg-22)*Math.PI/180;
  const a1=(angleDeg+22)*Math.PI/180;
  const grad=rimCtx.createConicalGradient?null:null;
  // Fallback: arc stroke
  rimCtx.beginPath();
  rimCtx.arc(cx,cy,r,a0,a1);
  rimCtx.strokeStyle=`rgba(255,248,180,${opacity*0.28})`;
  rimCtx.lineWidth=3.5;
  rimCtx.lineCap='round';
  rimCtx.stroke();
  rimCtx.beginPath();
  rimCtx.arc(cx,cy,r,a0+(a1-a0)*.35,a1-(a1-a0)*.35);
  rimCtx.strokeStyle=`rgba(255,252,200,${opacity*0.55})`;
  rimCtx.lineWidth=1;
  rimCtx.stroke();
}

let rimRAF=null;
function animRim(){
  // Lerp angle — prevents flicker
  const diff=rimAngleTarget-rimAngleCurrent;
  let delta=diff;
  // shortest path on circle
  if(delta>180) delta-=360;
  if(delta<-180) delta+=360;
  rimAngleCurrent+=delta*.08; // slow lerp
  const op=rimVisible?1:0;
  const currentOp=parseFloat(rimCanvas.style.opacity||0);
  const newOp=currentOp+(op-currentOp)*.08;
  rimCanvas.style.opacity=newOp;
  drawRim(rimAngleCurrent,newOp);
  rimRAF=requestAnimationFrame(animRim);
}
animRim();

// ══ SHADOW helpers ════════════════════════════════════
function shRest(sh){
  sh.style.width='72px';sh.style.height='14px';
  sh.style.bottom='-10px';sh.style.filter='blur(8px)';sh.style.opacity='.72';
}
function shLifted(sh,progress){
  const bl=8+progress*22, sc=1-progress*.22, off=10+progress*28, op=.72-progress*.28;
  sh.style.width=(72*(1+progress*.16))+'px';
  sh.style.height=(14*sc)+'px';
  sh.style.bottom=-off+'px';
  sh.style.opacity=op;
  sh.style.filter=`blur(${bl}px)`;
}

// ══ DROP ZONES ════════════════════════════════════════
const zones=document.querySelectorAll('.drop-zone');
function getZone(x,y){
  for(const z of zones){const r=z.getBoundingClientRect();if(x>r.left&&x<r.right&&y>r.top&&y<r.bottom)return z;}return null;
}

// ══ DRAG ══════════════════════════════════════════════
document.querySelectorAll('.tok-wrap').forEach(wrap=>{
  const sh=wrap.querySelector('.tok-shadow');
  const innerClip = wrap.querySelector('.tok-svg > div');
  const svg = wrap.querySelector('.tok-svg svg');
  const w=wrap.offsetWidth, h=wrap.offsetHeight;
  shRest(sh);
  let drag=false,startMX=0,startMY=0,originL=0,originT=0;
  let prevMX=0,prevMY=0,velX=0,velY=0;

  function initPos(){
    const r=wrap.getBoundingClientRect();
    wrap.style.position='fixed';
    wrap.style.left=r.left+'px';
    wrap.style.top=r.top+'px';
    wrap.style.transform='translate(0,0)';
  }

  // Init position immediately — so tilt/rim work from first drag
  requestAnimationFrame(()=>{ if(!wrap.style.left) initPos(); });

  wrap.addEventListener('mousedown',e=>{
    ensureAC();
    if(!wrap.style.left) initPos();
    drag=true;
    wrap.classList.remove('landing','snapback');
    wrap.classList.add('lifted');
    originL=parseFloat(wrap.style.left)||0;
    originT=parseFloat(wrap.style.top)||0;
    startMX=e.clientX;startMY=e.clientY;
    prevMX=e.clientX;prevMY=e.clientY;
    velX=0;velY=0;
    rimVisible=true;
    document.querySelectorAll('.tok-wrap').forEach(t=>t.style.zIndex='40');
    wrap.style.zIndex='60';
    playPickup();
    shLifted(sh,.5);
    e.preventDefault();
  });

  document.addEventListener('mousemove',e=>{
    if(!drag) return;
    velX=e.clientX-prevMX;velY=e.clientY-prevMY;
    prevMX=e.clientX;prevMY=e.clientY;
    const dx=e.clientX-startMX,dy=e.clientY-startMY;
    const nx=Math.max(0,Math.min(window.innerWidth-w,originL+dx));
    const ny=Math.max(0,Math.min(window.innerHeight-h,originT+dy));
    wrap.style.transform=`translate(${nx-originL}px,${ny-originT}px) scale(1.06) rotate(2deg)`;
    // 3D tilt — on the inner clip div
    const tx=Math.max(-16,Math.min(16,velY*-1.3));
    const ty=Math.max(-16,Math.min(16,velX*1.3));
    if(innerClip) innerClip.style.transform=`perspective(360px) rotateX(${tx}deg) rotateY(${ty}deg)`;
    svg.style.transform='';
    // Rim angle — smooth via lerp in animRim
    if(Math.abs(velX)+Math.abs(velY)>0.5){
      rimAngleTarget=(Math.atan2(velY,velX)*180/Math.PI+360)%360;
    }
    // Shadow
    const lp=Math.min(1,Math.sqrt(dx*dx+dy*dy)/110);
    shLifted(sh,lp);
    // Zones
    zones.forEach(z=>z.classList.remove('hover'));
    const hz=getZone(e.clientX,e.clientY);
    if(hz) hz.classList.add('hover');
  });

  document.addEventListener('mouseup',e=>{
    if(!drag) return;
    drag=false;
    svg.style.transform='';
    if(innerClip) innerClip.style.transform='';
    rimVisible=false;
    zones.forEach(z=>z.classList.remove('hover'));
    wrap.classList.remove('lifted');
    const hz=getZone(e.clientX,e.clientY);
    if(hz){
      const zr=hz.getBoundingClientRect();
      wrap.style.left=(zr.left+zr.width/2-w/2)+'px';
      wrap.style.top=(zr.top+zr.height/2-h/2)+'px';
      wrap.style.transform='translate(0,0)';
      wrap.classList.add('landing');
      playDrop();
    } else {
      const r=wrap.getBoundingClientRect();
      wrap.style.left=r.left+'px';wrap.style.top=r.top+'px';
      wrap.style.transform='translate(0,0)';
      wrap.classList.add('snapback');
      wrap.style.left=originL+'px';wrap.style.top=originT+'px';
      playReject();
    }
    shRest(sh);
    setTimeout(()=>wrap.classList.remove('landing','snapback'),600);
  });
});

document.addEventListener('click',()=>{if(AC.state==='suspended')AC.resume();},{once:true});
</script>
</body>
