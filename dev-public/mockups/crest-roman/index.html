<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fenice romana — fork centerpiece</title>
<style>
  body { margin:0; background:#050d16; color:#f1e8cc; font-family:Georgia,serif; padding:32px; }
  h1 { font-size:20px; letter-spacing:1px; color:#e8c766; margin:0 0 24px; }
  .row { display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; }
  figure { margin:0; flex:1 1 320px; max-width:520px; }
  img { width:100%; display:block; border:1px solid #1d3a46; border-radius:6px; }
  figcaption { margin-top:10px; font-size:16px; color:#e8c766; }
  figcaption small { display:block; color:#b9d2c4; font-size:13px; margin-top:4px; }
</style>
</head>
<body>
<h1>R-315 — Fenice romana: tre direzioni per il centerpiece</h1>
<div class="row">
  <figure>
    <img src="aquila-1-0.png" alt="aquila-1">
    <figcaption>A — aquila-1<small>aquila legionaria: corona d'alloro, fascio di fulmini, gemma centrale</small></figcaption>
  </figure>
  <figure>
    <img src="galea-1-0.png" alt="galea-1">
    <figcaption>B — galea-1<small>cimiero su cupola di galea cesellata, coda a pennacchio da centurione</small></figcaption>
  </figure>
  <figure>
    <img src="sol-1-0.png" alt="sol-1">
    <figcaption>C — sol-1<small>corona radiata Sol Invictus, medaglione d'alloro con fiocco</small></figcaption>
  </figure>
</div>
</body>
</html>
