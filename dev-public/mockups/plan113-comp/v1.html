<!doctype html>
<html><head><meta charset="utf-8"><title>V1 — Ali replicate</title>
<style>
  body{margin:0;background:#0e1a20}
  .stage{position:relative;width:1920px;height:1080px;transform-origin:top left}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .tag{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:99;
       font:12px Georgia,serif;color:#e8d9b0;background:rgba(14,26,32,.82);
       padding:6px 14px;border:1px solid #6b5a2e;border-radius:4px;letter-spacing:.04em;white-space:nowrap}
  .back{position:fixed;top:10px;right:14px;z-index:99;font:12px Georgia,serif;color:#c9a94e}
  .zone{position:absolute;border:1px dashed rgba(201,169,78,.5);border-radius:4px;pointer-events:none}
  .zone::after{content:attr(data-l);position:absolute;left:6px;top:-16px;font:10px Georgia,serif;color:#c9a94e;opacity:.8}
</style></head><body>
<div class="tag">V1 — Ali replicate: le 3 zone dello stage come su /game oggi (questa è la produzione reale, non un mockup) — cap convivenza A ≤45% (oggi ~36%)</div>
<a class="back" href="index.html">← varianti</a>
<div class="stage">
  <img class="bg" src="triad-raw.png" alt="">
  <div class="zone" data-l="leftWing 260–400" style="left:228px;top:88px;width:400px;height:652px"></div>
  <div class="zone" data-l="centerStage (planner 680)" style="left:816px;top:88px;width:688px;height:595px"></div>
  <div class="zone" data-l="rightWing 340 (forecast)" style="left:1550px;top:96px;width:348px;height:390px"></div>
</div>
<script>const s=document.querySelector('.stage'),f=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform='scale('+f+')';</script>
</body></html>
