<!doctype html>
<html><head><meta charset="utf-8"><title>V2 — Fascia unificata</title>
<style>
  body{margin:0;background:#0e1a20}
  .stage{position:relative;width:1920px;height:1080px;transform-origin:top left}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .tag{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:99;
       font:12px Georgia,serif;color:#e8d9b0;background:rgba(14,26,32,.82);
       padding:6px 14px;border:1px solid #6b5a2e;border-radius:4px;letter-spacing:.04em;white-space:nowrap}
  .back{position:fixed;top:10px;right:14px;z-index:99;font:12px Georgia,serif;color:#c9a94e}
  .panel{position:absolute;object-fit:cover}
  .frame{position:absolute;border:2px solid #a8894a;border-radius:10px;
         background:rgba(20,34,42,.35);box-shadow:0 8px 40px rgba(0,0,0,.5);pointer-events:none}
  .frame::after{content:attr(data-l);position:absolute;left:10px;top:-18px;font:10px Georgia,serif;color:#c9a94e}
  .free{position:absolute;border:1px dashed rgba(120,160,150,.45);border-radius:6px}
  .free::after{content:'rightWing libera — Voce/narrativa o vuoto';position:absolute;left:8px;top:8px;font:10px Georgia,serif;color:#8fb5a5;opacity:.85}
</style></head><body>
<div class="tag">V2 — Fascia unificata: roster+stash in un unico mobile a sx · planner con forecast integrato nello stesso arredo · rightWing liberata (composito spaziale, arte in F2)</div>
<a class="back" href="index.html">← varianti</a>
<div class="stage">
  <img class="bg" src="base.png" alt="">
  <!-- unico mobile sx: roster + stash dentro una sola cornice -->
  <div class="frame" data-l="mobile compagnia" style="left:20px;top:88px;width:412px;height:704px"></div>
  <img class="panel" src="roster.png" style="left:26px;top:94px;width:400px;height:268px">
  <img class="panel" src="stash.png"  style="left:26px;top:374px;width:380px;height:288px">
  <!-- centro: planner + forecast nello stesso arredo -->
  <div class="frame" data-l="planner + forecast integrato" style="left:560px;top:88px;width:1032px;height:595px"></div>
  <img class="panel" src="planner.png"  style="left:566px;top:94px;width:680px;height:587px">
  <img class="panel" src="forecast.png" style="left:1252px;top:94px;width:340px;height:382px">
  <!-- dx liberata -->
  <div class="free" style="left:1610px;top:96px;width:286px;height:600px"></div>
</div>
<script>const s=document.querySelector('.stage'),f=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform='scale('+f+')';</script>
</body></html>
