<!doctype html><html><head><meta charset="utf-8"><title>Zanara su mappa2 — la composita</title>
<style>body{margin:0;background:#0a141a;font-family:Georgia,serif}.scene{position:relative;width:1600px;margin:20px auto}.bg{display:block;width:100%}.ov{position:absolute;box-shadow:0 8px 40px rgba(0,0,0,.7);border-radius:8px}.cap{position:absolute;bottom:-18px;left:0;font-size:11px;color:#e8d9b0;background:rgba(0,0,0,.6);padding:1px 8px;border-radius:4px}</style></head><body>
<div class="scene">
<img class="bg" src="kit/hud-game.png" alt="mappa2 + chrome reale">
<!-- 10B game-over: emblem alato incrinato — overlay centrato -->
<img class="ov" src="kit/s10b-emblem-0.png" style="left:50%;top:50%;transform:translate(-50%,-50%);width:640px;opacity:.97">
<div class="cap" style="left:50%;top:50%;transform:translate(-50%,290px)">10B — expedition lost (emblema prodotto)</div>
</div>
<div class="scene">
<img class="bg" src="kit/hud-game.png" alt="">
<img class="ov" src="kit/s09-levelup-0.png" style="left:50%;top:50%;transform:translate(-50%,-50%);width:600px">
<div class="cap" style="left:50%;top:50%;transform:translate(-50%,260px)">9B — level-up (luce ascendente)</div>
</div>
<div class="scene">
<img class="bg" src="kit/hud-game.png" alt="">
<img class="ov" src="kit/s08-memorial-0.png" style="left:50%;top:50%;transform:translate(-50%,-50%);width:900px;opacity:.95">
<div class="cap" style="left:50%;top:50%;transform:translate(-50%,300px)">8A — sala caduti (sostituito dal reliquario corretto)</div>
</div>
<div class="scene">
<img class="bg" src="kit/hud-game.png" alt="">
<img class="ov" src="kit/s08-reliquary-0.png" style="left:50%;top:50%;transform:translate(-50%,-50%);width:800px;opacity:.95">
<div class="cap" style="left:50%;top:50%;transform:translate(-50%,280px)">Reliquario — tavola eredità 3 colonne</div>
</div>
</body></html>
