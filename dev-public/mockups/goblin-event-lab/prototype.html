<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goblin Event Modal — HTML Prototype</title>
  <style>
    :root {
      --skyTop: #7ec6e4;
      --skyMid: #4a7ba8;
      --skyBottom: #2a5b6e;
      --shadow: #0b3a4a;
      --panel: rgba(10, 24, 22, 0.92);
      --panelGlass: rgba(10, 24, 22, 0.88);
      --woodDark: #3b2d23;
      --woodMid: #5d4824;
      --woodLight: #a38a70;
      --gold: #d4a84b;
      --amber: #e68a00;
      --crimson: #8c2318;
      --crimsonLight: #d65d50;
      --parchment: #f5e6d3;
      --parchmentDim: #a38a70;
      --solar: rgba(255, 230, 180, 0.30);
      --cardW: 543px;
      --cardH: 724px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #050509;
      color: var(--parchment);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
      gap: 1rem;
    }

    .controls { display: flex; align-items: center; gap: 1rem; color: var(--parchment); }
    .controls label { cursor: pointer; font-size: 0.9rem; text-transform: uppercase; }

    .card {
      position: relative;
      width: var(--cardW);
      height: var(--cardH);
      overflow: hidden;
      border-radius: 4px;
      background:
        radial-gradient(circle at 25% 10%, var(--solar), transparent 45%),
        linear-gradient(to bottom, var(--skyTop), var(--skyMid) 45%, var(--skyBottom));
      box-shadow: inset 0 0 60px rgba(2,6,10,0.85), 0 0 24px rgba(0,0,0,0.8);
    }

    .hero {
      position: absolute;
      top: 18%;
      left: 11%;
      width: 77.9%;
      height: auto;
      z-index: 0;
    }

    .banner {
      position: absolute;
      top: 8.3%;
      left: 11%;
      width: 77.9%;
      height: 9.7%;
      background: linear-gradient(to bottom, var(--woodLight), var(--woodMid) 40%, var(--woodDark));
      clip-path: polygon(0% 8%, 4% 0%, 96% 0%, 100% 8%, 100% 92%, 96% 100%, 4% 100%, 0% 92%);
      box-shadow: inset 0 0 30px rgba(0,0,0,0.7), 0 -8px 24px rgba(0,0,0,0.4);
      z-index: 10;
    }

    .title {
      position: absolute;
      top: 14.5%;
      width: 100%;
      text-align: center;
      font-size: 1.75rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      color: var(--woodDark);
      text-shadow: 0 2px 4px var(--shadow);
      z-index: 20;
    }

    .panel {
      position: absolute;
      top: 53.9%;
      left: 50%;
      transform: translateX(-50%);
      width: 72.3%;
      height: 24.5%;
      background: linear-gradient(to bottom, var(--panel), var(--panelGlass));
      box-shadow: inset 0 0 30px rgba(0,0,0,0.7), 0 -8px 24px rgba(0,0,0,0.4);
      z-index: 20;
    }

    .panelHeader {
      position: absolute;
      top: 6.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: var(--parchmentDim);
      text-transform: uppercase;
    }

    .bodyText {
      position: absolute;
      top: 27%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      font-size: 0.48rem;
      font-weight: 600;
      color: var(--parchment);
      text-transform: uppercase;
    }

    .warningText {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      font-size: 0.58rem;
      font-weight: 800;
      color: var(--crimsonLight);
      text-transform: uppercase;
    }

    .arrival {
      position: absolute;
      top: 66%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 30;
    }
    .arrivalLabel { font-size: 0.5rem; font-weight: 800; color: var(--parchment); text-transform: uppercase; }
    .arrivalCount { font-size: 1.4rem; font-weight: 900; color: var(--amber); }
    .arrivalUnit { font-size: 0.5rem; font-weight: 800; color: var(--parchment); text-transform: uppercase; }

    .primaryBtn {
      position: absolute;
      top: 81.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 48.4%;
      height: 7.6%;
      background: linear-gradient(to bottom, #9e2b20, #6e1810 50%, #470a05);
      clip-path: polygon(5% 0%, 95% 0%, 100% 50%, 95% 100%, 5% 100%, 0% 50%);
      border: none;
      color: var(--parchment);
      font-size: 0.5rem;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      z-index: 30;
      text-shadow: 0 1px 2px var(--shadow);
    }

    .frame { position: absolute; inset: 0; z-index: 40; pointer-events: none; }

    .ref-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.4;
      pointer-events: none;
      z-index: 50;
    }

    .skeleton .banner { background: var(--woodMid); clip-path: none; box-shadow: none; }
    .skeleton .panel { background: var(--panel); box-shadow: none; }
    .skeleton .primaryBtn { background: var(--crimson); clip-path: none; }
    .skeleton .frame { display: none; }
    .skeleton .ref-overlay { display: block; }
  </style>
</head>
<body>
  <div class="controls">
    <input type="checkbox" id="skeleton" onchange="document.querySelector('.card').classList.toggle('skeleton', this.checked)" />
    <label for="skeleton">Skeleton (Phase 6)</label>
  </div>

  <div class="card skeleton">
    <img class="hero" src="../goblin-invasion-painted/goblin-invasion-hero.png" alt="" />

    <div class="banner"></div>
    <h2 class="title">INVASION</h2>

    <div class="panel">
      <div class="panelHeader">WORLD EVENT</div>
      <div class="bodyText">A goblin army is marching on your lands.</div>
      <div class="warningText">Your village will be attacked.</div>
      <div class="arrival">
        <span class="arrivalLabel">Arrival In</span>
        <span class="arrivalCount">2</span>
        <span class="arrivalUnit">Days Remaining</span>
      </div>
    </div>

    <button class="primaryBtn" type="button">Prepare The Defenses</button>

    <svg class="frame" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#a38a70" />
          <stop offset="35%" stop-color="#5d4824" />
          <stop offset="100%" stop-color="#3b2d23" />
        </linearGradient>
        <radialGradient id="goldGrad" cx="30%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#d4a84b" />
          <stop offset="60%" stop-color="#e68a00" />
          <stop offset="100%" stop-color="#3b2d23" />
        </radialGradient>
        <filter id="woodFilter" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.45" numOctaves="4" seed="3" result="noise" />
          <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.05 0 0 0 0 0.03 0 0 0 0 0.02 0 0 0 0.18 0" result="cNoise" />
          <feBlend in="SourceGraphic" in2="cNoise" mode="overlay" />
        </filter>
      </defs>
      <path d="M0,0 h100 v100 h-100 z M11,11 v78 h78 v-78 z" fill="url(#woodGrad)" filter="url(#woodFilter)" stroke="url(#goldGrad)" stroke-width="0.5" />
      <path d="M11,11 L14,11 L11,14 Z" fill="#d4a84b" opacity="0.9" />
      <path d="M89,11 L86,11 L89,14 Z" fill="#d4a84b" opacity="0.9" />
      <path d="M11,89 L14,89 L11,86 Z" fill="#d4a84b" opacity="0.9" />
      <path d="M89,89 L86,89 L89,86 Z" fill="#d4a84b" opacity="0.9" />
      <circle cx="50" cy="11" r="3" fill="url(#goldGrad)" />
      <rect x="11" y="11" width="78" height="78" fill="none" stroke="#d4a84b" stroke-width="0.25" opacity="0.6" />
    </svg>

    <img class="ref-overlay" src="reference.png" alt="" />
  </div>
</body>
</html>
