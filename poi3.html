<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#080604;font-family:'Cinzel',serif;}
#map-wrap{position:fixed;inset:0;}
#map-img{width:100%;height:100%;object-fit:cover;object-position:center;

.poi-anchor svg{overflow:visible;display:block;}
.poi-lbl{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);

  white-space:nowrap;pointer-events:none;
  text-shadow:0 1px 6px rgba(0,0,0,.95);}
.section-lbl{position:fixed;font-size:6.5px;letter-spacing:.30em;text-transform:uppercase;
  color:rgba(192,148,48,.32);pointer-events:none;top:14px;}
#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
  font-size:5.5px;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(192,148,48,.26);pointer-events:none;white-space:nowrap;}
</style>

<script>
// ── HALO ROTATION ───────────────────────────────────
let t=0;
const rots=document.querySelectorAll('.halo-rot');
function tick(){
  t+=0.45;
  rots.forEach(g=>{
    const s=parseFloat(g.dataset.spd||1);
    const d=parseFloat(g.dataset.dir||1);
    g.setAttribute('transform','rotate('+(t*s*d)+')');
  });
  requestAnimationFrame(tick);
}
tick();

// ── DROP HIGHLIGHT ───────────────────────────────────
function dropHighlight(){
  document.querySelectorAll('.poi-anchor').forEach(anchor=>{
    const svg=anchor.querySelector('svg');
    const ns='http://www.w3.org/2000/svg';
    const rings=[];
    for(let i=0;i<2;i++){
      const r=document.createElementNS(ns,'circle');
      r.setAttribute('cx','0');r.setAttribute('cy','0');
      r.setAttribute('r',i===0?'18':'23');
      r.setAttribute('fill','none');
      r.setAttribute('stroke','rgba(110,220,140,.0)');
      r.setAttribute('stroke-width',i===0?'2.5':'1.5');
      svg.appendChild(r);rings.push(r);
    }
    const flash=document.createElementNS(ns,'circle');
    flash.setAttribute('cx','0');flash.setAttribute('cy','0');
    flash.setAttribute('r','14');flash.setAttribute('fill','rgba(80,210,120,.0)');
    svg.appendChild(flash);
    let frame=0,dur=55;
    const iv=setInterval(()=>{
      frame++;
      const p=frame/dur,ease=p<.3?p/.3:(1-p)/.7;
      flash.setAttribute('fill',`rgba(80,210,120,${(ease*.18).toFixed(3)})` );
      rings[0].setAttribute('r',18+p*12);
      rings[0].setAttribute('stroke',`rgba(110,220,140,${(ease*.52).toFixed(3)})`);
      rings[1].setAttribute('r',23+p*14);
      rings[1].setAttribute('stroke',`rgba(110,220,140,${(ease*.26).toFixed(3)})`);
      if(frame>=dur){
        clearInterval(iv);
        rings.forEach(r=>svg.removeChild(r));
        svg.removeChild(flash);
      }
    },16);
  });
}
setInterval(dropHighlight,3000);
setTimeout(dropHighlight,600);

// ── DAY/NIGHT CYCLE ──────────────────────────────────
const DN = {
  // 0..1 = full day cycle. 0=midnight, 0.25=dawn, 0.5=noon, 0.75=dusk, 1=midnight
  time: 0.28,        // start just after dawn
  speed: 0.00018,    // speed multiplier
  paused: false,
  isDay: true,       // true=day, false=night
  transitioning: false,
};

const dnHalo   = document.getElementById('dn-halo-arc');
const dnSun    = document.getElementById('dn-sun');
const dnMoon   = document.getElementById('dn-moon');
const dnPause  = document.getElementById('dn-pause');
const dnBloom  = document.getElementById('dn-bloom-circle');
const dnLabel  = document.getElementById('dn-label');
const dnBox    = document.getElementById('daynightbox');

// Halo circumference at r=28
const CIRC = 2*Math.PI*28; // 175.93

function updateDN(){
  const t = DN.time;
  // Halo fills from 0 to full over the day cycle
  // Day = 0.25..0.75, Night = 0.75..1..0.25
  const fill = t * CIRC;
  const gap  = CIRC - fill;
  dnHalo.setAttribute('stroke-dasharray', `${fill.toFixed(1)} ${gap.toFixed(1)}`);

  // Day: gold halo. Night: indigo halo. Transition around 0.25 and 0.75
  const isDayPhase = t > 0.22 && t < 0.78;
  const newIsDay = isDayPhase;

  if(newIsDay !== DN.isDay && !DN.transitioning){
    DN.transitioning = true;
    transitionPhase(newIsDay);
  }

  // Update halo color
  if(isDayPhase){
    dnHalo.setAttribute('stroke','#c8a84b');
    dnBloom.setAttribute('fill','url(#dn-bloom)');
  } else {
    dnHalo.setAttribute('stroke','#4860c0');
    dnBloom.setAttribute('fill','url(#dn-bloom)');
  }

  // Label
  if(DN.paused){
    dnLabel.textContent='PAUSA';
    dnLabel.style.color='rgba(210,178,90,.38)';
  } else {
    const hour = Math.floor(t * 24);
    const ampm = hour < 12 ? 'AM' : 'PM';
    const h12  = hour%12===0?12:hour%12;
    dnLabel.textContent = `${h12.toString().padStart(2,'0')}:00 ${ampm}`;
    dnLabel.style.color = isDayPhase ? 'rgba(210,178,90,.52)' : 'rgba(130,150,220,.52)';
  }
}

function transitionPhase(toDay){
  // Fade out current, fade in next
  const from = toDay ? dnMoon : dnSun;
  const to   = toDay ? dnSun  : dnMoon;
  DN.isDay = toDay;

  let op = 1, frames = 0, total = 40;
  const iv = setInterval(()=>{
    frames++;
    const p = frames/total;
    from.setAttribute('opacity', (1-p).toFixed(3));
    to.setAttribute(  'opacity', p.toFixed(3));
    if(frames>=total){
      clearInterval(iv);
      from.setAttribute('opacity','0');
      to.setAttribute(  'opacity','1');
      DN.transitioning=false;
    }
  },20);
}

function dnTick(){
  if(!DN.paused){
    DN.time = (DN.time + DN.speed) % 1.0;
  }
  updateDN();
  requestAnimationFrame(dnTick);
}
dnTick();

// Click = toggle pause
dnBox.addEventListener('click',()=>{
  DN.paused = !DN.paused;
  // Show/hide pause icon
  dnPause.setAttribute('opacity', DN.paused ? '0.80' : '0');
  // Dim sun/moon when paused
  const icon = DN.isDay ? dnSun : dnMoon;
  icon.setAttribute('opacity', DN.paused ? '0.45' : '1');
});
</script>
