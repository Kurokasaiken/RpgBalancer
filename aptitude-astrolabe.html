<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aptitude Astrolabe — Skill Roll Testing Suite</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

:root {
  --obsidian: #050509;
  --teal: #1abc9c;
  --teal-dark: #0d7a5f;
  --sun-bronze: #c8873a;
  --sun-bronze-light: #e4a54a;
  --white-gold: #f5eed6;
  --ivory: #faf3e0;
  --magenta-vein: #9b30ff;
  --indigo-vein: #1a0a3e;
  --goo-surface: #08080e;
  --star-face: #e8dfc0;
  --star-rim-inner: #8a6420;
  --star-rim-outer: #c8873a;
  --core-bronze: #d4953c;
}

html, body { height: 100%; overflow: hidden; background: var(--obsidian); color: var(--ivory); font-family: 'Cormorant Garamond', serif; }

#app {
  display: flex; height: 100vh; width: 100vw;
}

#arena-wrap {
  flex: 1; display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
  background: var(--obsidian);
}
#arena-wrap::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 70% 50% at 35% 30%, rgba(26,188,156,.04) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 70% 65%, rgba(13,122,95,.03) 0%, transparent 60%);
  z-index: 0;
}
#arena-wrap::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  filter: url(#stone-tex);
  background: var(--obsidian);
  opacity: .35;
  z-index: 0;
  mix-blend-mode: overlay;
}

#arena-shake {
  transition: none; will-change: transform; position: relative; z-index: 1;
}

canvas#main-canvas {
  display: block;
  border-radius: 12px;
  box-shadow:
    0 0 120px rgba(26,188,156,.08),
    0 0 60px rgba(26,188,156,.05),
    0 0 2px rgba(26,188,156,.25),
    inset 0 0 80px rgba(0,0,0,.4);
  border: 1px solid rgba(26,188,156,.08);
}

/* ── Screenshake CSS keyframe ── */
@keyframes quake {
  0%   { transform: translate(0,0) rotate(0deg); }
  10%  { transform: translate(-8px, 6px) rotate(-0.5deg); }
  20%  { transform: translate(7px, -9px) rotate(0.7deg); }
  30%  { transform: translate(-10px, 3px) rotate(-0.3deg); }
  40%  { transform: translate(5px, -7px) rotate(0.5deg); }
  50%  { transform: translate(-6px, 8px) rotate(-0.8deg); }
  60%  { transform: translate(9px, -4px) rotate(0.4deg); }
  70%  { transform: translate(-3px, 7px) rotate(-0.6deg); }
  80%  { transform: translate(6px, -5px) rotate(0.3deg); }
  90%  { transform: translate(-4px, 3px) rotate(-0.2deg); }
  100% { transform: translate(0,0) rotate(0deg); }
}
#arena-shake.quake-climax {
  animation: quake .45s cubic-bezier(.36,.07,.19,.97) both;
}

/* ── Result overlay ── */
#result-overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  pointer-events: none; z-index: 20; opacity: 0; transition: opacity .5s ease-out;
}
#result-overlay.visible { opacity: 1; }

#golden-flash {
  position: absolute; inset: 0; pointer-events: none; z-index: 19;
  opacity: 0; transition: opacity .15s;
  background: radial-gradient(ellipse at center,
    rgba(228,165,74,.7) 0%,
    rgba(200,135,58,.3) 30%,
    rgba(26,188,156,.1) 60%,
    transparent 80%);
}
#golden-flash.fire { opacity: 1; }
#golden-flash.fade { opacity: 0; transition: opacity .8s ease-out; }
#crimson-flash {
  position: absolute; inset: 0; pointer-events: none; z-index: 19;
  opacity: 0; transition: opacity .15s;
  background: radial-gradient(ellipse at center,
    rgba(180,40,80,.6) 0%,
    rgba(120,20,50,.25) 30%,
    rgba(26,10,62,.1) 60%,
    transparent 80%);
}
#crimson-flash.fire { opacity: 1; }
#crimson-flash.fade { opacity: 0; transition: opacity .8s ease-out; }

#result-overlay .result-card {
  text-align: center; font-family: 'Cinzel Decorative', 'Cinzel', serif;
  transform: scale(.8); opacity: 0;
  transition: transform .6s cubic-bezier(.22,1,.36,1), opacity .5s ease-out;
}
#result-overlay.visible .result-card {
  transform: scale(1); opacity: 1;
}
#result-overlay .result-label {
  font-size: clamp(36px, 5.5vw, 80px); font-weight: 900;
  letter-spacing: .22em; text-transform: uppercase;
  -webkit-text-stroke: 1px rgba(0,0,0,.4);
}
#result-overlay.success .result-label {
  color: var(--sun-bronze-light);
  text-shadow:
    0 0 80px rgba(228,165,74,.9),
    0 0 40px rgba(200,135,58,.6),
    0 2px 20px rgba(0,0,0,.8),
    0 0 160px rgba(26,188,156,.3);
}
#result-overlay.failure .result-label {
  color: #e74c6f;
  text-shadow:
    0 0 80px rgba(180,40,80,.8),
    0 0 40px rgba(120,20,50,.5),
    0 2px 20px rgba(0,0,0,.8),
    0 0 160px rgba(26,10,62,.4);
}
#result-overlay .result-sub {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: clamp(11px, 1.4vw, 18px); letter-spacing: .4em; text-transform: uppercase;
  margin-top: 12px; opacity: .55; color: var(--ivory);
}
#result-overlay .result-line {
  width: 200px; height: 1px; margin: 14px auto 0;
  background: linear-gradient(90deg, transparent, rgba(228,165,74,.4), transparent);
}
#result-overlay.failure .result-line {
  background: linear-gradient(90deg, transparent, rgba(180,40,80,.3), transparent);
}

/* ── Panel ── */
#panel {
  width: 340px; flex-shrink: 0; overflow-y: auto;
  background: linear-gradient(180deg, #08081a 0%, #040410 100%);
  border-left: 1px solid rgba(26,188,156,.1);
  padding: 20px 18px; font-size: 13px;
  box-shadow: -12px 0 60px rgba(0,0,0,.7), inset 1px 0 0 rgba(26,188,156,.05);
}
#panel h2 {
  font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: .35em;
  text-transform: uppercase; color: var(--teal); margin: 20px 0 10px;
  border-bottom: 1px solid rgba(26,188,156,.1); padding-bottom: 6px;
  text-shadow: 0 0 20px rgba(26,188,156,.3);
}
#panel h2:first-child { margin-top: 0; }
#panel label {
  display: flex; align-items: center; justify-content: space-between;
  margin: 6px 0; color: rgba(245,238,214,.6); font-size: 11px; letter-spacing: .08em;
}
#panel label span.val {
  min-width: 36px; text-align: right; color: var(--sun-bronze-light);
  font-family: 'Cinzel', serif; font-weight: 700; font-size: 12px;
}
#panel input[type=range] {
  flex: 1; margin: 0 10px; height: 3px; accent-color: var(--teal);
  -webkit-appearance: none; background: rgba(26,188,156,.12); border-radius: 2px; cursor: pointer;
}
#panel input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
  background: var(--teal); border: 2px solid var(--obsidian); cursor: pointer;
  box-shadow: 0 0 8px rgba(26,188,156,.4);
}
#panel select {
  width: 100%; padding: 6px 10px; background: #080818; color: var(--ivory);
  border: 1px solid rgba(26,188,156,.18); border-radius: 6px; font-family: inherit;
  font-size: 12px; letter-spacing: .1em; cursor: pointer; margin: 4px 0 8px;
}
#panel .toggle-row {
  display: flex; align-items: center; gap: 8px; margin: 6px 0;
}
#panel .toggle-row input[type=checkbox] {
  accent-color: var(--magenta-vein); width: 16px; height: 16px; cursor: pointer;
}
#panel .toggle-row span { font-size: 11px; letter-spacing: .08em; color: rgba(245,238,214,.6); }

#btn-run {
  display: block; width: 100%; margin-top: 24px; padding: 14px;
  font-family: 'Cinzel', serif; font-size: 13px; font-weight: 700;
  letter-spacing: .3em; text-transform: uppercase;
  color: var(--obsidian); background: linear-gradient(135deg, var(--teal) 0%, #0d8a6a 100%);
  border: none; border-radius: 10px; cursor: pointer;
  box-shadow: 0 0 40px rgba(26,188,156,.25), 0 4px 20px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.15);
  transition: transform .1s, box-shadow .2s;
}
#btn-run:hover { transform: scale(1.02); box-shadow: 0 0 60px rgba(26,188,156,.4), 0 4px 24px rgba(0,0,0,.5); }
#btn-run:active { transform: scale(.97); }

#state-indicator {
  text-align: center; margin-top: 12px; font-family: 'Cinzel', serif;
  font-size: 10px; letter-spacing: .4em; text-transform: uppercase;
  color: rgba(26,188,156,.4);
}
</style>
</head>
<body>

<!-- SVG Filters (hidden) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- Obsidian stone texture -->
    <filter id="stone-tex" x="0%" y="0%" width="100%" height="100%" colorInterpolationFilters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.55 0.65" numOctaves="6" seed="4" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 .015
                0 0 0 0 .015
                0 0 0 0 .028
                0 0 0 .6 0" result="tinted"/>
      <feTurbulence type="fractalNoise" baseFrequency="1.2 1.4" numOctaves="3" seed="12" result="micro"/>
      <feColorMatrix in="micro" type="matrix"
        values="0 0 0 0 .01
                0 0 0 0 .01
                0 0 0 0 .02
                0 0 0 .25 0" result="microTinted"/>
      <feMerge result="combined"><feMergeNode in="tinted"/><feMergeNode in="microTinted"/></feMerge>
      <feBlend in="SourceGraphic" in2="combined" mode="overlay"/>
    </filter>
    <!-- Goo wet specular filter -->
    <filter id="goo-wet" x="-10%" y="-10%" width="120%" height="120%" colorInterpolationFilters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.012 0.018" numOctaves="4" seed="7" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="8" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feSpecularLighting in="turb" surfaceScale="3" specularConstant="1.2" specularExponent="35" result="specular" lighting-color="#8af0d8">
        <fePointLight x="250" y="180" z="220"/>
      </feSpecularLighting>
      <feComposite in="specular" in2="displaced" operator="in" result="lit"/>
      <feBlend in="displaced" in2="lit" mode="screen"/>
    </filter>
  </defs>
</svg>

<div id="app">
  <div id="arena-wrap">
    <div id="arena-shake">
      <canvas id="main-canvas" width="640" height="640"></canvas>
    </div>
    <div id="golden-flash"></div>
    <div id="crimson-flash"></div>
    <div id="result-overlay">
      <div class="result-card">
        <div class="result-label"></div>
        <div class="result-sub"></div>
        <div class="result-line"></div>
      </div>
    </div>
  </div>

  <div id="panel">
    <h2>Character Stats</h2>
    <label>Player Stat <input type="range" id="sl-player" min="1" max="100" value="50"> <span class="val" id="vPlayer">50</span></label>
    <label>Challenge Stat <input type="range" id="sl-challenge" min="1" max="100" value="50"> <span class="val" id="vChallenge">50</span></label>

    <h2>Target Verdict</h2>
    <select id="sel-verdict">
      <option value="bigwin">Big Win (Center Core)</option>
      <option value="win" selected>Win (Inside Star)</option>
      <option value="almost">Almost (Star Rim)</option>
      <option value="fail">Fail (Inside Goo)</option>
      <option value="epicfail">Epic Fail (Goo Outer Ridge)</option>
    </select>

    <h2>Risk Flags</h2>
    <div class="toggle-row"><input type="checkbox" id="chk-wounded"><span>Wounded (Magenta Vein)</span></div>
    <div class="toggle-row"><input type="checkbox" id="chk-dead"><span>Dead (Indigo Vein)</span></div>

    <h2>Timing (ms)</h2>
    <label>Black Pillar Slam <input type="range" id="sl-t-blackSlam" min="200" max="2000" value="800" step="50"> <span class="val" id="vt0">800</span></label>
    <label>Goo Expansion <input type="range" id="sl-t-gooExpand" min="200" max="2000" value="600" step="50"> <span class="val" id="vt1">600</span></label>
    <label>Alabaster Slam <input type="range" id="sl-t-alabasterSlam" min="200" max="2000" value="700" step="50"> <span class="val" id="vt2">700</span></label>
    <label>Star Burst <input type="range" id="sl-t-starBurst" min="200" max="2000" value="500" step="50"> <span class="val" id="vt3">500</span></label>
    <label>Ball Spin <input type="range" id="sl-t-ballSpin" min="1000" max="6000" value="3200" step="100"> <span class="val" id="vt4">3200</span></label>
    <label>Hit-Stop <input type="range" id="sl-t-hitStop" min="50" max="800" value="300" step="10"> <span class="val" id="vt5">300</span></label>

    <h2>Juice Intensities</h2>
    <label>Screen Shake <input type="range" id="sl-shake" min="0" max="30" value="12" step="1"> <span class="val" id="vShake">12</span></label>
    <label>Trail Length <input type="range" id="sl-trail" min="5" max="60" value="28" step="1"> <span class="val" id="vTrail">28</span></label>
    <label>Magnet Force <input type="range" id="sl-magnet" min="0.1" max="5" value="1.8" step="0.1"> <span class="val" id="vMagnet">1.8</span></label>

    <button id="btn-run">Re-Run Animation</button>
    <div id="state-indicator">idle</div>
  </div>
</div>

<script>
// ============================================================
// CONFIGURATION
// ============================================================
const CFG = {
  playerStat: 50,
  challengeStat: 50,
  verdict: 'win',
  wounded: false,
  dead: false,
  timing: {
    blackSlam: 800,
    gooExpand: 600,
    alabasterSlam: 700,
    starBurst: 500,
    ballSpin: 3200,
    hitStop: 300,
  },
  juice: {
    shake: 12,
    trail: 28,
    magnet: 1.8,
  },
};

// ============================================================
// CANVAS SETUP
// ============================================================
const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const CX = W / 2, CY = H / 2;
const AXES = 5;
const BASE_RADIUS = 260;
const MIN_R = 60;

// ============================================================
// PRE-BAKED STONE TEXTURE (generated once, composited every frame)
// ============================================================
const stoneBuffer = document.createElement('canvas');
stoneBuffer.width = W; stoneBuffer.height = H;
(function bakeStone() {
  const sctx = stoneBuffer.getContext('2d');
  sctx.fillStyle = '#050509';
  sctx.fillRect(0, 0, W, H);
  const id = sctx.getImageData(0, 0, W, H);
  const d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const coarse = (Math.random() - 0.5) * 16;
    const fine = (Math.random() - 0.5) * 6;
    d[i]   = Math.max(0, Math.min(255, 5 + coarse + fine));
    d[i+1] = Math.max(0, Math.min(255, 5 + coarse + fine));
    d[i+2] = Math.max(0, Math.min(255, 9 + coarse + fine * 1.4));
    d[i+3] = 255;
  }
  sctx.putImageData(id, 0, 0);
  // Subtle teal ambient light from top-left
  const amb = sctx.createRadialGradient(W * 0.25, H * 0.2, 20, CX, CY, W * 0.7);
  amb.addColorStop(0, 'rgba(26,188,156,.03)');
  amb.addColorStop(0.5, 'rgba(13,122,95,.015)');
  amb.addColorStop(1, 'transparent');
  sctx.fillStyle = amb;
  sctx.fillRect(0, 0, W, H);
  // Vignette
  const vig = sctx.createRadialGradient(CX, CY, W * 0.25, CX, CY, W * 0.55);
  vig.addColorStop(0, 'transparent');
  vig.addColorStop(0.7, 'rgba(0,0,0,.15)');
  vig.addColorStop(1, 'rgba(0,0,0,.5)');
  sctx.fillStyle = vig;
  sctx.fillRect(0, 0, W, H);
})();

// ============================================================
// GEOMETRY ENGINE (UNTOUCHED)
// ============================================================
function pillarRadius(statValue) {
  return MIN_R + (statValue / 100) * (BASE_RADIUS - MIN_R);
}

function pentagonVertices(cx, cy, r) {
  const verts = [];
  for (let i = 0; i < AXES; i++) {
    const a = -Math.PI / 2 + i * (2 * Math.PI / AXES);
    verts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
  }
  return verts;
}

function starVertices(cx, cy, outerR, innerR) {
  const verts = [];
  for (let i = 0; i < AXES * 2; i++) {
    const a = -Math.PI / 2 + i * (Math.PI / AXES);
    const r = i % 2 === 0 ? outerR : innerR;
    verts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
  }
  return verts;
}

function isPointInPolygon(px, py, verts) {
  let inside = false;
  for (let i = 0, j = verts.length - 1; i < verts.length; j = i++) {
    const xi = verts[i].x, yi = verts[i].y;
    const xj = verts[j].x, yj = verts[j].y;
    if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) {
      inside = !inside;
    }
  }
  return inside;
}

function distToCenter(px, py) {
  return Math.hypot(px - CX, py - CY);
}

function randomAngle() { return Math.random() * Math.PI * 2; }

function pickTargetPoint() {
  const challengeR = pillarRadius(CFG.challengeStat);
  const playerR = pillarRadius(CFG.playerStat);
  const innerStarR = playerR * 0.382;
  const coreR = 22;
  const starVerts = starVertices(CX, CY, playerR, innerStarR);
  const gooVerts = pentagonVertices(CX, CY, challengeR);

  const maxAttempts = 5000;
  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    const angle = randomAngle();
    let dist, x, y;

    switch (CFG.verdict) {
      case 'bigwin':
        dist = Math.random() * coreR * 0.85;
        x = CX + Math.cos(angle) * dist;
        y = CY + Math.sin(angle) * dist;
        return { x, y, success: true, critical: true };

      case 'win':
        dist = coreR + Math.random() * (playerR * 0.7 - coreR);
        x = CX + Math.cos(angle) * dist;
        y = CY + Math.sin(angle) * dist;
        if (isPointInPolygon(x, y, starVerts) && distToCenter(x, y) > coreR) return { x, y, success: true, critical: false };
        break;

      case 'almost':
        dist = playerR * 0.85 + Math.random() * playerR * 0.2;
        x = CX + Math.cos(angle) * dist;
        y = CY + Math.sin(angle) * dist;
        return { x, y, success: true, critical: false };

      case 'fail':
        dist = innerStarR + Math.random() * (challengeR - innerStarR);
        x = CX + Math.cos(angle) * dist;
        y = CY + Math.sin(angle) * dist;
        if (isPointInPolygon(x, y, gooVerts) && !isPointInPolygon(x, y, starVerts)) return { x, y, success: false, critical: false };
        break;

      case 'epicfail':
        dist = challengeR * 0.88 + Math.random() * challengeR * 0.12;
        x = CX + Math.cos(angle) * dist;
        y = CY + Math.sin(angle) * dist;
        if (isPointInPolygon(x, y, gooVerts)) return { x, y, success: false, critical: true };
        break;
    }
  }
  const fb = CFG.verdict === 'fail' || CFG.verdict === 'epicfail';
  return { x: CX + (fb ? challengeR * 0.6 : 0), y: CY, success: !fb, critical: CFG.verdict === 'bigwin' || CFG.verdict === 'epicfail' };
}

// ============================================================
// DRAWING PRIMITIVES (visual-only changes)
// ============================================================
function drawStoneBackground() {
  ctx.drawImage(stoneBuffer, 0, 0);
}

function drawPolygonPath(verts) {
  ctx.beginPath();
  ctx.moveTo(verts[0].x, verts[0].y);
  for (let i = 1; i < verts.length; i++) ctx.lineTo(verts[i].x, verts[i].y);
  ctx.closePath();
}

function drawGoo(r, progress, rippleOrigin, rippleT) {
  if (r <= 0) return;
  const verts = pentagonVertices(CX, CY, r);
  const distortedVerts = [];
  const segs = 80;
  for (let i = 0; i < segs; i++) {
    const t = i / segs;
    const idx = Math.floor(t * AXES);
    const nextIdx = (idx + 1) % AXES;
    const localT = (t * AXES) - idx;
    const x = verts[idx].x + (verts[nextIdx].x - verts[idx].x) * localT;
    const y = verts[idx].y + (verts[nextIdx].y - verts[idx].y) * localT;
    const angle = Math.atan2(y - CY, x - CX);
    const wobble = Math.sin(angle * 7 + performance.now() * 0.001) * 4 + Math.sin(angle * 3 - performance.now() * 0.0015) * 6;
    distortedVerts.push({
      x: x + Math.cos(angle) * wobble * progress,
      y: y + Math.sin(angle) * wobble * progress,
    });
  }

  ctx.save();

  // Goo body path
  ctx.beginPath();
  ctx.moveTo(distortedVerts[0].x, distortedVerts[0].y);
  for (let i = 1; i < distortedVerts.length; i++) {
    const prev = distortedVerts[i - 1];
    const curr = distortedVerts[i];
    ctx.quadraticCurveTo(prev.x, prev.y, (prev.x + curr.x) / 2, (prev.y + curr.y) / 2);
  }
  ctx.closePath();

  // Deep black base
  const gooGrad = ctx.createRadialGradient(CX - 40, CY - 60, 8, CX, CY, r);
  gooGrad.addColorStop(0, 'rgba(12,12,22,.97)');
  gooGrad.addColorStop(0.3, 'rgba(6,6,12,.98)');
  gooGrad.addColorStop(0.7, 'rgba(3,3,8,.99)');
  gooGrad.addColorStop(1, 'rgba(2,2,5,1)');
  ctx.fillStyle = gooGrad;
  ctx.fill();

  // Primary specular highlight (top-left light source)
  ctx.beginPath();
  ctx.moveTo(distortedVerts[0].x, distortedVerts[0].y);
  for (let i = 1; i < distortedVerts.length; i++) {
    const prev = distortedVerts[i - 1];
    const curr = distortedVerts[i];
    ctx.quadraticCurveTo(prev.x, prev.y, (prev.x + curr.x) / 2, (prev.y + curr.y) / 2);
  }
  ctx.closePath();
  const sheen1 = ctx.createRadialGradient(CX - r * 0.35, CY - r * 0.4, 5, CX, CY, r * 0.8);
  sheen1.addColorStop(0, 'rgba(120,140,160,.16)');
  sheen1.addColorStop(0.25, 'rgba(80,100,120,.08)');
  sheen1.addColorStop(0.6, 'rgba(26,188,156,.03)');
  sheen1.addColorStop(1, 'transparent');
  ctx.fillStyle = sheen1;
  ctx.fill();

  // Secondary specular (bottom-right, fainter)
  ctx.beginPath();
  ctx.moveTo(distortedVerts[0].x, distortedVerts[0].y);
  for (let i = 1; i < distortedVerts.length; i++) {
    const prev = distortedVerts[i - 1];
    const curr = distortedVerts[i];
    ctx.quadraticCurveTo(prev.x, prev.y, (prev.x + curr.x) / 2, (prev.y + curr.y) / 2);
  }
  ctx.closePath();
  const sheen2 = ctx.createRadialGradient(CX + r * 0.25, CY + r * 0.3, 3, CX + r * 0.1, CY + r * 0.1, r * 0.6);
  sheen2.addColorStop(0, 'rgba(60,80,100,.08)');
  sheen2.addColorStop(0.5, 'rgba(26,188,156,.02)');
  sheen2.addColorStop(1, 'transparent');
  ctx.fillStyle = sheen2;
  ctx.fill();

  // Caustic teal edge shimmer
  ctx.beginPath();
  ctx.moveTo(distortedVerts[0].x, distortedVerts[0].y);
  for (let i = 1; i < distortedVerts.length; i++) {
    const prev = distortedVerts[i - 1];
    const curr = distortedVerts[i];
    ctx.quadraticCurveTo(prev.x, prev.y, (prev.x + curr.x) / 2, (prev.y + curr.y) / 2);
  }
  ctx.closePath();
  ctx.strokeStyle = 'rgba(26,188,156,.12)';
  ctx.lineWidth = 2.5;
  ctx.shadowColor = 'rgba(26,188,156,.2)';
  ctx.shadowBlur = 12;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Ripples on resolution
  if (rippleOrigin && rippleT > 0) {
    for (let ring = 0; ring < 5; ring++) {
      const rr = rippleT * (50 + ring * 35);
      const alpha = Math.max(0, 0.3 - rippleT * 0.3) * (1 - ring * 0.18);
      ctx.beginPath();
      ctx.arc(rippleOrigin.x, rippleOrigin.y, rr, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(26,188,156,${alpha})`;
      ctx.lineWidth = 2.5 - ring * 0.4;
      ctx.stroke();
    }
  }

  ctx.restore();
}

function drawVeins(r, progress) {
  if (!CFG.wounded && !CFG.dead) return;
  ctx.save();

  const now = performance.now() * 0.0008;

  if (CFG.wounded) {
    ctx.globalAlpha = progress * 0.8;
    for (let i = 0; i < 4; i++) {
      const startAngle = now + i * 1.57;
      ctx.beginPath();
      for (let t = 0; t <= 1; t += 0.015) {
        const cr = 18 + (r * 0.95) * t;
        const ca = startAngle + Math.sin(t * 5 + i * 0.8) * 0.45;
        ctx.lineTo(CX + Math.cos(ca) * cr, CY + Math.sin(ca) * cr);
      }
      // Thicker glow pass
      ctx.strokeStyle = 'rgba(155,48,255,.2)';
      ctx.lineWidth = 8;
      ctx.setLineDash([]);
      ctx.stroke();
      // Core vein
      ctx.strokeStyle = 'rgba(180,80,255,.55)';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([6, 10]);
      ctx.stroke();
    }
  }

  if (CFG.dead) {
    ctx.globalAlpha = progress * 0.75;
    for (let i = 0; i < 3; i++) {
      const startAngle = now * 0.6 + i * 2.09;
      ctx.beginPath();
      for (let t = 0; t <= 1; t += 0.015) {
        const cr = 12 + (r * 0.98) * t;
        const ca = startAngle + Math.sin(t * 3.5 + i * 1.2) * 0.5;
        ctx.lineTo(CX + Math.cos(ca) * cr, CY + Math.sin(ca) * cr);
      }
      // Outer dark glow
      ctx.strokeStyle = 'rgba(26,10,62,.35)';
      ctx.lineWidth = 10;
      ctx.setLineDash([]);
      ctx.stroke();
      // Inner dark vein
      ctx.strokeStyle = 'rgba(40,15,80,.65)';
      ctx.lineWidth = 3.5;
      ctx.setLineDash([12, 7]);
      ctx.stroke();
    }
  }

  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawStar(outerR, innerR, progress, glowIntensity) {
  if (outerR <= 0 || progress <= 0) return;
  const currentOuter = outerR * progress;
  const currentInner = innerR * progress;
  const verts = starVertices(CX, CY, currentOuter, currentInner);

  ctx.save();

  // Outer ambient glow
  if (glowIntensity > 0) {
    drawPolygonPath(verts);
    ctx.shadowColor = `rgba(200,135,58,${glowIntensity * 0.5})`;
    ctx.shadowBlur = 50 * glowIntensity;
    ctx.strokeStyle = `rgba(200,135,58,${glowIntensity * 0.15})`;
    ctx.lineWidth = 20;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // Outer bronze rim — multi-layer for matericity
  // 1: dark bronze outer edge
  drawPolygonPath(verts);
  ctx.lineWidth = 8;
  ctx.strokeStyle = '#5a3810';
  ctx.stroke();

  // 2: mid bronze
  drawPolygonPath(verts);
  ctx.lineWidth = 6;
  const rimGrad = ctx.createLinearGradient(CX - currentOuter, CY - currentOuter, CX + currentOuter, CY + currentOuter);
  rimGrad.addColorStop(0, '#d4953c');
  rimGrad.addColorStop(0.25, '#c8873a');
  rimGrad.addColorStop(0.5, '#e4a54a');
  rimGrad.addColorStop(0.75, '#b07028');
  rimGrad.addColorStop(1, '#d4953c');
  ctx.strokeStyle = rimGrad;
  ctx.stroke();

  // 3: bright specular highlight on rim
  drawPolygonPath(verts);
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(244,220,170,.35)';
  ctx.stroke();

  // Star face — ivory / white-gold satin
  drawPolygonPath(verts);
  const faceGrad = ctx.createRadialGradient(CX - currentOuter * 0.15, CY - currentOuter * 0.15, 3, CX, CY, currentOuter);
  faceGrad.addColorStop(0, '#f8f2e2');
  faceGrad.addColorStop(0.15, '#f0eaD8');
  faceGrad.addColorStop(0.4, '#e8e0c8');
  faceGrad.addColorStop(0.7, '#ddd4b8');
  faceGrad.addColorStop(1, '#c8bfa0');
  ctx.fillStyle = faceGrad;
  ctx.fill();

  // Subtle satin sheen overlay
  drawPolygonPath(verts);
  const satinGrad = ctx.createLinearGradient(CX - currentOuter, CY - currentOuter * 0.5, CX + currentOuter, CY + currentOuter * 0.5);
  satinGrad.addColorStop(0, 'rgba(255,250,235,.08)');
  satinGrad.addColorStop(0.3, 'rgba(255,250,235,.02)');
  satinGrad.addColorStop(0.5, 'rgba(200,180,140,.04)');
  satinGrad.addColorStop(0.7, 'rgba(255,250,235,.01)');
  satinGrad.addColorStop(1, 'rgba(255,250,235,.06)');
  ctx.fillStyle = satinGrad;
  ctx.fill();

  // Inner bevel — gold shadow
  drawPolygonPath(verts);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(138,100,32,.45)';
  ctx.stroke();

  // Concentric etch lines
  ctx.globalAlpha = 0.08;
  for (let ring = 1; ring <= 10; ring++) {
    const rFrac = ring / 11;
    const ringVerts = starVertices(CX, CY, currentOuter * rFrac, currentInner * rFrac);
    drawPolygonPath(ringVerts);
    ctx.strokeStyle = '#8a6420';
    ctx.lineWidth = 0.4;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Tick marks on rim
  ctx.strokeStyle = 'rgba(200,135,58,.4)';
  for (let i = 0; i < 72; i++) {
    const a = (i / 72) * Math.PI * 2 - Math.PI / 2;
    const major = i % 6 === 0;
    const tickLen = major ? 10 : 4;
    const r1 = currentOuter - 1;
    const r2 = currentOuter + tickLen;
    ctx.beginPath();
    ctx.moveTo(CX + Math.cos(a) * r1, CY + Math.sin(a) * r1);
    ctx.lineTo(CX + Math.cos(a) * r2, CY + Math.sin(a) * r2);
    ctx.lineWidth = major ? 1.2 : 0.6;
    ctx.stroke();
  }

  ctx.restore();
}

function drawCore(progress) {
  if (progress <= 0) return;
  const r = 22 * progress;
  ctx.save();

  // Outer halo
  ctx.beginPath();
  ctx.arc(CX, CY, r * 1.6, 0, Math.PI * 2);
  const haloGrad = ctx.createRadialGradient(CX, CY, r * 0.5, CX, CY, r * 1.6);
  haloGrad.addColorStop(0, 'rgba(200,135,58,.15)');
  haloGrad.addColorStop(0.6, 'rgba(200,135,58,.04)');
  haloGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = haloGrad;
  ctx.fill();

  // Convex bronze core
  const coreGrad = ctx.createRadialGradient(CX - r * 0.25, CY - r * 0.25, 1, CX, CY, r);
  coreGrad.addColorStop(0, '#fce4a8');
  coreGrad.addColorStop(0.2, '#f0cc70');
  coreGrad.addColorStop(0.5, '#d4953c');
  coreGrad.addColorStop(0.8, '#a06828');
  coreGrad.addColorStop(1, '#704818');
  ctx.beginPath();
  ctx.arc(CX, CY, r, 0, Math.PI * 2);
  ctx.fillStyle = coreGrad;
  ctx.shadowColor = 'rgba(228,165,74,.7)';
  ctx.shadowBlur = 25 * progress;
  ctx.fill();

  // Bronze rim ring
  ctx.beginPath();
  ctx.arc(CX, CY, r, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(90,56,16,.6)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Specular highlight
  ctx.beginPath();
  ctx.arc(CX - r * 0.22, CY - r * 0.22, r * 0.45, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,245,210,.4)';
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawPillar(x, y, type, flash) {
  ctx.save();
  const r = 14;
  const isBlack = type === 'black';

  // Ground shadow (teal tinted)
  ctx.beginPath();
  ctx.ellipse(x, y + r + 5, r * 1.3, 6, 0, 0, Math.PI * 2);
  const shadowGrad = ctx.createRadialGradient(x, y + r + 5, 0, x, y + r + 5, r * 1.3);
  shadowGrad.addColorStop(0, `rgba(26,188,156,${isBlack ? 0.14 : 0.1})`);
  shadowGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = shadowGrad;
  ctx.fill();

  // Pillar body gradient
  const grad = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
  if (isBlack) {
    grad.addColorStop(0, '#22222e');
    grad.addColorStop(0.3, '#14141c');
    grad.addColorStop(0.7, '#0a0a12');
    grad.addColorStop(1, '#050508');
  } else {
    grad.addColorStop(0, '#faf3e0');
    grad.addColorStop(0.3, '#ece4cc');
    grad.addColorStop(0.7, '#d8d0b8');
    grad.addColorStop(1, '#c0b898');
  }

  // Octagonal shape
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 - Math.PI / 8;
    const px = x + Math.cos(a) * r;
    const py = y + Math.sin(a) * r;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Edge bevel
  ctx.strokeStyle = isBlack ? 'rgba(50,50,70,.5)' : 'rgba(200,180,140,.45)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Top specular dot
  ctx.beginPath();
  ctx.arc(x - 3, y - 3, r * 0.35, 0, Math.PI * 2);
  ctx.fillStyle = isBlack ? 'rgba(60,60,80,.2)' : 'rgba(255,250,235,.25)';
  ctx.fill();

  // Flash on hit
  if (flash > 0) {
    ctx.globalAlpha = flash;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 - Math.PI / 8;
      const px2 = x + Math.cos(a) * r;
      const py2 = y + Math.sin(a) * r;
      i === 0 ? ctx.moveTo(px2, py2) : ctx.lineTo(px2, py2);
    }
    ctx.closePath();
    ctx.fillStyle = isBlack ? 'rgba(26,188,156,.7)' : 'rgba(228,165,74,.8)';
    ctx.shadowColor = isBlack ? 'rgba(26,188,156,.8)' : 'rgba(228,165,74,.9)';
    ctx.shadowBlur = 18;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

// ============================================================
// BALL & TRAIL (physics untouched, visuals enhanced)
// ============================================================
const ball = { x: CX, y: CY, vx: 0, vy: 0, active: false, trail: [], targetX: CX, targetY: CY };

function drawBall(glow) {
  if (!ball.active) return;
  ctx.save();

  // Trail — warm bronze fading to teal
  for (let i = 0; i < ball.trail.length; i++) {
    const t = ball.trail[i];
    const frac = i / ball.trail.length;
    const alpha = frac * 0.65;
    const r = 2.5 + frac * 4.5;

    // Outer warm glow
    ctx.beginPath();
    ctx.arc(t.x, t.y, r * 1.8, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(228,165,74,${alpha * 0.15})`;
    ctx.fill();

    // Core trail dot
    ctx.beginPath();
    ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(228,165,74,${alpha})`;
    ctx.fill();

    // Teal inner
    ctx.beginPath();
    ctx.arc(t.x, t.y, r * 0.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(26,188,156,${alpha * 0.4})`;
    ctx.fill();
  }

  // Point light illumination
  const lightR = 90 + glow * 50;
  const lightGrad = ctx.createRadialGradient(ball.x, ball.y, 2, ball.x, ball.y, lightR);
  lightGrad.addColorStop(0, `rgba(228,165,74,${0.12 + glow * 0.18})`);
  lightGrad.addColorStop(0.3, `rgba(200,135,58,${0.05 + glow * 0.06})`);
  lightGrad.addColorStop(0.6, `rgba(26,188,156,${0.02 + glow * 0.03})`);
  lightGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = lightGrad;
  ctx.fillRect(ball.x - lightR, ball.y - lightR, lightR * 2, lightR * 2);

  // Ball body — layered for convexity
  const ballR = 7;

  // Halo
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ballR * 2.2, 0, Math.PI * 2);
  const halo = ctx.createRadialGradient(ball.x, ball.y, ballR, ball.x, ball.y, ballR * 2.2);
  halo.addColorStop(0, 'rgba(228,165,74,.25)');
  halo.addColorStop(1, 'transparent');
  ctx.fillStyle = halo;
  ctx.fill();

  // Main sphere
  const ballGrad = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 0.5, ball.x, ball.y, ballR);
  ballGrad.addColorStop(0, '#fffae8');
  ballGrad.addColorStop(0.2, '#f8e8a8');
  ballGrad.addColorStop(0.5, '#f0cc70');
  ballGrad.addColorStop(0.8, '#c8873a');
  ballGrad.addColorStop(1, '#906020');
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ballR, 0, Math.PI * 2);
  ctx.fillStyle = ballGrad;
  ctx.shadowColor = 'rgba(228,165,74,.9)';
  ctx.shadowBlur = 22;
  ctx.fill();
  ctx.shadowBlur = 0;

  // Rim ring
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ballR, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(90,56,16,.5)';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  // Specular dot
  ctx.beginPath();
  ctx.arc(ball.x - 2.2, ball.y - 2.2, 2.2, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,252,240,.6)';
  ctx.fill();

  ctx.restore();
}

// ============================================================
// SCREEN SHAKE (logic untouched)
// ============================================================
const shakeEl = document.getElementById('arena-shake');
let shakeIntensity = 0;
let shakeDecay = 0.92;

function triggerShake(magnitude, decay) {
  shakeIntensity = magnitude;
  shakeDecay = decay || 0.9;
}

function updateShake() {
  if (shakeIntensity > 0.3) {
    const sx = (Math.random() - 0.5) * shakeIntensity * 2;
    const sy = (Math.random() - 0.5) * shakeIntensity * 2;
    shakeEl.style.transform = `translate(${sx}px,${sy}px)`;
    shakeIntensity *= shakeDecay;
  } else {
    shakeEl.style.transform = '';
    shakeIntensity = 0;
  }
}

// ============================================================
// STATE MACHINE (completely untouched)
// ============================================================
let currentState = 'idle';
let stateStartTime = 0;
let animFrame = null;
let targetPoint = null;
let pillarFlashes = new Array(10).fill(0);

let blackPillarProgress = 0;
let gooProgress = 0;
let alabasterPillarProgress = 0;
let starProgress = 0;
let ballProgress = 0;
let starGlow = 0;
let resolutionTime = 0;
let lensFlareAlpha = 0;
let rippleT = 0;

function setState(newState) {
  currentState = newState;
  stateStartTime = performance.now();
  document.getElementById('state-indicator').textContent = newState;
  document.querySelector('#app').dataset.state = newState;
}

function easeOutBack(t) {
  const c1 = 1.70158; const c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
function easeOutElastic(t) {
  if (t === 0 || t === 1) return t;
  return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1;
}
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function runAnimation() {
  blackPillarProgress = 0;
  gooProgress = 0;
  alabasterPillarProgress = 0;
  starProgress = 0;
  ballProgress = 0;
  starGlow = 0;
  resolutionTime = 0;
  lensFlareAlpha = 0;
  rippleT = 0;
  ball.active = false;
  ball.trail = [];
  ball.x = CX; ball.y = CY;
  pillarFlashes.fill(0);
  targetPoint = pickTargetPoint();

  const overlay = document.getElementById('result-overlay');
  overlay.classList.remove('visible', 'success', 'failure');
  document.getElementById('golden-flash').className = '';
  document.getElementById('crimson-flash').className = '';
  shakeEl.classList.remove('quake-climax');

  if (animFrame) cancelAnimationFrame(animFrame);

  const T = CFG.timing;
  const timeline = [
    { at: 200, action: () => setState('threat-slam') },
    { at: 200 + T.blackSlam, action: () => {
      triggerShake(CFG.juice.shake, 0.88);
      for (let i = 0; i < 5; i++) pillarFlashes[i] = 1;
    }},
    { at: 200 + T.blackSlam + T.gooExpand, action: () => setState('agency-slam') },
    { at: 200 + T.blackSlam + T.gooExpand + T.alabasterSlam, action: () => {
      triggerShake(CFG.juice.shake * 0.7, 0.92);
      for (let i = 5; i < 10; i++) pillarFlashes[i] = 1;
    }},
    { at: 200 + T.blackSlam + T.gooExpand + T.alabasterSlam + T.starBurst, action: () => setState('the-roll') },
    { at: 200 + T.blackSlam + T.gooExpand + T.alabasterSlam + T.starBurst + T.ballSpin, action: () => setState('hit-stop') },
    { at: 200 + T.blackSlam + T.gooExpand + T.alabasterSlam + T.starBurst + T.ballSpin + T.hitStop, action: () => {
      setState('resolution');
      resolveResult();
    }},
  ];

  let timelineIdx = 0;
  const startTime = performance.now();
  setState('idle');

  function tick(now) {
    const elapsed = now - startTime;

    while (timelineIdx < timeline.length && elapsed >= timeline[timelineIdx].at) {
      timeline[timelineIdx].action();
      timelineIdx++;
    }

    const tBlackStart = 200;
    const tBlackEnd = tBlackStart + T.blackSlam;
    const tGooEnd = tBlackEnd + T.gooExpand;
    const tAlabStart = tGooEnd;
    const tAlabEnd = tAlabStart + T.alabasterSlam;
    const tStarEnd = tAlabEnd + T.starBurst;
    const tBallStart = tStarEnd;
    const tBallEnd = tBallStart + T.ballSpin;

    if (elapsed >= tBlackStart && elapsed < tBlackEnd) {
      const t = (elapsed - tBlackStart) / T.blackSlam;
      blackPillarProgress = easeOutBack(Math.min(1, t));
    } else if (elapsed >= tBlackEnd) {
      blackPillarProgress = 1;
    }

    if (elapsed >= tBlackEnd && elapsed < tGooEnd) {
      const t = (elapsed - tBlackEnd) / T.gooExpand;
      gooProgress = easeInOutCubic(Math.min(1, t));
    } else if (elapsed >= tGooEnd) {
      gooProgress = 1;
    }

    if (elapsed >= tAlabStart && elapsed < tAlabEnd) {
      const t = (elapsed - tAlabStart) / T.alabasterSlam;
      alabasterPillarProgress = easeOutBack(Math.min(1, t));
    } else if (elapsed >= tAlabEnd) {
      alabasterPillarProgress = 1;
    }

    if (elapsed >= tAlabEnd && elapsed < tStarEnd) {
      const t = (elapsed - tAlabEnd) / T.starBurst;
      starProgress = easeOutElastic(Math.min(1, t));
    } else if (elapsed >= tStarEnd) {
      starProgress = 1;
    }

    if (elapsed >= tBallStart && elapsed < tBallEnd + T.hitStop + 2000) {
      if (!ball.active && currentState === 'the-roll') {
        ball.active = true;
        const launchAngle = Math.random() * Math.PI * 2;
        ball.vx = Math.cos(launchAngle) * 14;
        ball.vy = Math.sin(launchAngle) * 14;
        ball.x = CX;
        ball.y = CY;
      }

      if (ball.active && currentState === 'the-roll') {
        const ballElapsed = elapsed - tBallStart;
        const ballFrac = ballElapsed / T.ballSpin;

        if (ballFrac < 0.5) {
          ball.vx += (Math.random() - 0.5) * 2.5;
          ball.vy += (Math.random() - 0.5) * 2.5;
          ball.vx *= 0.96;
          ball.vy *= 0.96;
        } else {
          const dx = targetPoint.x - ball.x;
          const dy = targetPoint.y - ball.y;
          const dist = Math.hypot(dx, dy);
          const force = CFG.juice.magnet * (ballFrac - 0.5) * 2;
          ball.vx += (dx / (dist + 1)) * force;
          ball.vy += (dy / (dist + 1)) * force;
          ball.vx *= 0.94;
          ball.vy *= 0.94;

          ball.vx += (Math.random() - 0.5) * (1 - ballFrac) * 1.5;
          ball.vy += (Math.random() - 0.5) * (1 - ballFrac) * 1.5;
        }

        ball.x += ball.vx;
        ball.y += ball.vy;

        const maxR = pillarRadius(Math.max(CFG.challengeStat, CFG.playerStat)) + 20;
        const dFromCenter = Math.hypot(ball.x - CX, ball.y - CY);
        if (dFromCenter > maxR) {
          const angle = Math.atan2(ball.y - CY, ball.x - CX);
          ball.x = CX + Math.cos(angle) * maxR;
          ball.y = CY + Math.sin(angle) * maxR;
          const dot = ball.vx * Math.cos(angle) + ball.vy * Math.sin(angle);
          ball.vx -= 2 * dot * Math.cos(angle);
          ball.vy -= 2 * dot * Math.sin(angle);
          ball.vx *= 0.8;
          ball.vy *= 0.8;
        }

        const challengeR = pillarRadius(CFG.challengeStat);
        const playerR = pillarRadius(CFG.playerStat);
        for (let i = 0; i < AXES; i++) {
          const a = -Math.PI / 2 + i * (2 * Math.PI / AXES);
          const bpx = CX + Math.cos(a) * challengeR * blackPillarProgress;
          const bpy = CY + Math.sin(a) * challengeR * blackPillarProgress;
          if (Math.hypot(ball.x - bpx, ball.y - bpy) < 22) {
            const na = Math.atan2(ball.y - bpy, ball.x - bpx);
            ball.vx = Math.cos(na) * 8;
            ball.vy = Math.sin(na) * 8;
            pillarFlashes[i] = 0.8;
            triggerShake(3, 0.85);
          }
          const apx = CX + Math.cos(a) * playerR * alabasterPillarProgress;
          const apy = CY + Math.sin(a) * playerR * alabasterPillarProgress;
          if (Math.hypot(ball.x - apx, ball.y - apy) < 22) {
            const na = Math.atan2(ball.y - apy, ball.x - apx);
            ball.vx = Math.cos(na) * 8;
            ball.vy = Math.sin(na) * 8;
            pillarFlashes[i + 5] = 0.8;
            triggerShake(2, 0.88);
          }
        }

        ball.trail.push({ x: ball.x, y: ball.y });
        if (ball.trail.length > CFG.juice.trail) ball.trail.shift();
      }

      if (currentState === 'hit-stop') {
        const hsElapsed = elapsed - tBallEnd;
        const hsFrac = Math.min(1, hsElapsed / T.hitStop);
        ball.x += (targetPoint.x - ball.x) * (0.15 + hsFrac * 0.5);
        ball.y += (targetPoint.y - ball.y) * (0.15 + hsFrac * 0.5);
        if (hsFrac > 0.8) {
          const overshoot = Math.sin((hsFrac - 0.8) * 5 * Math.PI) * 3 * (1 - hsFrac);
          ball.x += overshoot;
          ball.y += overshoot;
        }
        ball.trail.push({ x: ball.x, y: ball.y });
        if (ball.trail.length > CFG.juice.trail) ball.trail.shift();
      }
    }

    if (currentState === 'resolution') {
      resolutionTime += 1/60;
      if (targetPoint.success) {
        starGlow = Math.min(1, resolutionTime * 2);
        lensFlareAlpha = Math.max(0, 1 - resolutionTime * 1.5);
      } else {
        starGlow = Math.max(0, 1 - resolutionTime * 3);
      }
      rippleT = Math.min(1, resolutionTime * 0.8);
    }

    for (let i = 0; i < pillarFlashes.length; i++) {
      if (pillarFlashes[i] > 0) pillarFlashes[i] *= 0.92;
    }

    updateShake();
    draw();

    if (currentState !== 'resolution' || resolutionTime < 4) {
      animFrame = requestAnimationFrame(tick);
    }
  }

  animFrame = requestAnimationFrame(tick);
}

function resolveResult() {
  triggerShake(targetPoint.success ? CFG.juice.shake * 1.5 : CFG.juice.shake * 1.2, targetPoint.success ? 0.9 : 0.85);

  // CSS screenshake climax
  shakeEl.classList.remove('quake-climax');
  void shakeEl.offsetWidth;
  shakeEl.classList.add('quake-climax');

  // Flash
  if (targetPoint.success) {
    const gf = document.getElementById('golden-flash');
    gf.className = 'fire';
    setTimeout(() => { gf.className = 'fade'; }, 120);
  } else {
    const cf = document.getElementById('crimson-flash');
    cf.className = 'fire';
    setTimeout(() => { cf.className = 'fade'; }, 120);
  }

  const overlay = document.getElementById('result-overlay');
  const label = overlay.querySelector('.result-label');
  const sub = overlay.querySelector('.result-sub');

  setTimeout(() => {
    if (targetPoint.success) {
      overlay.classList.add('visible', 'success');
      label.textContent = targetPoint.critical ? 'Critical Success' : 'Success';
      sub.textContent = targetPoint.critical ? 'The stars align perfectly' : 'The astrolabe favors the bold';
    } else {
      overlay.classList.add('visible', 'failure');
      label.textContent = targetPoint.critical ? 'Critical Failure' : 'Failure';
      sub.textContent = targetPoint.critical ? 'The void consumes all' : 'The darkness prevails';
    }
  }, 200);
}

// ============================================================
// MAIN DRAW (visual composition, same structure)
// ============================================================
function draw() {
  drawStoneBackground();

  const challengeR = pillarRadius(CFG.challengeStat);
  const playerR = pillarRadius(CFG.playerStat);
  const innerStarR = playerR * 0.382;

  drawGoo(challengeR * gooProgress, gooProgress,
    currentState === 'resolution' ? targetPoint : null,
    currentState === 'resolution' ? rippleT : 0);

  if (gooProgress > 0.5) drawVeins(challengeR * gooProgress, (gooProgress - 0.5) * 2);

  drawStar(playerR, innerStarR, starProgress, starGlow);
  drawCore(starProgress);

  for (let i = 0; i < AXES; i++) {
    const a = -Math.PI / 2 + i * (2 * Math.PI / AXES);
    const r = challengeR * blackPillarProgress;
    if (blackPillarProgress > 0) {
      drawPillar(CX + Math.cos(a) * r, CY + Math.sin(a) * r, 'black', pillarFlashes[i]);
    }
  }

  for (let i = 0; i < AXES; i++) {
    const a = -Math.PI / 2 + i * (2 * Math.PI / AXES);
    const r = playerR * alabasterPillarProgress;
    if (alabasterPillarProgress > 0) {
      drawPillar(CX + Math.cos(a) * r, CY + Math.sin(a) * r, 'alabaster', pillarFlashes[i + 5]);
    }
  }

  drawBall(currentState === 'hit-stop' ? 1.5 : 1);

  // Lens flare — golden burst on success
  if (lensFlareAlpha > 0) {
    ctx.save();
    // Central white-gold flash
    const flareGrad = ctx.createRadialGradient(CX, CY, 0, CX, CY, 320);
    flareGrad.addColorStop(0, `rgba(255,250,230,${lensFlareAlpha * 0.9})`);
    flareGrad.addColorStop(0.15, `rgba(240,210,120,${lensFlareAlpha * 0.5})`);
    flareGrad.addColorStop(0.4, `rgba(228,165,74,${lensFlareAlpha * 0.2})`);
    flareGrad.addColorStop(0.7, `rgba(26,188,156,${lensFlareAlpha * 0.05})`);
    flareGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = flareGrad;
    ctx.fillRect(0, 0, W, H);

    // Anamorphic streak
    ctx.globalAlpha = lensFlareAlpha * 0.3;
    ctx.fillStyle = 'rgba(255,240,200,.8)';
    ctx.fillRect(0, CY - 1.5, W, 3);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // Smoke + darkness on failure
  if (currentState === 'resolution' && !targetPoint.success && resolutionTime > 0) {
    ctx.save();
    // Encroaching darkness
    const darkAlpha = Math.min(0.35, resolutionTime * 0.12);
    const darkGrad = ctx.createRadialGradient(ball.x, ball.y, 20, CX, CY, W * 0.5);
    darkGrad.addColorStop(0, 'transparent');
    darkGrad.addColorStop(0.6, `rgba(3,3,8,${darkAlpha * 0.3})`);
    darkGrad.addColorStop(1, `rgba(3,3,8,${darkAlpha})`);
    ctx.fillStyle = darkGrad;
    ctx.fillRect(0, 0, W, H);

    // Teal smoke wisps
    ctx.globalAlpha = Math.min(0.2, resolutionTime * 0.06);
    for (let i = 0; i < 8; i++) {
      const sx = CX + Math.sin(resolutionTime * 0.4 + i * 0.785) * (100 + i * 15);
      const sy = CY + Math.cos(resolutionTime * 0.25 + i * 1.1) * (70 + i * 10) - resolutionTime * 12;
      const sr = 35 + resolutionTime * 18 + i * 8;
      const smokeGrad = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
      smokeGrad.addColorStop(0, 'rgba(26,188,156,.1)');
      smokeGrad.addColorStop(0.5, 'rgba(13,122,95,.04)');
      smokeGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = smokeGrad;
      ctx.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
    }
    ctx.restore();
  }
}

// ============================================================
// CONTROLS WIRING (untouched)
// ============================================================
function wireSlider(id, valId, key, obj, transform) {
  const sl = document.getElementById(id);
  const vEl = document.getElementById(valId);
  sl.addEventListener('input', () => {
    const v = transform ? transform(sl.value) : Number(sl.value);
    if (obj) obj[key] = v; else CFG[key] = v;
    vEl.textContent = typeof v === 'number' ? (v % 1 ? v.toFixed(1) : v) : v;
  });
}

wireSlider('sl-player', 'vPlayer', 'playerStat');
wireSlider('sl-challenge', 'vChallenge', 'challengeStat');
wireSlider('sl-t-blackSlam', 'vt0', 'blackSlam', CFG.timing);
wireSlider('sl-t-gooExpand', 'vt1', 'gooExpand', CFG.timing);
wireSlider('sl-t-alabasterSlam', 'vt2', 'alabasterSlam', CFG.timing);
wireSlider('sl-t-starBurst', 'vt3', 'starBurst', CFG.timing);
wireSlider('sl-t-ballSpin', 'vt4', 'ballSpin', CFG.timing);
wireSlider('sl-t-hitStop', 'vt5', 'hitStop', CFG.timing);
wireSlider('sl-shake', 'vShake', 'shake', CFG.juice);
wireSlider('sl-trail', 'vTrail', 'trail', CFG.juice);
wireSlider('sl-magnet', 'vMagnet', 'magnet', CFG.juice, v => parseFloat(v));

document.getElementById('sel-verdict').addEventListener('change', e => { CFG.verdict = e.target.value; });
document.getElementById('chk-wounded').addEventListener('change', e => { CFG.wounded = e.target.checked; });
document.getElementById('chk-dead').addEventListener('change', e => { CFG.dead = e.target.checked; });
document.getElementById('btn-run').addEventListener('click', runAnimation);

drawStoneBackground();
draw();
</script>
